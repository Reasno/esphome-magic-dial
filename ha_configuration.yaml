sensor:
  - platform: history_stats
    name: 谷沁园写作业时长
    entity_id: light.xiaomi_cn_963754995_lamp35_s_2_light
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: 谷沁园打鼓时长
    entity_id: binary_sensor.da_gu_zhong
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "PlayStation 4 今日时长"
    entity_id: media_player.ps4_183_playstation_4
    state: "playing"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "PlayStation 5 今日时长"
    entity_id: sensor.sony_tv_source
    state: "PlayStation 5"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

template:
  - switch:
      - name: 小米AI音箱 播放控制
        unique_id: xiaomi_ai_speaker_play_switch
        icon: mdi:play-pause
        state: >
          {{ is_state('sensor.xiaomi_cn_114004415_s12_playing_state_p_4_1', '播放中') }}
        turn_on:
          service: button.press
          target:
            entity_id: button.xiaomi_cn_114004415_s12_play_a_4_2
        turn_off:
          service: button.press
          target:
            entity_id: button.xiaomi_cn_114004415_s12_pause_a_4_1
      - name: "Xiaomi智能家庭屏Mini 播放控制"
        unique_id: xiaomi_smart_display_mini_play_control
        state: >
          {{ is_state('sensor.xiaomi_cn_936551320_x4b_playing_state_p_3_1', '播放中') }}
        turn_on:
          service: button.press
          target:
            entity_id: button.xiaomi_cn_936551320_x4b_play_a_3_2
        turn_off:
          service: button.press
          target:
            entity_id: button.xiaomi_cn_936551320_x4b_pause_a_3_3
        icon: >
          {% if is_state('sensor.xiaomi_cn_936551320_x4b_playing_state_p_3_1', '播放中') %}
            mdi:play-circle
          {% else %}
            mdi:pause-circle
          {% endif %}
      - name: iMac 睡眠开关
        unique_id: imac_sleep_switch
        icon: >
          {% if is_state('binary_sensor.imac_online', 'on') %}
            mdi:monitor
          {% else %}
            mdi:monitor-off
          {% endif %}
        state: >
          {{ is_state('binary_sensor.imac_online', 'on') }}
        turn_on:
          service: wake_on_lan.send_magic_packet
          data:
            mac: "04:9D:05:25:05:44"
        turn_off:
          service: shell_command.imac_sleep
  - sensor:
      - name: "Sony TV Source"
        unique_id: sony_tv_source
        state: "{{ state_attr('media_player.sony_k_55xr50', 'source') }}"
  - button:
      - name: iMac 关机
        unique_id: imac_shutdown
        icon: mdi:power
        press:
          service: shell_command.imac_shutdown
      - name: iMac 睡眠
        unique_id: imac_sleep
        icon: mdi:sleep
        press:
          service: shell_command.imac_sleep

shell_command:
  ulanzi_set_display_mode: >-
    python3 /config/scripts/ulanzi_set_display_mode.py {{ target_mode }}
  ulanzi_force_tool_app: >-
    python3 /config/scripts/ulanzi_force_tool_app.py {{ tool_id }} {{ hold_seconds }}
  ulanzi_tr_progress: >-
    python3 /config/scripts/ulanzi_tr_frame.py progress {{ speed }} {{ percent }}
  ulanzi_tr_done: >-
    python3 /config/scripts/ulanzi_tr_frame.py done
  ulanzi_tr_done_dim: >-
    python3 /config/scripts/ulanzi_tr_frame.py done_dim
  ulanzi_tr_clear: >-
    python3 /config/scripts/ulanzi_tr_frame.py clear
  imac_shutdown: >-
    ssh -i /config/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 guxi@192.168.31.113 'sudo -n shutdown -h now'
  imac_sleep: >-
    ssh -i /config/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 guxi@192.168.31.113 'pmset sleepnow'

# Exclude high-frequency Ulanzi state updates from history/logbook noise
recorder:
  exclude:
    entities:
      - input_text.ulanzi_display_owner
      - timer.ulanzi_display_busy
    entity_globs:
      - sensor.ulanzi_*
      - mqtt.ulanzi_*

logbook:
  exclude:
    entities:
      - input_text.ulanzi_display_owner
      - timer.ulanzi_display_busy
      - automation.tong_bu_kan_dian_shi_sheng_yu_shi_jian_dao_ulanzi
      - automation.ulanzi_xian_shi_suo_chao_shi_zhong_zhi_owner
      - script.ulanzi_show_tv_status
      - automation.ulanzi_kong_xian_shi_xian_shi_shi_zhong
      - script.ulanzi_show_clock_status
    entity_globs:
      - sensor.ulanzi_*

