# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  packages: !include_dir_named packages

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

timer:
  ulanzi_display_busy:
    name: Ulanzi 显示占用
    duration: "00:00:30"

wake_on_lan:

# Dot. Canvas API for Home Assistant
# 基于官方 Canvas API 文档实现，支持发送自定义卡片、仪表盘和任意布局内容
# 完整文档: https://dot.mindreset.tech/docs/service/open/canvas_api
# ✅ FIXED: Object of type LoggingUndefined is not JSON serializable
rest_command:
  ulanzi_set_brightness_low:
    url: "http://192.168.31.32/setConfig"
    method: "post"
    content_type: "application/json"
    payload: >-
      {
        "brightness": {"level": "low", "low": 50, "mid": 80, "high": 100},
        "volume": 4,
        "carouselSpeed": 0,
        "scrollSpeed": 7,
        "timezone": "UTC+8",
        "dateFormat": "MM/DD",
        "showWeek": true,
        "weekStart": 1,
        "lowBatteryAutoSleep": false
      }
    timeout: 10
  ulanzi_set_brightness_high:
    url: "http://192.168.31.32/setConfig"
    method: "post"
    content_type: "application/json"
    payload: >-
      {
        "brightness": {"level": "high", "low": 50, "mid": 80, "high": 100},
        "volume": 4,
        "carouselSpeed": 0,
        "scrollSpeed": 7,
        "timezone": "UTC+8",
        "dateFormat": "MM/DD",
        "showWeek": true,
        "weekStart": 1,
        "lowBatteryAutoSleep": false
      }
    timeout: 10
  dot_text_api:
    url: "https://dot.mindreset.tech/api/authV2/open/device/B43A455B91AC/text"
    method: "post"
    content_type: "application/json"
    headers:
      Authorization: "Bearer dot_app_BPIXaZKMTKxshwepZfOIYTcqCpgYPhHeHemfWbnTrfYxHttxrZVJioSEuTRLInrD"
    payload: >
      {
        "refreshNow": true,
        "title": "{{ title | default('') }}",
        "message": "{{ message | default('') }}",
        "signature": "{{ signature | default('') }}",
        "link": "{{ nfc_link | default('') }}"
      }
    timeout: 15
    verify_ssl: true
    insecure_cipher: false
  dot_canvas_todo:
    url: "https://dot.mindreset.tech/api/authV2/open/device/B43A455B91AC/canvas"
    method: "post"
    content_type: "application/json"
    headers:
      Authorization: "Bearer dot_app_BPIXaZKMTKxshwepZfOIYTcqCpgYPhHeHemfWbnTrfYxHttxrZVJioSEuTRLInrD"
    payload: >-
      {
        "refreshNow": true,
        "taskKey": "ewIWk5Yvqx3W",
        "taskAlias": "今日任务",
        "data": {},
        "windowData": {
          "default": [{
            "type": "div",
            "props": {
              "tw": "flex flex-col w-full h-full bg-white text-black overflow-hidden",
              "children": [
                {"type":"div","props":{"tw":"flex flex-row flex-1 items-center w-full px-[8px] border-b border-black gap-[7px]","children":[{"type":"div","props":{"tw":"flex items-center justify-center w-[22px] h-[22px] border-2 border-black rounded-[3px] shrink-0 text-18-chillduansans font-bold","children":{{ english_marker | tojson }} }},{"type":"div","props":{"tw":"flex-1 min-w-0 text-18-chillduansans font-bold","children":{{ english_text | tojson }} }}]}},
                {"type":"div","props":{"tw":"flex flex-row flex-1 items-center w-full px-[8px] border-b border-black gap-[7px]","children":[{"type":"div","props":{"tw":"flex items-center justify-center w-[22px] h-[22px] border-2 border-black rounded-[3px] shrink-0 text-18-chillduansans font-bold","children":{{ drum_marker | tojson }} }},{"type":"div","props":{"tw":"flex-1 min-w-0 text-18-chillduansans font-bold","children":{{ drum_text | tojson }} }}]}},
                {"type":"div","props":{"tw":"flex flex-row flex-1 items-center w-full px-[8px] gap-[7px]","children":[{"type":"div","props":{"tw":"flex items-center justify-center w-[22px] h-[22px] border-2 border-black rounded-[3px] shrink-0 text-18-chillduansans font-bold","children":{{ homework_marker | tojson }} }},{"type":"div","props":{"tw":"flex-1 min-w-0 text-18-chillduansans font-bold","children":{{ homework_text | tojson }} }}]}}
              ]
            }
          }]
        },
        "layoutFull": {"tw":"p-0 bg-white","style":{"padding":0}},
        "border": 0
      }
    timeout: 15
    verify_ssl: true
    insecure_cipher: false

command_line:
  - binary_sensor:
      name: curl_google
      command: >-
        sh -c 'curl -s --max-time 5 https://google.com > /dev/null 2>&1 && echo success || echo fail'
      device_class: connectivity
      payload_on: "success"
      payload_off: "fail"
      scan_interval: 3600
      command_timeout: 10
  - sensor:
      name: 小米路由器CPU温度
      command: >-
        ssh -i /config/.ssh/id_rsa -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no -o ConnectTimeout=5 -q root@192.168.31.1 "cat /sys/class/thermal/thermal_zone0/temp" 2>/dev/null
      scan_interval: 60
      unit_of_measurement: "°C"
      state_class: measurement
      value_template: >
        {% if value and value | is_number %}
          {{ value | float | round(1) }}
        {% else %}
          {{ states('sensor.小米路由器cpu温度') | try('float') | default(none) }}
        {% endif %}
      command_timeout: 10
  - binary_sensor:
      name: imac_online
      command: >-
        ssh -i /config/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 guxi@192.168.31.113 'exit 0' && echo on || echo off
      payload_on: "on"
      payload_off: "off"
      device_class: connectivity
      scan_interval: 30
      command_timeout: 10

