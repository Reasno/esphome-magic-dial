            x: 0
            y: -27
            width: 360
            text_align: CENTER
            text: "--:--"
            text_font: font_pacifico_aod
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            clickable: false
        - label:
            id: lbl_aod_date
            align: TOP_MID
            y: 197
            width: 240
            height: 28
            text_align: CENTER
            hidden: true
            text: "正在同步时间"
            text_font: font_sc_20
            text_color: 0xFFFFFF
            bg_opa: TRANSP
        - label:
            id: lbl_aod_holiday
            align: TOP_MID
            y: 255
            width: 250
            height: 26
            text_align: CENTER
            long_mode: CLIP
            hidden: true
            text: ""
            text_font: font_sc_18
            text_color: 0xFFFFFF
            bg_color: 0x000000
            bg_opa: 40%
            radius: 8
            pad_all: 2
        # 2.0: music mode swaps the Pacifico date for a big MDI music note.
        # Hidden by default; render_lockscreen toggles it when the HomePod
        # starts / stops playing while the lock is on screen.
        - label:
            id: lbl_aod_music
            align: CENTER
            y: -27
            width: 200
            text_align: CENTER
            hidden: true
            text: "\U000F0759"  # mdi-music
            text_font: font_music_aod
            text_color: 0xFFFFFF
            bg_opa: TRANSP
