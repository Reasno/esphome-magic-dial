substitutions:
  device_name: magic-dial
  friendly_name: "Magic Dial"
  timezone: "Asia/Shanghai"

  # Magic Dial P6 / Midnight Orbit color tokens.
  color_bg_canvas: "0x03070A"
  color_bg_aod: "0x010304"
  color_bg_surface: "0x09131B"
  color_line_track: "0x14222C"
  color_line_tick: "0x263945"
  color_text_primary: "0xF2F6F8"
  color_text_secondary: "0xA5B4BD"
  color_text_tertiary: "0x617681"
  color_offline: "0xE66472"
  color_media: "0x49A8FF"
  color_light: "0xFFC05A"
  color_local: "0x45D6C5"

  # Home Assistant entities. Change only these substitutions if entity IDs differ.
  tv_entity: media_player.sony_k_55xr50
  tv_remote_entity: remote.sony_k_55xr50
  homepod_entity: media_player.ke_ting_ke_ting
  ceiling_light_entity: light.opple_cn_246509731_bydceiling_s_2_light
  strip_light_entity: light.yeelink_cn_48303523_strip1_s_2_light
  dining_room_climate_entity: climate.24dfa79bdf8f
  living_room_climate_entity: climate.24dfa7d09617
  floor_heating_entity: climate.suittc_cn_929054575_m302

  # Point this at a calendar that aggregates every holiday you want to display.
  # The current event's `message` attribute is shown verbatim; an inactive calendar
  # leaves the holiday line blank. This is intentionally not limited to Chinese holidays.
  holiday_calendar_entity: calendar.zhong_guo

  # 2.0: Weather Mode. `forecast_entity` reads a compact string sensor built by an HA
  # template helper (see weather.ha-helper.yaml in this directory) that packs 7 days
  # into "condition,high,low,DayName|..." for a single subscription.
  weather_entity: weather.home
  forecast_entity: sensor.va_weekly_forecast

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  # Hand-rolled PNG encoder for the Ulanzi knob bar. See publish_knob_bar.
  includes:
    - ulanzi_bar.h
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - light.turn_on:
          id: backlight_light
          brightness: !lambda 'return id(g_aod_backlight_pct) / 100.0f;'
      - lambda: |-
          id(g_last_activity) = millis();
          id(g_backlight_pct) = 100;
          id(g_ui_mode) = 0;
          id(g_sleeping) = true;
      - script.execute: render_aod
      - script.execute: render_lockscreen
      - lvgl.page.show:
          id: page_aod
          animation: fade_in
          time: 250ms

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB          # 16 MB flash (JC3636K718C)
  partitions: partitions.csv  # MAX app partitions (~7.94 MB/slot). Requires USB flashing!
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret magic_dial_api_key

ota:
  - platform: esphome
    password: !secret magic_dial_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.31.33
    gateway: 192.168.31.1
    subnet: 255.255.255.0
    dns1: 192.168.31.1
  ap:
    ssid: "Magic Dial Setup"

captive_portal:

# BLE scanning runs alongside Wi-Fi on the ESP32-S3. Active scanning lets the
# Home Assistant Bluetooth proxy request scan responses from nearby devices.
esp32_ble_tracker:

bluetooth_proxy:
  active: true

# MQTT is used for exactly one thing: driving the Ulanzi pixel clock's knob bar.
# The dial publishes a ready-made AWTRIX payload straight to
# `ulanzi_aa68/custom/test` on the shared EMQX broker - no Home Assistant round
# trip, so there is no per-frame `shell_command` (~140 ms) in the path and the bar
# tracks the knob smoothly. Everything else keeps using the native API, so all of
# ESPHome's own MQTT plumbing is turned off:
#   discovery / discover_ip: false - HA already owns these entities via the native
#                       API; leaving them on would create a duplicate device.
#   topic_prefix: null - suppresses the per-entity state/command topics. Requires
#                       log_topic / birth_message / will_message to be empty too.
#   reboot_timeout: 0s - never reboot just because EMQX is unreachable. The dial
#                       must stay usable without the broker.
mqtt:
  id: mqtt_client
  broker: 192.168.31.111
  port: 1883
  discovery: false
  discover_ip: false
  topic_prefix: null
  log_topic: null
  birth_message:
  will_message:
  reboot_timeout: 0s

# The physical knob is not a quadrature encoder. Each direction has its own
# active-low pulse input: left on GPIO2 and right on GPIO1.
binary_sensor:
  - platform: homeassistant
    id: tv_muted
    entity_id: ${tv_entity}
    attribute: is_volume_muted
    internal: true

  - platform: homeassistant
    id: homepod_muted
    entity_id: ${homepod_entity}
    attribute: is_volume_muted
    internal: true

  - platform: gpio
    name: "Knob Left"
    id: knob_left
    pin:
      number: GPIO2
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
    on_press:
      - lambda: |-
          const uint32_t now = millis();
          // The first knob pulse in AOD is consumed: wake only, never mutate state.
          if (id(g_sleeping)) {
            id(g_last_activity) = now;
            id(wake_display).execute();
            return;
          }
          const uint32_t elapsed = id(g_knob_last_pulse_ms) == 0 ? UINT32_MAX : now - id(g_knob_last_pulse_ms);
          if (id(g_knob_last_direction) == 1 && elapsed < 20) return;
          // Continuous acceleration curve: step % = (250 / elapsed) ^ 1.86, 1..20 %.
          const float e = (float) (elapsed > 250 ? 250 : (elapsed < 20 ? 20 : elapsed));
          id(g_knob_speed_pct) = (int) fminf(20.0f, fmaxf(1.0f, roundf(powf(250.0f / e, 1.86f))));
          id(g_knob_last_pulse_ms) = now;
          id(g_knob_last_direction) = -1;
          id(g_last_activity) = now;
      # 2.0 knob router: lock screen rotates the mode selector; each mode owns
      # its own knob handler. Home routes to handle_knob for legacy behaviour.
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 0;' }
          then:
            - script.execute: { id: sel_rotate, direction: -1 }
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 1;' }
          then:
            - lambda: |-
                auto active = [&](int target) -> bool {
                  if (target == 0) { const auto s=id(tv_state).state; return s=="playing"||s=="on"||s=="paused"; }
                  if (target == 1) { const auto s=id(homepod_state).state; return s=="playing"||s=="on"||s=="paused"; }
                  if (target == 2) return id(ceiling_light_state).state=="on";
                  if (target == 3) return id(strip_light_state).state=="on";
                  if (target == 4) { const auto s=id(climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
                  if (target == 5) { const auto s=id(dining_room_climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
                  if (target == 6) { const auto s=id(floor_heating_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
                  return false;
                };
                if (active(id(g_target))) id(handle_knob).execute(-1);
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 3;' }
          then:
            - script.execute: { id: timer_knob, direction: -1 }
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 4;' }
          then:
            - script.execute: { id: wx_knob, direction: -1 }
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 5;' }
          then:
            - script.execute: { id: setting_knob, direction: -1 }

  - platform: gpio
    name: "Knob Right"
    id: knob_right
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
    on_press:
      - lambda: |-
          const uint32_t now = millis();
          if (id(g_sleeping)) {
            id(g_last_activity) = now;
            id(wake_display).execute();
            return;
          }
          const uint32_t elapsed = id(g_knob_last_pulse_ms) == 0 ? UINT32_MAX : now - id(g_knob_last_pulse_ms);
          if (id(g_knob_last_direction) == -1 && elapsed < 20) return;
          const float e = (float) (elapsed > 250 ? 250 : (elapsed < 20 ? 20 : elapsed));
          id(g_knob_speed_pct) = (int) fminf(20.0f, fmaxf(1.0f, roundf(powf(250.0f / e, 1.86f))));
          id(g_knob_last_pulse_ms) = now;
          id(g_knob_last_direction) = 1;
          id(g_last_activity) = now;
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 0;' }
          then:
            - script.execute: { id: sel_rotate, direction: 1 }
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 1;' }
          then:
            - lambda: |-
                auto active = [&](int target) -> bool {
                  if (target == 0) { const auto s=id(tv_state).state; return s=="playing"||s=="on"||s=="paused"; }
                  if (target == 1) { const auto s=id(homepod_state).state; return s=="playing"||s=="on"||s=="paused"; }
                  if (target == 2) return id(ceiling_light_state).state=="on";
                  if (target == 3) return id(strip_light_state).state=="on";
                  if (target == 4) { const auto s=id(climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
                  if (target == 5) { const auto s=id(dining_room_climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
                  if (target == 6) { const auto s=id(floor_heating_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
                  return false;
                };
                if (active(id(g_target))) id(handle_knob).execute(1);
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 3;' }
          then:
            - script.execute: { id: timer_knob, direction: 1 }
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 4;' }
          then:
            - script.execute: { id: wx_knob, direction: 1 }
      - if:
          condition: { lambda: 'return id(g_ui_mode) == 5;' }
          then:
            - script.execute: { id: setting_knob, direction: 1 }

# PCM5100A enable: HIGH means unmuted.
switch:
  - platform: gpio
    name: "DAC Unmute"
    id: dac_unmute
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON

# Separate I2S buses are used for PCM5100A output and the PDM microphone.
i2s_audio:
  - id: i2s_out
    i2s_bclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true

  - id: i2s_in
    i2s_lrclk_pin: GPIO5

speaker:
  - platform: i2s_audio
    id: magic_dial_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO42
    dac_type: external
    channel: stereo
  # 2.0: a resampler is stacked on top of the raw i2s speaker so the
  # media_player component can push arbitrary-sample-rate WAV files (the
  # embedded alarm sound is 22 kHz). Everything else keeps using the raw
  # magic_dial_speaker id, so nothing existing needs to change.
  - platform: resampler
    id: magic_dial_media_speaker
    output_speaker: magic_dial_speaker

# 2.0: Timer alarm needs on-device audio playback. `alarm_sound` is downloaded
# from the reference project at compile time so no extra files must land on the
# device. media_player uses the announcement pipeline so short bursts do not
# fight with anything else that might play back-to-back.
media_player:
  - platform: speaker
    id: magic_dial_media
    name: "Magic Dial Alarm"
    internal: true
    announcement_pipeline:
      speaker: magic_dial_media_speaker
    files:
      - id: alarm_sound
        file: sounds/alarm.wav

microphone:
  - platform: i2s_audio
    id: magic_dial_microphone
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO4
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit

# ST77916 QSPI display bus.
spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO11
  data_pins: [GPIO13, GPIO14, GPIO15, GPIO16]

# CST816 touch controller bus.
i2c:
  id: touchscreen_bus
  sda: GPIO9
  scl: GPIO10

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_output

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight_light
    output: backlight_output
    restore_mode: ALWAYS_ON
    # Every brightness change ramps instead of stepping, so wake / sleep / manual
    # brightness edits all fade smoothly.
    default_transition_length: 400ms

  # 13-pixel WS2812 ring. RMT DMA keeps LED timing stable while LVGL/QSPI is busy.
  - platform: esp32_rmt_led_strip
    id: ring_light
    name: "${friendly_name} Ring"
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 13
    rgb_order: GRB
    chipset: WS2812
    rmt_symbols: 128
    use_dma: true
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - addressable_lambda:
          name: "Ring State"
          update_interval: 40ms
          lambda: |-
            const int n = it.size();
            if (id(g_sleeping)) {
              it.all() = Color(0, 0, 0);
              return;
            }
            float level = id(g_ring_brightness);
            if (id(g_target) == 0 || id(g_target) == 1) {
              // Slow 3-second breath, from 30% to 60% of the target color.
              const float phase = (millis() % 3000) / 3000.0f * 6.2831853f;
              level = 0.45f - 0.15f * cosf(phase);
            }
            const uint8_t r = (uint8_t) roundf(id(g_ring_r) * level);
            const uint8_t g = (uint8_t) roundf(id(g_ring_g) * level);
            const uint8_t b = (uint8_t) roundf(id(g_ring_b) * level);
            it.all() = Color(r, g, b);

      - addressable_lambda:
          name: "Ring Feedback"
          update_interval: 20ms
          lambda: |-
            const int n = it.size();
            const int kind = id(g_ring_feedback);
            if (kind == 1) {
              // One directional comet lap in 300 ms; direction follows the knob.
              const float elapsed = (float) (millis() - id(g_ring_feedback_started_ms));
              float head = fmodf(elapsed / 300.0f * n, (float) n);
              if (id(g_ring_direction) < 0) head = fmodf(n - head, (float) n);
              for (int i = 0; i < n; i++) {
                float d = id(g_ring_direction) > 0 ? head - i : i - head;
                while (d < 0) d += n;
                while (d >= n) d -= n;
                float tail = d < 4.0f ? 1.0f - d / 4.0f : 0.0f;
                tail *= tail;
                it[i] = Color(
                  (uint8_t) roundf(id(g_ring_r) * tail),
                  (uint8_t) roundf(id(g_ring_g) * tail),
                  (uint8_t) roundf(id(g_ring_b) * tail));
              }
            } else if (kind == 2) {
              it.all() = Color(255, 255, 255);  // device switch
            } else if (kind == 3) {
              it.all() = Color(id(g_ring_r), id(g_ring_g), id(g_ring_b));  // mode switch
            } else if (kind == 4) {
              it.all() = Color(255, 0, 0);      // tap acknowledgement
            } else {
              it.all() = Color(0, 0, 0);
            }

# Keep the manufacturer's complete ST77916 initialization sequence. It is
# specific to the JC3636K718C_I_YR1 and is not interchangeable with JC3636W518.
