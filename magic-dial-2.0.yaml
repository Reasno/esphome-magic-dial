    # =============== 2.0: Remote Mode ===============
    # Sony TV remote UI: 4 directional buttons + Confirm + Back + Power.
    # Every button dispatches the matching command via remote.send_command; the
    # visual layout uses a diamond of arrow labels around a central Confirm
    # button, with Back and Power flanking the bottom edge.
    - id: page_remote
      bg_color: ${color_bg_canvas}
      widgets:
        - obj:
            align: CENTER
            width: 320
            height: 320
            radius: 160
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x263945
            border_opa: 65%
            clickable: false
            scrollable: false
        - label:
            align: TOP_MID
            y: 26
            text: "Remote"
            text_font: font_sc_20
            text_color: 0xBFD0D8
        # 4-way directional pad
        - button:
            id: rmt_up
            align: CENTER
            x: 0
            y: -78
            width: 68
            height: 60
            radius: 14
            bg_color: 0x14222C
            bg_opa: COVER
            border_width: 1
            border_color: 0x263945
            on_click:
              - homeassistant.action:
                  action: remote.send_command
                  data: { entity_id: '${tv_remote_entity}', command: Up }
              - script.execute: ring_tap_feedback
            widgets:
              - label: { align: CENTER, text: "\u25B2", text_font: font_sc_44, text_color: 0xF2F6F8 }
        - button:
            id: rmt_down
            align: CENTER
            x: 0
            y: 78
            width: 68
            height: 60
            radius: 14
            bg_color: 0x14222C
            bg_opa: COVER
            border_width: 1
            border_color: 0x263945
            on_click:
              - homeassistant.action:
                  action: remote.send_command
                  data: { entity_id: '${tv_remote_entity}', command: Down }
              - script.execute: ring_tap_feedback
            widgets:
              - label: { align: CENTER, text: "\u25BC", text_font: font_sc_44, text_color: 0xF2F6F8 }
        - button:
            id: rmt_left
            align: CENTER
            x: -95
            y: 0
            width: 60
            height: 68
            radius: 14
            bg_color: 0x14222C
            bg_opa: COVER
            border_width: 1
            border_color: 0x263945
            on_click:
