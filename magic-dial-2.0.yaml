            bg_color: 0x0A0F14
            bg_opa: 88%
            border_width: 1
            border_color: 0x263945
            border_opa: 60%
            pad_all: 8
            clickable: false
            scrollable: false
            hidden: true
            widgets:
              - label:
                  id: sel_i1
                  align: LEFT_MID
