                  data: { entity_id: '${tv_remote_entity}', command: Left }
              - script.execute: ring_tap_feedback
            widgets:
              - label: { align: CENTER, text: "\u25C0", text_font: font_sc_44, text_color: 0xF2F6F8 }
        - button:
            id: rmt_right
            align: CENTER
            x: 95
            y: 0
            width: 60
            height: 68
            radius: 14
            bg_color: 0x14222C
            bg_opa: COVER
            border_width: 1
            border_color: 0x263945
            on_click:
              - homeassistant.action:
                  action: remote.send_command
                  data: { entity_id: '${tv_remote_entity}', command: Right }
              - script.execute: ring_tap_feedback
            widgets:
              - label: { align: CENTER, text: "\u25B6", text_font: font_sc_44, text_color: 0xF2F6F8 }
        # Centre Confirm
        - button:
            id: rmt_ok
            align: CENTER
            x: 0
            y: 0
            width: 82
            height: 82
            radius: 41
            bg_color: 0x1E3A4A
            bg_opa: COVER
            border_width: 2
            border_color: 0x49A8FF
            on_click:
              - homeassistant.action:
                  action: remote.send_command
                  data: { entity_id: '${tv_remote_entity}', command: Confirm }
              - script.execute: ring_tap_feedback
            widgets:
              - label: { align: CENTER, text: "OK", text_font: font_sc_24, text_color: 0xF2F6F8 }
        # Back (bottom-left corner)
        - button:
            id: rmt_back
            align: BOTTOM_MID
            x: -90
            y: -20
            width: 68
            height: 42
            radius: 21
            bg_color: 0x14222C
            bg_opa: COVER
            border_width: 1
            border_color: 0x263945
            on_click:
              - homeassistant.action:
                  action: remote.send_command
                  data: { entity_id: '${tv_remote_entity}', command: Back }
              - script.execute: ring_tap_feedback
            widgets:
              - label: { align: CENTER, text: "Back", text_font: font_sc_18, text_color: 0xF2F6F8 }
        # Power (bottom-right, red)
        - button:
            id: rmt_power
            align: BOTTOM_MID
            x: 90
            y: -20
            width: 68
            height: 42
            radius: 21
            bg_color: 0x8B1F2A
            bg_opa: COVER
            border_width: 1
            border_color: 0xE66472
            on_click:
              - homeassistant.action:
                  action: media_player.toggle
                  data: { entity_id: '${tv_entity}' }
              - script.execute: ring_tap_feedback
            widgets:
              - label: { align: CENTER, text: "PWR", text_font: font_sc_18, text_color: 0xF2F6F8 }

    # =============== 2.0: Timer Mode ===============
    # Countdown ring + big MM:SS display. Ported from base/screens/timer.yaml
    # via base/core.yaml's page_timer, remapped to Magic Dial's own colour
    # tokens. Buttons on-screen mirror the tap dispatcher (start / pause /
    # halt) so a user without knob access can still operate it.
    - id: page_timer
      bg_color: ${color_bg_canvas}
      widgets:
        - obj:
            id: timer_ring_out
            align: CENTER
            width: 332
            height: 332
            radius: 166
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x263945
            border_opa: 65%
            clickable: false
            scrollable: false
        - arc:
            id: timer_arc
            align: CENTER
            width: 300
            height: 300
            arc_width: 14
            adjustable: false
            min_value: 0
            max_value: 100
            value: 100
            start_angle: 271
            end_angle: 269
            arc_color: 0x1C2027
            indicator:
              arc_color: 0x2FB85C
              arc_width: 14
        - label:
            id: timer_cap
            align: CENTER
            y: -72
            text: "SET"
            text_font: font_sc_20
            text_color: 0x6F9A92
        - label:
            id: timer_big
            align: CENTER
            y: -14
            text: "5:00"
            text_font: font_mono_76
            text_color: 0xFFFFFF
        - label:
            align: CENTER
            y: 42
            text: "点击/旋钮"
            text_font: font_sc_16
            text_color: 0x617681

    # =============== 2.0: Weather Mode ===============
    # Copied from base/screens/weather.yaml (the reference project) with the
    # PNG-sprite animation replaced by a single MDI hero glyph so the flash
    # footprint stays reasonable.
    - id: page_weather
      bg_color: 0x0B1020
      widgets:
        - obj:
            id: wx_bg
            align: CENTER
            x: 0
            y: 0
            width: 360
            height: 360
            radius: 0
            bg_color: 0x1C2838
            bg_opa: COVER
            border_width: 0
        - obj:
            id: wx_ring_out
            align: CENTER
            width: 348
            height: 348
            radius: 174
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x33455C
            border_opa: 55%
            clickable: false
            scrollable: false
        - obj:
            id: wx_glow
            x: 152
            y: 12
            width: 56
            height: 56
            radius: 28
            bg_color: 0xCAD6E8
            bg_opa: 30%
            border_width: 0
            hidden: true
        # 7 rim glyphs; positioned by wx_render based on how many days the HA
        # helper actually returned.
        - label: { id: wx_d0, align: CENTER, x: 0, y: 0, text: "", text_font: font_sel_icons_32, text_color: 0xDCE6F2, hidden: true }
        - label: { id: wx_d1, align: CENTER, x: 0, y: 0, text: "", text_font: font_sel_icons_32, text_color: 0xDCE6F2, hidden: true }
        - label: { id: wx_d2, align: CENTER, x: 0, y: 0, text: "", text_font: font_sel_icons_32, text_color: 0xDCE6F2, hidden: true }
        - label: { id: wx_d3, align: CENTER, x: 0, y: 0, text: "", text_font: font_sel_icons_32, text_color: 0xDCE6F2, hidden: true }
        - label: { id: wx_d4, align: CENTER, x: 0, y: 0, text: "", text_font: font_sel_icons_32, text_color: 0xDCE6F2, hidden: true }
        - label: { id: wx_d5, align: CENTER, x: 0, y: 0, text: "", text_font: font_sel_icons_32, text_color: 0xDCE6F2, hidden: true }
        - label: { id: wx_d6, align: CENTER, x: 0, y: 0, text: "", text_font: font_sel_icons_32, text_color: 0xDCE6F2, hidden: true }
        # Hero glyph in the centre stage.
        - label:
            id: wx_hero_icon
            align: CENTER
            x: 0
            y: -60
            text: "\U000F0599"  # mdi-weather-sunny
            text_font: font_wx_hero
            text_color: 0xFFD061
        - label:
            id: wx_day
            align: CENTER
            x: 0
            y: 6
            text: "TODAY"
            text_font: font_sc_18
            text_color: 0x9AA6B2
        - label:
            id: wx_htemp
            align: CENTER
            x: 0
            y: 40
            text: "--"
            text_font: font_mono_40
            text_color: 0xFFFFFF
        - label:
            id: wx_cond
            align: CENTER
            x: 0
            y: 82
            text: ""
            text_font: font_sc_18
            text_color: 0xCFE0F2

    # =============== 2.0: Setting Mode ===============
    # Four-row control panel. Row indicator dots at the top, the current name
    # + value in the centre, an arc showing the numeric value. Swipe up/down
    # cycles rows; the knob adjusts the current row; a tap runs the mute
    # cascade defined by setting_tap.
    - id: page_setting
      bg_color: ${color_bg_canvas}
      widgets:
        - arc:
            id: set_arc
            align: CENTER
            width: 316
            height: 316
            arc_width: 8
            adjustable: false
            min_value: 0
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            arc_color: ${color_line_track}
            indicator:
              arc_color: ${color_local}
              arc_width: 8
        - label:
            align: TOP_MID
            y: 40
            text: "设置"
            text_font: font_sc_20
            text_color: 0xBFD0D8
        - label:
            id: set_row_name
            align: CENTER
            y: -70
            text: "本机音量"
            text_font: font_sc_24
            text_color: 0xBFD0D8
        - label:
            id: set_value
            align: CENTER
            y: -8
            text: "50"
            text_font: font_mono_76
            text_color: ${color_text_primary}
        - label:
            id: set_unit
            align: CENTER
            x: 88
            y: 12
            text: "%"
            text_font: font_sc_20
            text_color: 0x60747E
        # 4 row dots at the bottom
        - obj: { id: set_dot0, align: BOTTOM_MID, x: -30, y: -50, width: 8, height: 8, radius: 4, bg_color: 0xF2F6F8, border_width: 0, clickable: false, scrollable: false }
        - obj: { id: set_dot1, align: BOTTOM_MID, x: -10, y: -50, width: 8, height: 8, radius: 4, bg_color: 0x37464D, border_width: 0, clickable: false, scrollable: false }
        - obj: { id: set_dot2, align: BOTTOM_MID, x: 10,  y: -50, width: 8, height: 8, radius: 4, bg_color: 0x37464D, border_width: 0, clickable: false, scrollable: false }
        - obj: { id: set_dot3, align: BOTTOM_MID, x: 30,  y: -50, width: 8, height: 8, radius: 4, bg_color: 0x37464D, border_width: 0, clickable: false, scrollable: false }
