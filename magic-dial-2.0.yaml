  - platform: homeassistant
    id: tv_position
    entity_id: ${tv_entity}
    attribute: media_position
    internal: true

  - platform: homeassistant
    id: tv_duration
    entity_id: ${tv_entity}
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: homepod_position
    entity_id: ${homepod_entity}
