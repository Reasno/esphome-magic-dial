      - [0xD2, 0x56]
      - [0xD3, 0x65]
      - [0xD4, 0x74]
      - [0xD5, 0x88]
      - [0xD6, 0x99]
      - [0xD7, 0x01]
      - [0xD8, 0xBB]
      - [0xD9, 0xAA]
      - [0xF3, 0x01]
      - [0xF0, 0x00]
      - [0x21, 0x00]
      - [0x11, 0x00]
      - delay 120ms
      - [0x29, 0x00]

touchscreen:
  - platform: cst816
    id: main_touchscreen
    i2c_id: touchscreen_bus
    interrupt_pin: GPIO7
    reset_pin: GPIO8
    display: main_display
    # ESPHome 2026.7.x 的 CST816 驱动没有 on_gesture，也不会直接暴露
    # SWIPE_LEFT 等枚举。手势需通过坐标增量自行识别。
    # touch_timeout 会在最后一次触摸中断后继续轮询，确保抬手时触发
    # on_release；若不设置，部分 CST816 固件不会为抬手产生 IRQ，导致
    # dispatch_gesture 永远不执行。
    touch_timeout: 100ms
    on_touch:
      - lambda: |-
          id(g_touch_x0) = (int) touch.x;
          id(g_touch_y0) = (int) touch.y;
          id(g_touch_dx) = 0;
          id(g_touch_dy) = 0;
          id(g_touch_t0) = millis();
          id(g_wake_consume) = id(g_sleeping);
          id(g_last_activity) = millis();
      - if:
          condition:
            lambda: 'return id(g_sleeping);'
          then:
            - script.execute: wake_display
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(g_touch_dx) = (int) touches[0].x - id(g_touch_x0);
            id(g_touch_dy) = (int) touches[0].y - id(g_touch_y0);
          }
          id(g_last_activity) = millis();
    on_release:
      - lambda: |-
          // The panel is rotated 180 deg in hardware, but the touch controller
          // still reports raw unrotated coordinates, so both axes must be
          // negated for swipe direction to match what the user sees.
          const int dx = -id(g_touch_dx);
          const int dy = -id(g_touch_dy);
          const uint32_t held = millis() - id(g_touch_t0);
          int gesture = -1;
          if (abs(dx) > 50 && abs(dx) > abs(dy)) gesture = dx < 0 ? 2 : 3;
          else if (abs(dy) > 50 && abs(dy) > abs(dx)) gesture = dy < 0 ? 4 : 5;
          else if (abs(dx) < 16 && abs(dy) < 16) gesture = held >= 600 ? 1 : 0;
          if (id(g_wake_consume)) {
            gesture = -1;
            id(g_wake_consume) = false;
          }
          id(g_gesture) = gesture;
          id(g_last_activity) = millis();
      - script.execute: dispatch_gesture

# Home Assistant time drives the sleep clock and Chinese date/weekday text.
time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time:
      # 2.0: the lock screen shows a MM.DD date, not a HH:MM clock, so the
      # per-minute repaint of the AOD is gone. The date refreshes once per day
      # at 00:00, plus every wake / boot (via render_lockscreen).
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - if:
              condition: { lambda: 'return id(g_sleeping);' }
              then:
                - script.execute: render_lockscreen

# State subscriptions used by the P2 local priority resolver.
text_sensor:
  - platform: homeassistant
    id: tv_state
    entity_id: ${tv_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: homepod_state
    entity_id: ${homepod_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha
      # 2.0 music mode: HomePod state flipping to/from "playing" while the dial
      # is on the lockscreen swaps the Pacifico date for a music icon (and
      # starts / stops the family-photo rotation).
      - if:
          condition: { lambda: 'return id(g_sleeping) && id(g_ui_mode) == 0;' }
          then:
            - script.execute: render_lockscreen

  - platform: homeassistant
    id: ceiling_light_state
    entity_id: ${ceiling_light_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: strip_light_state
    entity_id: ${strip_light_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: strip_light_hs_color
    entity_id: ${strip_light_entity}
    attribute: hs_color
    internal: true
    on_value:
      - lambda: |-
          // HA serialises the hs_color attribute as a Python tuple, e.g. "(240.0, 100.0)",
          // but older builds also emitted "[240.0, 100.0]". Skip whatever bracket style
          // arrives and parse the first number, otherwise hue stays NaN forever and the
          // knob always restarts from 0.
          const char *p = x.c_str();
          while (*p != '\0' && !(*p == '-' || *p == '.' || (*p >= '0' && *p <= '9'))) p++;
          float hue = 0.0f;
          if (*p != '\0' && sscanf(p, "%f", &hue) == 1) id(strip_light_hue).publish_state(hue);
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: climate_state
    entity_id: ${living_room_climate_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: dining_room_climate_state
    entity_id: ${dining_room_climate_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: floor_heating_state
    entity_id: ${floor_heating_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: holiday_calendar_state
    entity_id: ${holiday_calendar_entity}
    internal: true
    on_value:
      - script.execute: render_aod

  - platform: homeassistant
    id: holiday_calendar_name
    entity_id: ${holiday_calendar_entity}
    attribute: message
    internal: true
    on_value:
      - script.execute: render_aod

  # ==================== 2.0: Weather Mode subscriptions ====================
  # `wx_now_state` = the weather entity's current condition string (sunny,
  # cloudy, rainy, ...). Used for the centre icon + label when day 0 is shown.
  - platform: homeassistant
    id: wx_now_state
    entity_id: ${weather_entity}
    internal: true
    on_value:
      - lambda: 'id(g_wx_state_cur) = x;'
      - script.execute: wx_render
  # `wx_week` = compact 7-day forecast string from the HA helper (see
  # weather.ha-helper.yaml). Format per segment: "condition,high,low,DayName",
  # segments joined with "|". Up to 7 segments; extra ones are dropped.
  - platform: homeassistant
    id: wx_week
    entity_id: ${forecast_entity}
    internal: true
    on_value:
      - lambda: |-
          std::string s = x;
          for (int i = 0; i < 7; i++) { id(g_wx_cond)[i] = ""; id(g_wx_icon)[i] = ""; }
          int n = 0; size_t pos = 0;
          while (n < 7) {
            size_t bar = s.find('|', pos);
            std::string seg = (bar == std::string::npos) ? s.substr(pos) : s.substr(pos, bar - pos);
            size_t c1 = seg.find(',');
            if (c1 != std::string::npos) {
              size_t c2 = seg.find(',', c1 + 1);
              size_t c3 = (c2 != std::string::npos) ? seg.find(',', c2 + 1) : std::string::npos;
              if (c2 != std::string::npos && c3 != std::string::npos) {
                std::string cond = seg.substr(0, c1);
                id(g_wx_cond)[n] = cond;
                // Compact MDI glyphs. Full set is documented in weather.yaml.
                std::string g;
                if (cond == "sunny") g = "󰖙";
                else if (cond == "clear-night") g = "󰖔";
                else if (cond == "partlycloudy") g = "󰖕";
                else if (cond == "fog") g = "󰖑";
                else if (cond == "windy" || cond == "windy-variant") g = "󰖝";
                else if (cond == "lightning" || cond == "lightning-rainy") g = "󰖓";
                else if (cond == "pouring") g = "󰖖";
                else if (cond == "rainy") g = "󰖗";
                else if (cond == "snowy" || cond == "snowy-rainy" || cond == "hail") g = "󰖘";
                else g = "󰖐";
                id(g_wx_icon)[n] = g;
                id(g_wx_hi)[n] = atoi(seg.substr(c1 + 1, c2 - c1 - 1).c_str());
                id(g_wx_lo)[n] = atoi(seg.substr(c2 + 1, c3 - c2 - 1).c_str());
                id(g_wx_name)[n] = seg.substr(c3 + 1);
                n++;
              }
            }
            if (bar == std::string::npos) break;
            pos = bar + 1;
          }
          id(g_wx_n) = n;
          if (id(g_wx_day) >= n) id(g_wx_day) = 0;
      - script.execute: wx_render

sensor:
  - platform: homeassistant
    id: tv_volume
    entity_id: ${tv_entity}
    attribute: volume_level
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: homepod_volume
