            # Background permanently removed: the wheel reads purely through type size,
            # color and opacity. Nothing animates this object any more.
            bg_opa: TRANSP
            border_width: 0
            clickable: false
            scrollable: false
        - obj:
            id: wheel_box
            align: TOP_MID
            y: 214
            width: 200
            height: 96
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: false
            scrollable: false
            widgets:
              - label:
                  # Upper slot: previous option, bleeding in ghosted.
                  id: lbl_wheel_prev
                  align: TOP_MID
                  y: 6
                  width: 190
                  text_align: CENTER
                  text: ""
                  text_font: font_sc_16
                  text_color: 0x36505D
                  text_opa: 40%
              - label:
                  # Centre slot (28-68): the selected mode, full size and colour.
                  id: lbl_mode
                  align: TOP_MID
                  y: 34
                  width: 190
                  text_align: CENTER
                  text: "本机音量"
                  text_font: font_sc_20
                  text_color: ${color_local}
              - label:
                  # Lower slot: next option, bleeding in ghosted.
                  id: lbl_wheel_next
                  align: TOP_MID
                  y: 66
                  width: 190
                  text_align: CENTER
                  text: ""
                  text_font: font_sc_16
                  text_color: 0x36505D
                  text_opa: 40%
        # Seven reusable dots are dynamically centered/hidden by render_main.
        - obj: { id: dot_0, align: TOP_MID, x: -48, y: 311, width: 6, height: 6, radius: 3, bg_color: '${color_text_tertiary}', border_width: 0, clickable: false, scrollable: false }
        - obj: { id: dot_1, align: TOP_MID, x: -32, y: 311, width: 6, height: 6, radius: 3, bg_color: '${color_text_tertiary}', border_width: 0, clickable: false, scrollable: false }
        - obj: { id: dot_2, align: TOP_MID, x: -16, y: 311, width: 6, height: 6, radius: 3, bg_color: '${color_text_tertiary}', border_width: 0, clickable: false, scrollable: false }
        - obj: { id: dot_3, align: TOP_MID, x: 0,   y: 311, width: 6, height: 6, radius: 3, bg_color: '${color_text_tertiary}', border_width: 0, clickable: false, scrollable: false }
        - obj: { id: dot_4, align: TOP_MID, x: 16,  y: 311, width: 6, height: 6, radius: 3, bg_color: '${color_text_tertiary}', border_width: 0, clickable: false, scrollable: false }
        - obj: { id: dot_5, align: TOP_MID, x: 32,  y: 311, width: 6, height: 6, radius: 3, bg_color: '${color_text_tertiary}', border_width: 0, clickable: false, scrollable: false }
        - obj: { id: dot_6, align: TOP_MID, x: 48,  y: 311, width: 6, height: 6, radius: 3, bg_color: '${color_text_tertiary}', border_width: 0, clickable: false, scrollable: false }

    # Low-refresh LCD AOD: exact P6 geometry, minute-only updates, no calendar placeholder.
    - id: page_aod
      bg_color: 0x000000
      widgets:
        # Keep a one-pixel generated canvas so ESPHome enables LVGL's canvas
        # module. The real 360x360 canvas below binds the loader's two PSRAM
        # buffers directly and allocates no third framebuffer.
        - canvas:
            id: aod_canvas_feature_anchor
            width: 1
            height: 1
            hidden: true
        - image:
            id: aod_media_image
            align: CENTER
            width: 360
            height: 360
            # Hidden boot-time placeholder; the main-loop callback replaces it
            # with one of the loader's two PSRAM-backed RGB565 descriptors.
            src: img_doubao_avatar
            hidden: true
            clickable: false
        # Pure black AOD background: the lockscreen photo was removed, so no
        # halo copies are needed behind the digits.
        - label:
            id: lbl_aod_time
            align: CENTER
            x: 0
            y: -27
            width: 360
            text_align: CENTER
            text: "--:--"
            text_font: font_pacifico_aod
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            clickable: false
        - label:
            id: lbl_aod_date
            align: TOP_MID
            y: 197
            width: 240
            height: 28
            text_align: CENTER
            hidden: true
            text: "正在同步时间"
            text_font: font_sc_20
            text_color: 0xFFFFFF
            bg_opa: TRANSP
        - label:
            id: lbl_aod_holiday
            align: TOP_MID
            y: 255
            width: 250
            height: 26
            text_align: CENTER
            long_mode: CLIP
            hidden: true
            text: ""
            text_font: font_sc_18
            text_color: 0xFFFFFF
            bg_color: 0x000000
            bg_opa: 40%
            radius: 8
            pad_all: 2

    - id: page_va  # [VA]
      # Pure black, not the ${color_bg_canvas} token the other pages use, and
      # bg_opa is pinned explicitly rather than left to LVGL's default.
      # This is no longer about matching a pre-rendered frame background (the
      # ribbons are gone); it stays 0x000000 because the assistant surface is
      # meant to read as a single dark hero page, and on this round LCD true
      # black merges with the unlit bezel so the 360x360 square is invisible.
      # Any lighter token (0x03070A quantises to RGB565 (0,4,8)) is measurably
      # brighter than the panel's own black and reveals the panel edge.
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # [VA] Static outer ring: gives the round canvas a visible frame so the
        # assistant state always reads as centred on the 360x360 display.
        # NOTE: never combine `x`/`y` with `align:` here -- in LVGL x/y are
        # offsets *from* the alignment point, so `x: 180, y: 180, align: CENTER`
        # pushes a widget 180 px right/down and off the visible circle.
        - arc:
            id: va_frame
            align: CENTER
            width: 320
            height: 320
            arc_width: 2
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 0
            end_angle: 360
            adjustable: false
            arc_color: 0x0E2A33
            indicator:
              arc_opa: 0%
        # [VA] Motion layer, phase 1 (listening): an icon-blue ring whose opacity
        # and thickness breathe. Pure vector -- zero flash, ~200 B of LVGL object
        # state, and the redraw is one anti-aliased ring rather than a blitted
        # frame, which is what matters while the microphone is streaming (loop
        # stalls are what starve the mic ring buffer -- see the buffer_size
        # comments below). It is a full 0-360 track on the MAIN part; the
        # indicator is kept invisible so nothing has to be recomputed per tick
        # except style properties.
        - arc:
            id: va_breath
            align: CENTER
            width: 300
            height: 300
            arc_width: 3
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 0
            end_angle: 360
            adjustable: false
            arc_color: ${color_va_listening}
            arc_opa: 0%
            hidden: true
            indicator:
              arc_opa: 0%
        # [VA] DORMANT: former speaking-phase comet. Kept defined (and referenced
        # by the zoom transitions) purely so the orbit can be brought back with a
        # one-line change, but va_render now hides it unconditionally and
        # va_motion no longer drives it -- redrawing this 320 px anti-aliased ring
        # every 70 ms starved the TTS audio path of main-loop time and made the
        # spoken answer stutter. During speaking only the static va_frame shows.
        #
        # 320x320, NOT 340: at 340 px the 6 px stroke sits at radius 167-170 on a
        # 360 px panel, i.e. exactly on the glass edge, where the round bezel
        # clips it -- which is why "speaking" looked like it had no orbit at all
        # while the 320 px va_frame and the 300 px va_breath were both clearly
        # visible. Sharing va_frame's 320 px radius also means the comet now
        # visibly rides *along* the static ring instead of floating outside it.
        - arc:
            id: va_sweep
            align: CENTER
            width: 320
            height: 320
            arc_width: 6
            min_value: 0
            max_value: 100
            value: 18
            start_angle: 0
            end_angle: 360
            adjustable: false
            arc_opa: 0%
            hidden: true
            indicator:
              arc_color: ${color_va_listening}
              arc_opa: 100%
        # [VA] Doubao mascot, cut out of the official app icon (transparent PNG,
        # see tools/gen_doubao_avatar.py). It replaces the former mdi-microphone
        # glyph: the assistant now has a face instead of a hardware symbol. The
        # image is shown in ALL phases (listening / thinking / speaking) and is
        # never tinted -- recolouring the artwork per phase would wreck the skin
        # tones, so the phase colour lives in the status line below it.
        - image:
            id: va_icon
            align: CENTER
            y: -34
            src: img_doubao_avatar
        # [VA] Status line under the avatar. ASCII only -- see va_render for why
        # STT/TTS text is logged instead of drawn.
        - label:
            id: va_text
            align: CENTER
            y: 58
            # 280 px keeps the line inside the 360 px circle with margin for the
            # va_frame ring, and WRAP is safe now that the content is short
            # ASCII rather than a variable-width ellipsis glyph run.
            width: 280
            text: ""
            text_font: font_sc_24
            text_align: CENTER
            long_mode: WRAP
            text_color: ${color_va_listening}
