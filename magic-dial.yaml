  - platform: homeassistant
    id: tv_volume
    entity_id: ${tv_entity}
    attribute: volume_level
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: homepod_volume
    entity_id: ${homepod_entity}
    attribute: volume_level
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: tv_position
    entity_id: ${tv_entity}
    attribute: media_position
    internal: true

  - platform: homeassistant
    id: tv_duration
    entity_id: ${tv_entity}
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: homepod_position
    entity_id: ${homepod_entity}
    attribute: media_position
    internal: true

  - platform: homeassistant
    id: homepod_duration
    entity_id: ${homepod_entity}
    attribute: media_duration
    internal: true

  - platform: homeassistant
    id: ceiling_light_color_temp
    entity_id: ${ceiling_light_entity}
    attribute: color_temp_kelvin
    internal: true

  - platform: homeassistant
    id: ceiling_light_brightness
    entity_id: ${ceiling_light_entity}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          // HA only publishes `brightness` while the light is on, so every value
          // that arrives here is worth remembering for the next tap-to-on.
          if (!isnan(x) && x > 0.0f) id(g_ceiling_last_brightness) = x / 255.0f;
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: strip_light_brightness
    entity_id: ${strip_light_entity}
    attribute: brightness
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 0.0f) id(g_strip_last_brightness) = x / 255.0f;
      - script.execute: sync_from_ha

  - platform: template
    id: strip_light_hue
    internal: true
    update_interval: never

  - platform: homeassistant
    id: climate_target_temperature
    entity_id: ${living_room_climate_entity}
    attribute: temperature
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: dining_room_climate_temp
    entity_id: ${dining_room_climate_entity}
    attribute: current_temperature
    internal: true

  - platform: homeassistant
    id: dining_room_climate_target_temp
    entity_id: ${dining_room_climate_entity}
    attribute: temperature
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: floor_heating_target_temp
    entity_id: ${floor_heating_entity}
    attribute: temperature
    internal: true
    on_value:
      - script.execute: sync_from_ha

  # Battery: ADC on GPIO6 (BAT_ADC, ~10k/10k divider -> x2), ported verbatim from
  # the upstream Guition VA project. GPIO6 is ADC1_CH5 and is otherwise unused on
  # this board, so it does not collide with the display / touch / audio pins.
  - platform: adc
    pin: GPIO6
    id: batt_volt
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 1s
    samples: 64                  # hardware oversampling: 64 readings averaged per measurement
                                 # -> cuts ripple from the ETA6003 converter (no cap on BAT_ADC)
    filters:
      - multiply: 2.0
      # Reject values physically impossible for Li-ion (that is switching ripple, not voltage).
      # Upstream capped this at 4.30 V, but on this unit the docked rail measures a stable
      # 4.40-4.43 V, so 4.30 rejected every single sample and the level never left "--".
      # The ceiling is 4.60 V here; anything above the 4.10 V curve top clamps to 100 %.
      # Out-of-range samples are rate-limited into the log (once per ~10 s) so a missing
      # battery or a wrong divider ratio stays diagnosable instead of silently becoming NAN.
      - lambda: |-
          if (x >= 3.20f && x <= 4.60f) return x;
          static uint8_t dropped = 0;
          if (++dropped >= 10) { dropped = 0; ESP_LOGI("batt", "BAT_ADC out of range: %.3f V (already x2)", x); }
          return NAN;
      # On the cleaned signal: moving average, output every ~10 s
      - sliding_window_moving_average:
          window_size: 20
          send_every: 10
          send_first_at: 5
    on_value:
      - lambda: |-
          // x = VCC_OUT (median, after x2) = system rail ~= battery voltage UNDER load.
          float v = x;
          // Voltage->% curve CALIBRATED on a real discharge (under load):
          // start ~4.10 (~90%), nearly linear drop, brownout ~3.20 V. Range 3.20-4.15.
          static const float vt[] = {3.20f,3.25f,3.39f,3.57f,3.74f,3.84f,4.10f};
          static const float st[] = {0.f,  4.f,  20.f, 40.f, 60.f, 80.f, 100.f};
          const int n = 7;
          float pct;
          if (v <= vt[0]) pct = 0.f;
          else if (v >= vt[n-1]) pct = 100.f;
          else { pct = 0.f; for (int i = 0; i < n-1; i++) { if (v >= vt[i] && v < vt[i+1]) { pct = st[i] + (v - vt[i]) / (vt[i+1] - vt[i]) * (st[i+1] - st[i]); break; } } }
          int p = (int) roundf(pct);
          if (p < 0) p = 0;
          if (p > 100) p = 100;
          id(g_batt) = p;
          // --- Charging detection (no STAT pin on GPIO -> voltage heuristic) ---
          // The puck constantly draws current (backlight + ESP + audio); only USB
          // keeps the rail high.
          float prev = id(g_v_med);
          id(g_v_med) = v;
          bool rising = (prev > 0.1f) && (v - prev > 0.010f);  // voltage rising = charging
          bool high   = (v >= 4.13f);                          // on battery under load max ~4.10
          bool low    = (v < 4.05f);                           // clearly on battery
          if (high || rising) id(g_charging) = true;
          else if (low)       id(g_charging) = false;
          // 4.05-4.13 zone without a rise: keep the previous state (hysteresis, no flicker)
      # Only 本机 mode 3 (电量) reads these globals, so nothing else needs a repaint.
      - if:
          condition:
            lambda: 'return !id(g_sleeping) && id(g_target) == 7 && id(g_control_mode) == 3;'
          then:
            - script.execute: render_main

globals:
  # AOD clock string, shared by the visible label and its four glow copies.
  - id: g_aod_clock
    type: std::string
    restore_value: no
    initial_value: '"--:--"'
  - id: g_sleeping
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_wake_consume
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_last_activity
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_manual_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_backlight_pct
    type: int
    restore_value: no
    initial_value: '100'
  # Lock-screen (AOD) backlight, 5-50 %. Unlike g_backlight_pct this one is
  # persisted: it is a user preference, not a transient runtime value.
  - id: g_aod_backlight_pct
    type: int
    restore_value: yes
    initial_value: '18'
  - id: g_aod_media_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_aod_media_download_result
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_target
    type: int
    restore_value: no
    initial_value: '7'
  - id: g_control_mode
    type: int
    restore_value: no
    initial_value: '0'
  # Local speaker volume in percent (0-100). This is NOT a display-only number:
  # `apply_local_volume` pushes it into the i2s_audio speaker's software volume
  # stage, which is the same stage every `voice_assistant` TTS chunk goes
  # through (I2SAudioSpeakerBase::apply_software_volume_). Defaults to 100 so
  # boot loudness matches the pre-fix behaviour (q31 factor = INT32_MAX,
  # i.e. volume processing bypassed entirely).
  - id: g_local_volume
    type: float
    restore_value: no
    initial_value: '100.0'
  - id: g_arc_pct
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_arc_color
    type: int
    restore_value: no
    initial_value: '0x45D6C5'
  - id: g_target_online
    type: bool
    restore_value: no
    initial_value: 'false'
  # One shared power-feedback slot for both light pages. A tap can only ever be
  # about the page you are looking at, so `target` + `on` is enough and the two
  # lights can never fight over the same flag. Cleared early by the matching HA
  # state push, with light_power_optimistic_settle as the backstop.
  - id: g_light_power_optimistic_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_light_power_optimistic_target
    type: int
    restore_value: no
    initial_value: '2'
  - id: g_light_power_optimistic_on
    type: bool
    restore_value: no
    initial_value: 'false'
  # Last non-zero brightness seen from HA, as a 0-1 fraction. HA drops the
  # `brightness` attribute entirely while a light is off, which is why the dial
  # used to fall back to 0 and show a value that was never true. This is both
  # what gets displayed and what gets sent when a tap switches the light on, so
  # the number on screen is the number on the wire. Restored across reboots so
  # the first tap after a power cut is not a guess.
  - id: g_ceiling_last_brightness
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: g_strip_last_brightness
    type: float
    restore_value: yes
    initial_value: '1.0'
  # Same idea as the light slot: a tap needs to be believed before HA answers.
  # `climate.toggle` keeps its own HVAC mode and setpoint, and every one of these
  # three entities keeps publishing `temperature` while it is off, so the dial
  # only has to claim "it is about to be on/off" - the number on screen is then
  # the real setpoint HA is about to resume, exactly like the light slot shows the
  # brightness it is about to send.
  - id: g_climate_power_optimistic_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_climate_power_optimistic_target
    type: int
    restore_value: no
    initial_value: '4'
  - id: g_climate_power_optimistic_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_touch_x0
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_y0
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_dx
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_dy
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_t0
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_knob_last_pulse_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_knob_speed_pct
    type: int
    restore_value: no
    initial_value: '1'
  - id: g_knob_last_direction
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_knob_last_rotate_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_optimistic_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_optimistic_target
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_optimistic_mode
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_optimistic_value
    type: float
    restore_value: no
    initial_value: '0.0'
  # TV transport has its own optimistic state so play/pause feedback is immediate
  # and HA callbacks cannot flip the icon back during the 2000 ms ignore window.
  - id: g_tv_transport_optimistic
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_tv_transport_playing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_tv_transport_changed_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # HomePod progress and volume share one centered previous/play/next row.
  - id: g_homepod_button
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_gesture
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_remote_button
    type: int
    restore_value: no
    initial_value: '0'
  # Current steady-state ring color and level. Feedback effects temporarily override these.
  - id: g_ring_r
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_ring_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_ring_b
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_ring_brightness
    type: float
    restore_value: no
    initial_value: '0.1'
  - id: g_ring_feedback
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_ring_direction
    type: int
    restore_value: no
    initial_value: '1'
  - id: g_ring_feedback_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_va_phase  # [VA] 0: idle, 1: listening, 2: thinking, 3: speaking, 4: error, 5: proactive ask
    type: int
    initial_value: '0'
  - id: g_va_motion_step  # [VA] frame counter for the listening / speaking motion
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [VA] Bumped by va_enter_session and by every on_listening. Delayed teardown
  # paths snapshot it and bail out if it moved.
  - id: g_va_session_gen
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: g_va_fail_gen  # [VA] snapshot taken by va_fail before its 1200 ms pause
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # [VA] millis() of the moment the voice_assistant component was first seen IDLE
  # while a session was still open; 0 means "currently running". Sampled by the
  # 1 s interval, which is the only place a normal session end is decided.
  - id: g_va_idle_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [VA] millis() of the last event of ANY kind from the pipeline. The only
  # reliable "HA has nothing more for us" signal: no local flag can predict
  # whether a continued conversation will open another turn, but a component
  # that is IDLE *and* has heard nothing for seconds is genuinely finished.
  - id: g_va_last_evt_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [VA] Short ASCII reason shown next to `error`. A global rather than a label
  # write at the trigger site, so va_render stays the single place that decides
  # what the screen says.
  - id: g_va_error_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_va_active  # [VA]
    type: bool
    initial_value: 'false'
  - id: g_va_tts_started  # [VA]
    type: bool
    initial_value: 'false'
  - id: g_va_started_ms  # [VA]
    type: uint32_t
    initial_value: '0'
  - id: g_va_dac_was_unmuted  # [VA]
    type: bool
    initial_value: 'false'
  - id: g_va_return_to_aod  # [VA]
    type: bool
    initial_value: 'false'
  # [VA] Proactive ask session state.
  - id: g_va_proactive
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_va_stt_seen
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_proactive_deadline_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_touch_down  # [VA]
    type: bool
    initial_value: 'false'
  - id: g_ptt_started  # [VA]
    type: bool
    initial_value: 'false'
  - id: g_va_release_flash  # [VA]
    type: bool
    initial_value: 'false'
  # Battery state, ported from the upstream Guition VA project. There is no STAT
  # pin wired to a GPIO on the JC3636K718C dock, so charging is inferred from the
  # rail voltage instead.
  - id: g_batt         # battery level in % (-1 = no reading yet -> show "--")
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_charging     # true = charging / on USB (voltage heuristic)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_v_med        # last median VCC_OUT voltage (a rise means charging)
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: g_chg_anim     # frame of the battery "filling" animation while charging (0..4)
    type: int
    restore_value: no
    initial_value: '0'
  # Ulanzi knob bar (see the `publish_knob_bar` script). The frame is published
  # straight to the Ulanzi's MQTT custom app, so the only rate limit that matters
  # is the Ulanzi's own refresh: a 200 ms leading-edge throttle keeps the bar live
  # while turning, and a trailing frame lands the final value after it stops.
  - id: g_knob_pub_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_knob_pub_pct
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_knob_pub_ok  # set by publish_knob_bar's lambda; gates the mqtt.publish
    type: bool
    restore_value: no
    initial_value: 'false'
  # ~1.3 kB of ready-to-send AWTRIX payload, built by ulanzi_bar.h.
  - id: g_knob_pub_payload
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  # Backlight arbitration stays fully local. Presence only raises AOD brightness;
  # it never wakes the display or changes pages.
  - id: apply_screen_brightness
    mode: restart
    then:
      - light.turn_on:
          id: backlight_light
          brightness: !lambda |-
            const bool bracelet_present = id(gu_xi_in_living_room_local).state ||
              id(liu_xin_yi_in_living_room_local).state;
            const std::string art_url = id(aod_media_artwork_url).state;
            const bool aod_media_showing =
              id(g_sleeping) &&
              id(g_aod_media_ready) &&
              !art_url.empty() &&
              art_url != "unknown" &&
              art_url != "unavailable";
            const float pct = (!id(g_sleeping) || bracelet_present || aod_media_showing)
              ? (float) id(g_backlight_pct)
              : (float) id(g_aod_backlight_pct);
            return fminf(1.0f, fmaxf(0.05f, pct / 100.0f));

  - id: ring_update_state
    mode: restart
    then:
      - lambda: |-
          if (id(g_sleeping)) {
            const bool media_playing =
              id(tv_state).state == "playing" ||
              id(homepod_state).state == "playing";
            if (!media_playing) {
              id(ring_light)->turn_off().perform();
              return;
            }
            auto call = id(ring_light)->turn_on();
            call.set_brightness(1.0f);
            call.set_effect("Ring State");
            call.perform();
            return;
          }
          if (id(g_ring_feedback) != 0) return;

          if (id(g_target) == 0) {
            id(g_ring_r) = 0x1E; id(g_ring_g) = 0x90; id(g_ring_b) = 0xFF;
            id(g_ring_brightness) = 0.45f;
          } else if (id(g_target) == 1) {
            id(g_ring_r) = 0x9B; id(g_ring_g) = 0x59; id(g_ring_b) = 0xB6;
            id(g_ring_brightness) = 0.45f;
          } else if (id(g_target) == 2) {
            const bool optimistic = id(g_optimistic_valid) && id(g_optimistic_target) == 2 &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            float kelvin = optimistic && id(g_optimistic_mode) == 1 ? id(g_optimistic_value) :
              (isnan(id(ceiling_light_color_temp).state) ? 4000.0f : id(ceiling_light_color_temp).state);
            if (kelvin < ${ceiling_ct_min}.0f) kelvin = ${ceiling_ct_min}.0f;
            if (kelvin > ${ceiling_ct_max}.0f) kelvin = ${ceiling_ct_max}.0f;
            const float t = (kelvin - ${ceiling_ct_min}.0f) / (${ceiling_ct_max}.0f - ${ceiling_ct_min}.0f);
            // Interpolate from warm white to cool white.
            id(g_ring_r) = (int) roundf(255.0f + (221.0f - 255.0f) * t);
            id(g_ring_g) = (int) roundf(210.0f + (235.0f - 210.0f) * t);
            id(g_ring_b) = (int) roundf(161.0f + (255.0f - 161.0f) * t);
            const float raw = optimistic && id(g_optimistic_mode) == 0 ? id(g_optimistic_value) * 2.55f :
              (isnan(id(ceiling_light_brightness).state) ? 0.0f : id(ceiling_light_brightness).state);
            id(g_ring_brightness) = raw / 255.0f;
          } else if (id(g_target) == 3) {
            const bool optimistic = id(g_optimistic_valid) && id(g_optimistic_target) == 3 &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            float hue = optimistic && id(g_optimistic_mode) == 1 ? id(g_optimistic_value) :
              (isnan(id(strip_light_hue).state) ? 0.0f : id(strip_light_hue).state);
            hue = fmodf(hue, 360.0f); if (hue < 0.0f) hue += 360.0f;
            const float c = 1.0f;
            const float x = c * (1.0f - fabsf(fmodf(hue / 60.0f, 2.0f) - 1.0f));
            float r = 0, g = 0, b = 0;
            if (hue < 60) { r = c; g = x; }
            else if (hue < 120) { r = x; g = c; }
            else if (hue < 180) { g = c; b = x; }
            else if (hue < 240) { g = x; b = c; }
            else if (hue < 300) { r = x; b = c; }
            else { r = c; b = x; }
            id(g_ring_r) = (int) roundf(r * 255.0f);
            id(g_ring_g) = (int) roundf(g * 255.0f);
            id(g_ring_b) = (int) roundf(b * 255.0f);
            const float raw = optimistic && id(g_optimistic_mode) == 0 ? id(g_optimistic_value) * 2.55f :
              (isnan(id(strip_light_brightness).state) ? 0.0f : id(strip_light_brightness).state);
            id(g_ring_brightness) = raw / 255.0f;
          } else if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6) {
            const std::string mode = id(g_target) == 4 ? id(climate_state).state :
              (id(g_target) == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
            if (mode == "heat") {
              id(g_ring_r) = 0xFF; id(g_ring_g) = 0x6B; id(g_ring_b) = 0x35;
            } else if (mode == "cool") {
              id(g_ring_r) = 0x4F; id(g_ring_g) = 0xC3; id(g_ring_b) = 0xF7;
            } else {
              id(g_ring_r) = 255; id(g_ring_g) = 255; id(g_ring_b) = 255;
            }
            id(g_ring_brightness) = id(g_target) == 4 ? 0.50f : (id(g_target) == 5 ? 0.45f : 0.40f);
          } else if (id(g_control_mode) == 3) {
            // 本机 mode 3 (电量): green while charging, then level-coded green / amber / red.
            if (id(g_charging) || id(g_batt) > 50) { id(g_ring_r) = 0x35; id(g_ring_g) = 0xC7; id(g_ring_b) = 0x59; }
            else if (id(g_batt) < 0) { id(g_ring_r) = 0x61; id(g_ring_g) = 0x76; id(g_ring_b) = 0x81; }
            else if (id(g_batt) > 20) { id(g_ring_r) = 0xFF; id(g_ring_g) = 0xC0; id(g_ring_b) = 0x5A; }
            else { id(g_ring_r) = 0xE6; id(g_ring_g) = 0x64; id(g_ring_b) = 0x72; }
            id(g_ring_brightness) = 0.25f;
          } else {
            id(g_ring_r) = 255; id(g_ring_g) = 255; id(g_ring_b) = 255;
            id(g_ring_brightness) = 0.10f;
          }

          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring State");
          call.perform();

  - id: ring_rotate_feedback
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          id(g_ring_feedback) = 1;
          id(g_ring_direction) = direction >= 0 ? 1 : -1;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 300ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  - id: ring_device_feedback
    mode: restart
    then:
      - lambda: |-
          id(g_ring_feedback) = 2;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 200ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  - id: ring_mode_feedback
    mode: restart
    then:
      - lambda: |-
          id(g_ring_feedback) = 3;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 200ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  - id: ring_tap_feedback
    mode: restart
    then:
      - lambda: |-
          id(g_ring_feedback) = 4;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 400ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  # [VA] Voice assistant owns the display above AOD, media and all control
  # pages. Reassert ownership at every pipeline phase so a concurrent media or
  # wake update cannot leave the assistant running behind another page.
  - id: va_claim_display
    mode: restart
    then:
      - lambda: |-
          id(g_sleeping) = false;
          id(g_last_activity) = millis();
          id(g_backlight_pct) = 100;
          lv_obj_add_flag(id(aod_media_image), LV_OBJ_FLAG_HIDDEN);
      - light.turn_on:
          id: backlight_light
          brightness: 100%
      - lvgl.page.show:
          id: page_va
          animation: none
      - lambda: |-
          lv_obj_invalidate(lv_screen_active());
          lv_refr_now(lv_display_get_default());
          ESP_LOGI("vatrace", "VA claimed display phase=%d", (int) id(g_va_phase));

  # [VA] Shared session entry: claims the screen/ring for the assistant without
  # starting the pipeline. Used both by the local PTT path (va_prepare) and by
  # pipelines started from HA (proactive ask).
  - id: va_enter_session
    mode: restart
    then:
      - lambda: |-
          id(g_va_phase) = 1; // [VA]
          id(g_va_active) = true;
          id(g_va_tts_started) = false;
          id(g_va_stt_seen) = false;
          id(g_va_started_ms) = millis();
          id(g_va_session_gen) += 1; // [VA] see on_listening
          id(g_va_idle_since_ms) = 0;
          id(g_va_last_evt_ms) = millis();
          id(g_manual_until) = millis() + 60000;
          id(g_va_dac_was_unmuted) = id(dac_unmute).state;
          id(g_va_return_to_aod) = id(g_sleeping) || id(g_wake_consume);
          // An assistant turn IS activity: whether it started from a lock-screen
          // long press or from a wake word while the dial was asleep, the screen
          // must leave AOD state and come up to full brightness. Without this the
          // VA page would be painted at the 5-50 % AOD backlight level.
          // `g_sleeping` is cleared BEFORE ring_update_state below, which bails
          // out early while the dial is considered asleep.
          id(g_sleeping) = false;
          id(g_last_activity) = millis();
          id(g_backlight_pct) = 100;
          id(dac_unmute).turn_off();
          id(va_render).execute();
      - script.execute: va_claim_display
      - script.wait: va_claim_display
      - script.execute: ring_update_state
      # [VA] Keep BLE scanning active during voice sessions. A previous version
      # stopped scanning here to reduce main-loop pressure, but missed restore
      # paths could leave the Bluetooth proxy online while advertising reports
      # stayed empty until reboot.
      # [WW] The wake word engine must not keep chewing the mic stream while the
      # assistant owns it: it costs main-loop time and could re-trigger on the
      # TTS answer coming out of the speaker. va_teardown re-arms it.
      - micro_wake_word.stop:

  - id: va_prepare # [VA]
    then:
      - script.execute: va_enter_session
      - script.wait: va_enter_session
      # [VA] HA's microVAD closes the turn. ESPHome has no "finish and process
      # what you have" signal: `voice_assistant.stop` is translated into
      # `Requested pipeline abort` on the HA side, which discards the audio and
      # never produces a transcript. So the release must NOT stop the stream --
      # it keeps flowing, microVAD sees the silence the user just created and
      # ends the turn normally. Turning VAD off instead leaves the stt stream
      # unclosed and Volcengine kills it after 8 s (code 45000081).
      - voice_assistant.start:

  # [VA] Proactive ask. The dial takes the screen, shows the asking state and
  # asks HA to run `assist_satellite.start_conversation`, which speaks the
  # question through the normal pipeline and then listens. The listening window
  # is re-armed locally (see va_cleanup) until `listen_seconds` elapses, so a
  # short VAD timeout does not end the question after one beat of silence.
  - id: proactive_ask_start
    mode: restart
    parameters:
      question: string
      listen_seconds: int
    then:
      - lambda: |-
          id(g_va_proactive) = true;
          id(g_proactive_deadline_ms) = millis() + (uint32_t) (listen_seconds * 1000);
      - script.execute: va_enter_session
      - script.wait: va_enter_session
      - lambda: |-
          id(g_va_phase) = 5; // asking
          id(va_render).execute();
      - homeassistant.action:
          action: assist_satellite.start_conversation
          data:
            entity_id: ${satellite_entity}
          data_template:
            start_message: !lambda 'return question;'

  - id: proactive_abort  # [VA]
    then:
      - lambda: |-
          id(g_va_proactive) = false;
          id(g_proactive_deadline_ms) = 0;
      - voice_assistant.stop:
      - script.execute: va_cleanup

  # [VA] `va_end_watch` (an is_running() poll) and before it `va_end_grace` (a
  # 1500 ms timer) both used to live here. Both tried to answer "is the session
  # over?" at the moment playback finished, and both were wrong: the timer lost
  # whenever HA opened the next turn late, and the poll lost because the dial can
  # sit IDLE between turns when HA -- not the component -- restarts the pipeline.
  # The session end now hangs off "component IDLE for 3 s straight" in the 1 s
  # interval, which is order- and latency-independent.

  - id: va_cleanup  # [VA]
    mode: restart
    then:
      - lambda: |-
          ESP_LOGW("vatrace", "cleanup t=%u phase=%d active=%d run=%d",
                   (unsigned) millis(), (int) id(g_va_phase),
                   (int) id(g_va_active), (int) id(magic_dial_va).is_running());
      # Proactive ask: nobody spoke yet and the listening window is still open,
      # so re-arm listening instead of tearing the session down.
      - if:
          condition:
            lambda: |-
              return id(g_va_proactive) && !id(g_va_stt_seen) && !id(g_va_tts_started) &&
                (int32_t)(id(g_proactive_deadline_ms) - millis()) > 0;
          then:
            - lambda: |-
                id(g_va_phase) = 1; // keep listening
                id(va_render).execute();
            - script.execute: ring_update_state
            - voice_assistant.start:
          else:
            - script.execute: va_teardown

  # Re-arm wake-word detection outside the teardown automation. Calling
  # voice_assistant.stop can end the current VA automation context, so no
  # state/UI work is allowed to depend on actions placed after it.
  - id: va_rearm_wake_word
    mode: restart
    then:
      - delay: 250ms
      - if:
          condition: { lambda: 'return !id(g_va_active);' }
          then:
            - micro_wake_word.start:

  - id: va_teardown  # [VA]
    mode: restart
    then:
      # Clear local ownership first. `voice_assistant.stop` is deliberately the
      # final action: on ESPHome 2026.7.4 it can terminate/switch the current VA
      # automation context, which previously skipped every action after stop and
      # left phase=3/page_va on screen forever.
      - lambda: |-
          ESP_LOGI("vatrace", "teardown begin t=%u phase=%d active=%d run=%d",
                   (unsigned) millis(), (int) id(g_va_phase),
                   (int) id(g_va_active), (int) id(magic_dial_va).is_running());
          id(g_va_proactive) = false;
          id(g_proactive_deadline_ms) = 0;
          id(g_va_phase) = 0;
          id(g_va_active) = false;
          id(g_ptt_started) = false;
          id(g_last_activity) = millis();
          id(g_manual_until) = millis() + 3000;
          if (id(g_va_dac_was_unmuted)) id(dac_unmute).turn_on();
          else id(dac_unmute).turn_off();
      # Blank VA widgets and stop all phase animations before leaving page_va.
      - script.execute: va_render
      - script.execute: ring_update_state
      - logger.log: "[vatrace] teardown -> leaving page_va"
      - if:
          condition: { lambda: 'return id(g_va_return_to_aod);' }
          then:
            - script.execute: enter_sleep
            - script.wait: enter_sleep
          else:
            - lvgl.page.show:
                id: page_main
                animation: none
            - script.execute: render_main
      # Force the newly selected page all the way through LVGL before stopping
      # the VA component. This also makes physical LCD state match screenshots.
      - lambda: |-
          lv_obj_invalidate(lv_screen_active());
          lv_refr_now(lv_display_get_default());
          ESP_LOGI("vatrace", "teardown display refreshed t=%u",
                   (unsigned) millis());
      - script.execute: va_rearm_wake_word
      # Last by design; do not append required cleanup after this action.
      - voice_assistant.stop:

  - id: va_fail  # [VA]
    then:
      - lambda: |-
          id(g_va_phase) = 4;
          id(g_va_fail_gen) = id(g_va_session_gen);
          id(va_render).execute();
      - script.execute: ring_update_state
      - delay: 1200ms
      # [VA] Only tear down if no new turn appeared while the error was on
      # screen. Otherwise this 1200 ms pause would kill a session that HA had
      # already restarted a beat earlier.
      - if:
          condition: { lambda: 'return id(g_va_fail_gen) == id(g_va_session_gen);' }
          then:
            - script.execute: va_cleanup

  - id: ptt_long_press  # [VA]
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: |-
              // `g_wake_consume` is deliberately NOT checked here: a hold that
              // started on the AOD lock screen must still open the assistant.
              // It only suppresses the tap/swipe gesture (see on_release), so a
              // wake tap never leaks into a device action.
              return id(g_touch_down) && !id(g_ptt_started) && !id(g_va_active) &&
                abs(id(g_touch_dx)) <= 50 && abs(id(g_touch_dy)) <= 50;
          then:
            - lambda: 'id(g_ptt_started) = true;'
            # Re-arm check: the touch driver can drop a release event while LVGL is
            # redrawing, which would leave `g_touch_down` stuck and let a phantom
            # hold open a microphone session nobody asked for. Confirm the finger
            # is still down right before the pipeline is started.
            - delay: 120ms
            - if:
                condition:
                  lambda: |-
                    return id(g_touch_down) &&
                      abs(id(g_touch_dx)) <= 50 && abs(id(g_touch_dy)) <= 50;
                then:
                  - script.execute: va_prepare
                else:
                  - lambda: |-
                      ESP_LOGI("touch", "Cancel PTT handoff because the touch became a swipe");
                      id(g_ptt_started) = false;

  - id: va_ptt_release_feedback  # [VA]
    mode: restart
    then:
      - lambda: 'id(g_va_release_flash) = true; id(va_render).execute();'
      - delay: 100ms
      - lambda: 'id(g_va_release_flash) = false; id(va_render).execute();'

  - id: va_render  # [VA]
    then:
      - lambda: |-
          // Plain LVGL rendering: one big mic glyph plus a short ASCII status
          // line. Deliberately NO STT/TTS text on screen -- the only Chinese
          // faces in this build (font_sc_*) carry ~200 hand-picked hanzi from
          // the &p6_glyphs anchor, so arbitrary transcripts would render as
          // blank boxes. A full CJK set is several MB at bpp4, which this
          // build has just finished optimising away. The recognised text is
          // logged instead (see voice_assistant on_stt_end / on_tts_start).
          const auto phase = id(g_va_phase);
          // One accent for every normal phase: the light blue of the Doubao icon
          // itself (#CAE4FF, the most common non-white pixel of the artwork), so
          // the status line and the motion rings read as part of the avatar. The phases
          // are already told apart by their wording ("listening..." / the
          // static "thinking..." / "speaking...") and by the avatar being on screen,
          // so per-phase hues only fought with the mascot's own palette.
          const auto color_accent = lv_color_hex(0xCAE4FF);
          const auto color_error  = lv_color_hex(0xFF6B6B);

          lv_color_t c = color_accent;
          const char *text = "";
          bool show = true;
          switch (phase) {
            case 1: text = "listening..."; break;
            case 2: text = "thinking..."; break;
            case 3: text = "speaking..."; break;
            case 4: c = color_error;     text = id(g_va_error_text).empty() ? "error"
                                                : id(g_va_error_text).c_str(); break;
            case 5: text = "asking..."; break;
            default: show = false; break;
          }

          // The avatar is artwork, not a glyph: it is shown or hidden, never
          // recoloured. Only the status line carries the phase colour.
          if (show) lv_obj_clear_flag(id(va_icon), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(va_icon), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(va_text), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_text_color(id(va_text), c, LV_PART_MAIN);
          lv_label_set_text(id(va_text), text);

          // Same contract for the motion layer: the arc is hidden here (not
          // inside va_motion) so that an aborted turn -- where the script is
          // stopped mid-delay -- can never leave a ring painted behind.
          //
          // Speaking (phase 3) deliberately has NO motion at all any more. The
          // orbiting comet was re-drawing a 320 px anti-aliased ring every
          // 70 ms exactly while the TTS audio path needs the main loop, and the
          // answer audibly stuttered for it. Anchoring the angle to millis()
          // fixed the *visual* phase error but not the underlying loop
          // contention, so the whole sweep is dropped: during speaking the
          // static va_frame ring stays on screen and simply does not move.
          const bool breathing = (phase == 1 || phase == 5);
          if (breathing) lv_obj_clear_flag(id(va_breath), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(va_breath), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(va_sweep), LV_OBJ_FLAG_HIDDEN);
          if (breathing) id(va_motion).execute();
          else id(va_motion).stop();

  # [VA] Motion layer driver for the listening / asking phases (breathing ring).
  #
  # Speaking has no animation: the orbiting comet used to share this loop, but
  # its 70 ms tick competed with the TTS audio path for the main loop and made
  # the spoken answer stutter, so it was removed (see va_render). va_sweep is
  # kept as a widget for a quick revert but is never shown or driven.
  #
  # The 120 ms tick (~8 fps) is deliberately slow: the microphone is streaming
  # during listening, and this build has already been bitten twice by main-loop
  # stalls starving the mic ring buffer, so the animation is kept to style-only
  # writes at a low rate.
  - id: va_motion  # [VA]
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(g_va_phase) == 1 || id(g_va_phase) == 5;'
          then:
            - lambda: |-
                const int step = id(g_va_motion_step)++;
                // Triangle wave over 16 ticks (~1.9 s per breath). Opacity and
                // thickness move together so the ring reads as pulsing light
                // rather than a resizing object -- resizing would invalidate a
                // growing area every tick.
                const int t = step % 16;
                const int tri = t < 8 ? t : 15 - t;          // 0..7
                const lv_opa_t opa = (lv_opa_t) (70 + tri * 26);  // 70..252
                lv_obj_set_style_arc_opa(id(va_breath), opa, LV_PART_MAIN);
                lv_obj_set_style_arc_width(id(va_breath), 3 + (tri >> 1), LV_PART_MAIN);
            - delay: 120ms

  # [VA] The enter / leave zoom transition is gone (2026-08-29). It was a
  # lambda-driven `repeat` at 24-28 ms per frame, i.e. right at LVGL's own
  # ~30 ms refresh period: with the 12 % draw buffer (eight flushes per full
  # 360x360 repaint) plus the 77x112 image rescale, most frames were dropped and
  # the whole ~220 ms sequence read as a single blink. Fixing it properly would
  # need a custom lv_anim exec_cb or a slower ~600 ms sequence, both of which
  # spend more main-loop time right next to the audio path. Removing it also
  # deleted the `script.wait: va_zoom_out` inside va_teardown, one of the
  # windows a revived session could slip through. `va_icon` now simply stays at
  # its native scale and the VA widgets at LV_OPA_COVER.

  - id: knob_visual_settle
    mode: restart
    then:
      - delay: 500ms
      - lambda: |-
          const bool tv_volume_muted = id(g_target) == 0 && id(g_control_mode) == 1 && id(tv_muted).state;
          const bool homepod_volume_inactive = id(g_target) == 1 && id(g_control_mode) == 1 &&
            id(homepod_state).state != "playing";
          lv_obj_set_style_text_color(id(lbl_value), lv_color_hex((tv_volume_muted || homepod_volume_inactive) ? 0x617681 : 0xF2F6F8), LV_PART_MAIN);
          lv_obj_set_style_arc_opa(id(arc_value), LV_OPA_70, LV_PART_INDICATOR);

  - id: optimistic_settle
    mode: restart
    then:
      - delay: 2010ms
      - if:
          condition:
            lambda: 'return millis() - id(g_knob_last_rotate_ms) > 2000;'
          then:
            - lambda: 'id(g_optimistic_valid) = false;'
            - if:
                condition:
                  lambda: 'return !id(g_sleeping);'
                then:
                  - script.execute: render_main

  - id: tv_transport_settle
    mode: restart
    then:
      - delay: 2010ms
      - lambda: |-
          if (millis() - id(g_tv_transport_changed_ms) > 2000) {
            id(g_tv_transport_optimistic) = false;
          }
      - if:
          condition:
            lambda: 'return !id(g_sleeping);'
          then:
            - script.execute: render_main

  - id: light_power_optimistic_settle
    mode: restart
    then:
      - delay: 3s
      - lambda: 'id(g_light_power_optimistic_valid) = false;'
      - script.execute: render_main
      - script.execute: refresh_visible_display

  # Same backstop for climate. The window is longer than the light one because a
  # heat pump / floor heating entity often needs a couple of seconds before HA
  # publishes the new hvac state, and a setpoint that sits there for 6 s is nicer
  # than a value that flips back and forth.
  - id: climate_power_optimistic_settle
    mode: restart
    then:
      - delay: 6s
      - lambda: 'id(g_climate_power_optimistic_valid) = false;'
      - script.execute: render_main
      - script.execute: refresh_visible_display

  - id: sync_from_ha
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(g_sleeping);'
          then:
            - script.execute: ring_update_state
            - script.stop: sync_from_ha
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: sync_from_ha
      - delay: 50ms
      - lambda: |-
          if (id(g_optimistic_valid) && millis() - id(g_knob_last_rotate_ms) > 2000)
            id(g_optimistic_valid) = false;
      - if:
          condition:
            lambda: 'return !id(g_sleeping) && millis() - id(g_knob_last_rotate_ms) > 2000 && !id(g_optimistic_valid);'
          then:
            - if:
                condition:
                  lambda: 'return millis() >= id(g_manual_until);'
                then:
                  - script.execute: resolve_priority
                else:
                  - script.execute: render_main

  - id: resolve_priority
    then:
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: resolve_priority
      - lambda: |-
          const std::string tv = id(tv_state).state;
          const std::string homepod = id(homepod_state).state;
          if (tv == "playing" || tv == "on" || tv == "paused") id(g_target) = 0;
          else if (homepod == "playing" || homepod == "on" || homepod == "paused") id(g_target) = 1;
          else if (id(ceiling_light_state).state == "on") id(g_target) = 2;
          else if (id(strip_light_state).state == "on") id(g_target) = 3;
          else if (!id(climate_state).state.empty() &&
                   id(climate_state).state != "off" &&
                   id(climate_state).state != "unknown" &&
                   id(climate_state).state != "unavailable") id(g_target) = 4;
          else if (!id(dining_room_climate_state).state.empty() &&
                   id(dining_room_climate_state).state != "off" &&
                   id(dining_room_climate_state).state != "unknown" &&
                   id(dining_room_climate_state).state != "unavailable") id(g_target) = 5;
          else if (!id(floor_heating_state).state.empty() &&
                   id(floor_heating_state).state != "off" &&
                   id(floor_heating_state).state != "unknown" &&
                   id(floor_heating_state).state != "unavailable") id(g_target) = 6;
          else id(g_target) = 7;
          id(g_control_mode) = id(g_target) <= 1 ? 1 : 0;
      - script.execute: render_main

  - id: render_main
    then:
      - lvgl.label.update:
          id: lbl_device_name
          text: !lambda |-
            switch (id(g_target)) {
              case 0: return std::string("客厅电视");
              case 1: return std::string("HomePod");
              case 2: return std::string("客厅吸顶灯");
              case 3: return std::string("灯带");
              case 4: return std::string("客厅空调");
              case 5: return std::string("餐厅空调");
              case 6: return std::string("地暖");
              default: return std::string("Magic Dial");
            }
      - lvgl.label.update:
          id: lbl_mode
          text: !lambda |-
            if (id(g_target) == 0 || id(g_target) == 1)
              return id(g_control_mode) == 0 ? std::string("进度") : std::string("音量");
            if (id(g_target) == 2)
              return id(g_control_mode) == 0 ? std::string("亮度") : std::string("色温");
            if (id(g_target) == 3)
              return id(g_control_mode) == 0 ? std::string("亮度") : std::string("色相");
            if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6)
              return id(g_control_mode) == 0 ? std::string("目标温度") : std::string("模式");
            // 本机 has four modes; mode 3 (电量) doubles as the charge state readout.
            if (id(g_control_mode) == 3)
              return id(g_charging) ? std::string("充电中") : std::string("电量");
            if (id(g_control_mode) == 2) return std::string("锁屏亮度");
            return id(g_control_mode) == 0 ? std::string("本机音量") : std::string("屏幕亮度");
      - lvgl.label.update:
          id: dev_icon
          text: !lambda |-
            switch (id(g_target)) {
              case 0: return std::string("󰔂");  // mdi-television
              case 1: return std::string("󰓃");  // mdi-speaker
              case 2: return std::string("󰝩");  // mdi-ceiling-light
              case 3: return std::string("󰟖");  // mdi-led-strip
              case 4: case 5: return std::string("󰀛");  // mdi-air-conditioner
              case 6: return std::string("󰐸");  // mdi-radiator
              default:
                // 本机 mode 3 (电量) swaps the knob glyph for a level-aware battery icon.
                // While charging it cycles the mdi-battery-charging-* frames, which is the
                // "filling" animation the upstream batt_render script draws, and it sits
                // right next to the device name as the ⚡ marker.
                if (id(g_control_mode) == 3) {
                  if (id(g_batt) < 0) return std::string("󰂎");  // mdi-battery-outline
                  if (id(g_charging)) {
                    static const char *frames[5] = {
                      "󰂆",  // mdi-battery-charging-20
                      "󰂈",  // mdi-battery-charging-40
                      "󰂉",  // mdi-battery-charging-60
                      "󰂊",  // mdi-battery-charging-80
                      "󰂅",  // mdi-battery-charging-100
                    };
                    return std::string(frames[id(g_chg_anim) % 5]);
                  }
                  const int p = id(g_batt);
                  if (p > 87) return std::string("󰁹");  // mdi-battery
                  if (p > 62) return std::string("󰂁");  // mdi-battery-80
                  if (p > 37) return std::string("󰁿");  // mdi-battery-60
                  if (p > 12) return std::string("󰁽");  // mdi-battery-40
                  return std::string("󰁻");              // mdi-battery-20
                }
                return std::string("󱮖");  // mdi-knob
            }
      - lvgl.label.update:
          id: lbl_value
          text: !lambda |-
            // 本机 mode 2 (锁屏亮度): plain integer percent, optimistic while dialing.
            if (id(g_target) == 7 && id(g_control_mode) == 2) {
              const bool aod_optimistic = id(g_optimistic_valid) &&
                id(g_optimistic_target) == 7 && id(g_optimistic_mode) == 2 &&
                millis() - id(g_knob_last_rotate_ms) <= 2000;
              char aod_text[8];
              snprintf(aod_text, sizeof(aod_text), "%d",
                (int) roundf(aod_optimistic ? id(g_optimistic_value) : (float) id(g_aod_backlight_pct)));
              return std::string(aod_text);
            }
            // 本机 mode 3 (电量): read-only percentage, "--" until the first ADC reading lands.
            if (id(g_target) == 7 && id(g_control_mode) == 3) {
              if (id(g_batt) < 0) return std::string("--");
              char batt_text[8];
              snprintf(batt_text, sizeof(batt_text), "%d", id(g_batt));
              return std::string(batt_text);
            }
            auto active = [&](int target) -> bool {
              if (target == 0) { const auto s = id(tv_state).state; return s == "playing" || s == "on" || s == "paused"; }
              if (target == 1) { const auto s = id(homepod_state).state; return s == "playing" || s == "on" || s == "paused"; }
              if (target == 2 || target == 3) {
                if (id(g_light_power_optimistic_valid) && id(g_light_power_optimistic_target) == target)
                  return id(g_light_power_optimistic_on);
                return (target == 2 ? id(ceiling_light_state).state : id(strip_light_state).state) == "on";
              }
              if (target >= 4 && target <= 6) {
                if (id(g_climate_power_optimistic_valid) && id(g_climate_power_optimistic_target) == target)
                  return id(g_climate_power_optimistic_on);
                const auto s = target == 4 ? id(climate_state).state :
                  (target == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
                return !s.empty() && s != "off" && s != "unknown" && s != "unavailable";
              }
              return true;
            };
            if (!active(id(g_target))) return std::string("—");
            const bool optimistic = id(g_optimistic_valid) &&
              id(g_optimistic_target) == id(g_target) && id(g_optimistic_mode) == id(g_control_mode) &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            char text[24];
            // Media targets swapped their slots: mode 0 is now 进度, mode 1 is 音量.
            // `view` keeps the rest of this renderer in the original 0=numeric /
            // 1=alternate shape so only the media mapping had to move.
            const int view = id(g_target) <= 1 ? (id(g_control_mode) == 0 ? 1 : 0) : id(g_control_mode);
            if (view == 1) {
              if (id(g_target) == 0) {
                const bool optimistic_transport = id(g_tv_transport_optimistic) &&
                  millis() - id(g_tv_transport_changed_ms) <= 2000;
                const bool playing = optimistic_transport ? id(g_tv_transport_playing) : id(tv_state).state == "playing";
                return playing ? std::string("▶") : std::string("Ⅱ");
              }
              if (id(g_target) == 1) {
                float seconds = optimistic ? id(g_optimistic_value) : id(homepod_position).state;
                if (isnan(seconds) || seconds < 0) seconds = 0;
                int whole = (int) roundf(seconds);
                if (whole >= 3600) snprintf(text, sizeof(text), "%d:%02d", whole / 3600, (whole / 60) % 60);
                else snprintf(text, sizeof(text), "%d:%02d", whole / 60, whole % 60);
                return std::string(text);
              }
              if (id(g_target) == 2)
                return std::string("暖↔冷");
              if (id(g_target) == 3) {
                float h = optimistic ? id(g_optimistic_value) : (isnan(id(strip_light_hue).state) ? 0.0f : id(strip_light_hue).state);
                snprintf(text, sizeof(text), "%.0f", h);
                return std::string(text);
              }
              if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6) {
                if (optimistic) {
                  const int mode_index = (int) roundf(id(g_optimistic_value));
                  if (id(g_target) == 6) {
                    static const char *floor_names[] = {"关闭", "自动", "制热"};
                    return std::string(floor_names[mode_index < 0 ? 0 : (mode_index > 2 ? 2 : mode_index)]);
                  }
                  static const char *mode_names[] = {"关闭", "自动", "制冷", "制热", "除湿", "送风"};
                  return std::string(mode_names[mode_index < 0 ? 0 : (mode_index > 5 ? 5 : mode_index)]);
                }
                const auto s = id(g_target) == 4 ? id(climate_state).state :
                  (id(g_target) == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
                if (s == "cool") return std::string("制冷");
                if (s == "heat") return std::string("制热");
                if (s == "auto") return std::string("自动");
                if (s == "fan_only") return std::string("送风");
                if (s == "dry") return std::string("除湿");
                return std::string("关闭");
              }
              return std::string((optimistic ? id(g_optimistic_value) : id(g_backlight_pct)) < 45 ? "低" :
                ((optimistic ? id(g_optimistic_value) : id(g_backlight_pct)) < 85 ? "中" : "高"));
            }
            float value = 0;
            if (id(g_target) == 0) value = optimistic ? id(g_optimistic_value) : (isnan(id(tv_volume).state) ? 0 : id(tv_volume).state * 100.0f);
            else if (id(g_target) == 1) value = optimistic ? id(g_optimistic_value) : (isnan(id(homepod_volume).state) ? 0 : id(homepod_volume).state * 100.0f);
            // Lights: `brightness` is absent whenever HA considers the light off,
            // so fall back to the last non-zero value instead of a bogus 0 - that
            // is also exactly what a tap-to-on is about to send.
            else if (id(g_target) == 2) value = optimistic ? id(g_optimistic_value) : (isnan(id(ceiling_light_brightness).state) ? id(g_ceiling_last_brightness) * 100.0f : id(ceiling_light_brightness).state / 2.55f);
            else if (id(g_target) == 3) value = optimistic ? id(g_optimistic_value) : (isnan(id(strip_light_brightness).state) ? id(g_strip_last_brightness) * 100.0f : id(strip_light_brightness).state / 2.55f);
            else if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6) {
              value = optimistic ? id(g_optimistic_value) : (id(g_target) == 4 ? id(climate_target_temperature).state :
                (id(g_target) == 5 ? id(dining_room_climate_target_temp).state : id(floor_heating_target_temp).state));
              if (isnan(value)) value = 22.0f;
              if (fabsf(value - roundf(value)) < 0.05f) snprintf(text, sizeof(text), "%.0f", value);
              else snprintf(text, sizeof(text), "%.1f", value);
              return std::string(text);
            } else value = optimistic ? id(g_optimistic_value) : id(g_local_volume);
            snprintf(text, sizeof(text), "%.0f", value);
            return std::string(text);
      - lvgl.label.update:
          id: lbl_unit
          text: !lambda |-
            // 本机 mode 3 (电量): percent sign only once a real reading exists.
            if (id(g_target) == 7 && id(g_control_mode) == 3)
              return id(g_batt) >= 0 ? std::string("%") : std::string("");
            // 本机 mode 2 (锁屏亮度) is always a percentage.
            if (id(g_target) == 7 && id(g_control_mode) == 2) return std::string("%");
            // Media: 音量 (mode 1) is a percentage; 进度 (mode 0) renders its own glyph/timestamp.
            if (id(g_target) <= 1) return id(g_control_mode) == 1 ? std::string("%") : std::string("");
            if (id(g_control_mode) == 0) return (id(g_target) >= 4 && id(g_target) <= 6) ? std::string("°C") : std::string("%");
            if (id(g_target) == 3) return std::string("°");
            return std::string("");
      - lambda: |-
          auto active = [&](int target) -> bool {
            if (target == 0) { const auto s=id(tv_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 1) { const auto s=id(homepod_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 2 || target == 3) {
              if (id(g_light_power_optimistic_valid) && id(g_light_power_optimistic_target) == target)
                return id(g_light_power_optimistic_on);
              return (target == 2 ? id(ceiling_light_state).state : id(strip_light_state).state) == "on";
            }
            if (target >= 4 && target <= 6) {
              if (id(g_climate_power_optimistic_valid) && id(g_climate_power_optimistic_target) == target)
                return id(g_climate_power_optimistic_on);
              const auto s = target == 4 ? id(climate_state).state :
                (target == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
              return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable";
            }
            return true;
          };
          const bool online = active(id(g_target));
          // `online` lumps "switched off" together with "cannot be reached", but the two
          // deserve different copy: a lamp that is simply off is not a fault. Only
          // unavailable / unknown (or a missing state) counts as a real outage.
          auto raw_state = [&](int target) -> std::string {
            switch (target) {
              case 0: return id(tv_state).state;
              case 1: return id(homepod_state).state;
              case 2: return id(ceiling_light_state).state;
              case 3: return id(strip_light_state).state;
              case 4: return id(climate_state).state;
              case 5: return id(dining_room_climate_state).state;
              case 6: return id(floor_heating_state).state;
              default: return std::string("on");  // the local speaker is always reachable
            }
          };
          const std::string target_state = raw_state(id(g_target));
          const bool truly_offline = target_state.empty() || target_state == "unavailable" ||
            target_state == "unknown";
          id(g_target_online) = online;
          if (online) lv_obj_clear_flag(id(arc_value), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(arc_value), LV_OBJ_FLAG_HIDDEN);
          // TV mute and paused/stopped HomePod playback dim their volume number.
          const bool tv_volume_muted = id(g_target) == 0 && id(g_control_mode) == 1 && id(tv_muted).state;
          const bool homepod_volume_inactive = id(g_target) == 1 && id(g_control_mode) == 1 &&
            id(homepod_state).state != "playing";
          lv_obj_set_style_text_color(id(lbl_value), lv_color_hex((tv_volume_muted || homepod_volume_inactive) ? 0x617681 : 0xF2F6F8), LV_PART_MAIN);

          // Media transport controls replace the center hero and reset on every render.
          const bool remote_visible = online && id(g_target) == 0 && id(g_control_mode) == 0;
          lv_obj_t *remote_buttons[] = {id(btn_remote_confirm), id(btn_remote_back), id(btn_remote_up), id(btn_remote_down)};
          const int remote_x[] = {121, 183, 59, 245};
          const int remote_y[] = {134, 134, 134, 134};
          for (int i = 0; i < 4; i++) {
            lv_obj_set_pos(remote_buttons[i], remote_x[i], remote_y[i]);
            lv_obj_set_size(remote_buttons[i], 56, 56);
            lv_obj_set_style_bg_color(remote_buttons[i], lv_color_hex(0x09131B), LV_PART_MAIN);
            if (remote_visible) lv_obj_clear_flag(remote_buttons[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(remote_buttons[i], LV_OBJ_FLAG_HIDDEN);
          }
          const bool homepod_controls_visible = online && id(g_target) == 1 && id(g_control_mode) == 0;
          lv_obj_t *homepod_buttons[] = {id(btn_homepod_previous), id(btn_homepod_play_pause), id(btn_homepod_next)};
          const int homepod_x[] = {90, 152, 214};
          for (int i = 0; i < 3; i++) {
            lv_obj_set_pos(homepod_buttons[i], homepod_x[i], 134);
            lv_obj_set_size(homepod_buttons[i], 56, 56);
            lv_obj_set_style_bg_color(homepod_buttons[i], lv_color_hex(0x09131B), LV_PART_MAIN);
            if (homepod_controls_visible) lv_obj_clear_flag(homepod_buttons[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(homepod_buttons[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_label_set_text(id(icon_homepod_play_pause), id(homepod_state).state == "playing" ? "󰏤" : "󰐊");
          if (remote_visible || homepod_controls_visible) {
            lv_obj_add_flag(id(lbl_value), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_unit), LV_OBJ_FLAG_HIDDEN);
            if (remote_visible) {
              const bool optimistic_transport = id(g_tv_transport_optimistic) &&
                millis() - id(g_tv_transport_changed_ms) <= 2000;
              const bool playing = optimistic_transport ? id(g_tv_transport_playing) : id(tv_state).state == "playing";
              lv_label_set_text(id(icon_remote_confirm), playing ? "󰏤" : "󰐊");
            }
          } else {
            lv_obj_clear_flag(id(lbl_value), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_unit), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_set_style_text_color(id(lbl_device_name), lv_color_hex(online ? 0xBFD0D8 : 0x81919A), LV_PART_MAIN);
          if (!online) lv_label_set_text(id(lbl_mode), truly_offline ? "设备离线" : "已关闭");
          // The flex row keeps the value and unit aligned, so only the font
          // changes per target; no manual y offsets are needed any more.
          lv_obj_set_style_text_font(id(lbl_value), id(font_mono_76), LV_PART_MAIN);
          // Media targets read 0=进度 / 1=音量, so the alternate-view test is inverted for them.
          const int font_view = id(g_target) <= 1 ? (id(g_control_mode) == 0 ? 1 : 0) : id(g_control_mode);
          if (online && font_view == 1) {
            if (id(g_target) == 1) {
              lv_obj_set_style_text_font(id(lbl_value), id(font_mono_68), LV_PART_MAIN);
            } else if (id(g_target) == 0 || id(g_target) == 2 || id(g_target) == 7) {
              // TV playback glyph, color-temperature graphic and local brightness are hero text.
              lv_obj_set_style_text_font(id(lbl_value), id(font_sc_52), LV_PART_MAIN);
            } else if (id(g_target) >= 4 && id(g_target) <= 6) {
              lv_obj_set_style_text_font(id(lbl_value), id(font_sc_44), LV_PART_MAIN);
            }
          }

          uint32_t accent = 0x45D6C5;
          if (id(g_target) <= 1) accent = id(g_target) == 0 ? 0x49A8FF : 0x6A9BFF;
          else if (id(g_target) == 2 || id(g_target) == 3) accent = id(g_control_mode) == 0 ? 0xFFC05A : 0xFFB36A;
          else if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6) {
            const bool optimistic_color = id(g_optimistic_valid) && id(g_optimistic_target) == id(g_target) &&
              id(g_optimistic_mode) == 0 && millis() - id(g_knob_last_rotate_ms) <= 2000;
            float temp = optimistic_color ? id(g_optimistic_value) : (id(g_target) == 4 ? id(climate_target_temperature).state :
              (id(g_target) == 5 ? id(dining_room_climate_target_temp).state : id(floor_heating_target_temp).state));
            if (isnan(temp)) temp = 22.0f;
            float t = fminf(1.0f, fmaxf(0.0f, (temp - 16.0f) / 15.0f));
            uint8_t r, g, b;
            if (t < 0.5f) { float q=t*2; r=roundf(0x66 + (0x79 - 0x66)*q); g=roundf(0xC8 + (0xD4 - 0xC8)*q); b=roundf(0xFF + (0xC0 - 0xFF)*q); }
            else { float q=(t-0.5f)*2; r=roundf(0x79 + (0xFF - 0x79)*q); g=roundf(0xD4 + (0x82 - 0xD4)*q); b=roundf(0xC0 + (0x6E - 0xC0)*q); }
            accent = (r<<16)|(g<<8)|b;
          } else if (id(g_target) == 7 && id(g_control_mode) == 3) {
            // 电量: green while charging, otherwise level-coded green / amber / red.
            if (id(g_charging)) accent = 0x35C759;
            else if (id(g_batt) < 0) accent = 0x617681;
            else if (id(g_batt) > 50) accent = 0x35C759;
            else if (id(g_batt) > 20) accent = 0xFFC05A;
            else accent = 0xE66472;
          }
          lv_obj_set_style_arc_color(id(arc_value), lv_color_hex(accent), LV_PART_INDICATOR);
          lv_obj_set_style_opa(id(arc_value), LV_OPA_TRANSP, LV_PART_KNOB);
          lv_obj_set_style_bg_opa(id(arc_value), LV_OPA_TRANSP, LV_PART_KNOB);
          id(g_arc_color) = (int) accent;
          lv_obj_set_style_text_color(id(dev_icon), lv_color_hex(online ? 0xBFD0D8 : 0x81919A), LV_PART_MAIN);
          // Line widget ids are LvLineType*, so ->obj is needed for raw LVGL calls.
          // Wheel: the selected mode wears the domain color, neighbours stay ghosted.
          uint32_t wheel_accent = 0x9EB2BC;
          if (id(g_target) <= 1) wheel_accent = 0x49A8FF;
          else if (id(g_target) == 2 || id(g_target) == 3) wheel_accent = 0xFFD166;
          else if (id(g_target) >= 4 && id(g_target) <= 6) wheel_accent = 0xFF8C61;
          else if (id(g_control_mode) == 3 && id(g_charging)) wheel_accent = 0x35C759;

          auto mode_name = [&](int target, int mode) -> const char * {
            if (target == 0 || target == 1) return mode == 0 ? "进度" : "音量";
            if (target == 2) return mode == 0 ? "亮度" : "色温";
            if (target == 3) return mode == 0 ? "亮度" : "色相";
            if (target >= 4 && target <= 6) return mode == 0 ? "目标温度" : "模式";
            // 本机 is the only target with four modes; the last one is read-only.
            return mode == 0 ? "本机音量" : (mode == 1 ? "屏幕亮度" : (mode == 2 ? "锁屏亮度" : "电量"));
          };
          // Classic three-slot wheel: the selected mode is the big centre label, and
          // the previous / next options bleed in above and below. With only two modes
          // the list wraps, so both neighbours show the same "other" name; 本机 has
          // four, so its neighbours are genuinely different.
          const int mode_count = id(g_target) == 7 ? 4 : 2;
          const int prev_mode = (id(g_control_mode) + mode_count - 1) % mode_count;
          const int next_mode = (id(g_control_mode) + 1) % mode_count;
          lv_label_set_text(id(lbl_wheel_prev), mode_name(id(g_target), prev_mode));
          lv_label_set_text(id(lbl_wheel_next), mode_name(id(g_target), next_mode));
          lv_obj_set_style_text_font(id(lbl_mode), id(font_sc_20), LV_PART_MAIN);
          // Red is reserved for a genuine outage; a device that is merely switched off
          // gets the same neutral grey as the ghosted neighbours.
          const uint32_t centre_color = online ? wheel_accent : (truly_offline ? 0xE66472 : 0x36505D);
          lv_obj_set_style_text_color(id(lbl_mode), lv_color_hex(centre_color), LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(lbl_mode), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_clear_flag(id(lbl_mode), LV_OBJ_FLAG_HIDDEN);
          // Always re-seat the stack at its rest position: if a device swipe cancels an
          // in-flight mode slide, the box would otherwise stay parked one notch off.
          lv_obj_set_y(id(wheel_box), 214);
          lv_obj_t *neighbours[] = {id(lbl_wheel_prev), id(lbl_wheel_next)};
          for (auto *neighbour : neighbours) {
            lv_obj_set_style_text_font(neighbour, id(font_sc_16), LV_PART_MAIN);
            lv_obj_set_style_text_color(neighbour, lv_color_hex(0x36505D), LV_PART_MAIN);
            lv_obj_set_style_text_opa(neighbour, LV_OPA_40, LV_PART_MAIN);
            // Offline the centre label carries a notice, so the wheel context is dropped.
            if (online) lv_obj_clear_flag(neighbour, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(neighbour, LV_OBJ_FLAG_HIDDEN);
          }

          // Park the unit just right of the digits, baseline-aligned with them.
          // lbl_value is CENTER-aligned, which means its x/translate styles act as an
          // OFFSET from the centre rather than an absolute position. Any animation that
          // ever touched x leaves that offset behind and the digits stay off-centre, so
          // both are zeroed on every render before measuring.
          lv_obj_set_x(id(lbl_value), 0);
          lv_obj_set_style_translate_x(id(lbl_value), 0, LV_PART_MAIN);
          lv_obj_set_style_translate_y(id(lbl_value), 0, LV_PART_MAIN);
          lv_obj_set_style_translate_x(id(lbl_unit), 0, LV_PART_MAIN);
          lv_obj_set_style_translate_y(id(lbl_unit), 0, LV_PART_MAIN);
          // Measure only after the final font for this target/mode has been applied,
          // otherwise value_w is one frame stale and the unit lands in the wrong place.
          lv_obj_update_layout(id(lbl_value));
          const int value_w = lv_obj_get_width(id(lbl_value));
          int unit_x = 180 + value_w / 2 + 4;
          if (unit_x > 344) unit_x = 344;  // never let the unit run off the round screen
          lv_obj_set_pos(id(lbl_unit), unit_x, 168);

          // Center the icon+name pair on x=180. Both are content-sized, so the
          // group width is only known after the label text has been applied.
          // translate_x is zeroed first: the swipe fly-in animates translate, and a
          // cancelled animation would otherwise leave the pair permanently shifted.
          lv_obj_set_style_translate_x(id(dev_icon), 0, LV_PART_MAIN);
          lv_obj_set_style_translate_x(id(lbl_device_name), 0, LV_PART_MAIN);
          lv_obj_update_layout(id(lbl_device_name));
          const int icon_w = lv_obj_get_width(id(dev_icon));
          const int name_w = lv_obj_get_width(id(lbl_device_name));
          const int group_left = 180 - (icon_w + 8 + name_w) / 2;
          lv_obj_set_x(id(dev_icon), group_left);
          lv_obj_set_x(id(lbl_device_name), group_left + icon_w + 8);

          // All 8 targets are swipe-reachable now, so every one gets a dot.
          // Inactive targets are drawn dimmer instead of being hidden.
          int available[8], count=0, selected=0;
          for (int t=0; t<8; t++) { if (t==id(g_target)) selected=count; available[count++]=t; }
          const int visible = count > 7 ? 7 : count;
          int window_start = count > 7 ? selected - 3 : 0;
          if (window_start < 0) window_start = 0;
          if (window_start > count - visible) window_start = count - visible;
          const int selected_dot = selected - window_start;
          lv_obj_t *dots[7] = {id(dot_0),id(dot_1),id(dot_2),id(dot_3),id(dot_4),id(dot_5),id(dot_6)};
          for (int i=0;i<7;i++) {
            if (count < 2 || i >= visible) { lv_obj_add_flag(dots[i], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_clear_flag(dots[i], LV_OBJ_FLAG_HIDDEN);
            const bool overflow_edge = count > 7 && ((i == 0 && window_start > 0) || (i == 6 && window_start + visible < count));
            const int diameter = overflow_edge ? 4 : 6;
            lv_obj_set_size(dots[i], diameter, diameter);
            lv_obj_set_style_radius(dots[i], LV_RADIUS_CIRCLE, LV_PART_MAIN);
            lv_obj_align(dots[i], LV_ALIGN_TOP_MID, (i * 16) - ((visible - 1) * 16 / 2), 311);
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(i == selected_dot ? 0xF2F6F8 :
              (active(available[window_start + i]) ? 0x37464D : 0x232D31)), LV_PART_MAIN);
          }
      - lvgl.arc.update:
          id: arc_value
          value: !lambda |-
            const bool optimistic = id(g_optimistic_valid) &&
              id(g_optimistic_target) == id(g_target) && id(g_optimistic_mode) == id(g_control_mode) &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            float value = 0;
            if (id(g_target) == 0)
              value = id(g_control_mode) == 1
                ? (optimistic ? id(g_optimistic_value) : (isnan(id(tv_volume).state) ? 0 : id(tv_volume).state * 100.0f))
                : ((isnan(id(tv_position).state) || isnan(id(tv_duration).state) || id(tv_duration).state <= 0) ? 0 : id(tv_position).state / id(tv_duration).state * 100.0f);
            else if (id(g_target) == 1)
              value = id(g_control_mode) == 1
                ? (optimistic ? id(g_optimistic_value) : (isnan(id(homepod_volume).state) ? 0 : id(homepod_volume).state * 100.0f))
                : (optimistic ? ((isnan(id(homepod_duration).state) || id(homepod_duration).state <= 0) ? 0 : id(g_optimistic_value) / id(homepod_duration).state * 100.0f) : ((isnan(id(homepod_position).state) || isnan(id(homepod_duration).state) || id(homepod_duration).state <= 0) ? 0 : id(homepod_position).state / id(homepod_duration).state * 100.0f));
            else if (id(g_target) == 2)
              value = id(g_control_mode) == 0
                ? (optimistic ? id(g_optimistic_value) : (isnan(id(ceiling_light_brightness).state) ? 0 : id(ceiling_light_brightness).state / 255.0f * 100.0f))
                : ((optimistic ? id(g_optimistic_value) : (isnan(id(ceiling_light_color_temp).state) ? 4000.0f : id(ceiling_light_color_temp).state)) - ${ceiling_ct_min}.0f) / ((${ceiling_ct_max}.0f - ${ceiling_ct_min}.0f) / 100.0f);
            else if (id(g_target) == 3)
              value = id(g_control_mode) == 0
                ? (optimistic ? id(g_optimistic_value) : (isnan(id(strip_light_brightness).state) ? 0 : id(strip_light_brightness).state / 255.0f * 100.0f))
                : (optimistic ? id(g_optimistic_value) / 360.0f * 100.0f : (isnan(id(strip_light_hue).state) ? 0 : id(strip_light_hue).state / 360.0f * 100.0f));
            else if (id(g_target) == 4 && id(g_control_mode) == 0) {
              const float temp = optimistic ? id(g_optimistic_value) : (isnan(id(climate_target_temperature).state) ? 22.0f : id(climate_target_temperature).state);
              value = (temp - 16.0f) / 15.0f * 100.0f;
            } else if (id(g_target) == 5 && id(g_control_mode) == 0) {
              const float temp = optimistic ? id(g_optimistic_value) : (isnan(id(dining_room_climate_target_temp).state) ? 22.0f : id(dining_room_climate_target_temp).state);
              value = (temp - 16.0f) / 15.0f * 100.0f;
            } else if (id(g_target) == 6 && id(g_control_mode) == 0) {
              const float temp = optimistic ? id(g_optimistic_value) : (isnan(id(floor_heating_target_temp).state) ? 22.0f : id(floor_heating_target_temp).state);
              value = (temp - 16.0f) / 15.0f * 100.0f;
            } else if (id(g_target) == 7) {
              // mode 3 (电量) is read-only: 0-100 % maps straight onto the arc.
              if (id(g_control_mode) == 3) value = id(g_batt) < 0 ? 0.0f : (float) id(g_batt);
              // mode 2 (锁屏亮度) spans 5-50 %, stretched across the whole sweep.
              else if (id(g_control_mode) == 2) {
                const float raw = optimistic ? id(g_optimistic_value) : (float) id(g_aod_backlight_pct);
                value = (raw - 5.0f) / 45.0f * 100.0f;
              }
              else value = optimistic ? id(g_optimistic_value) : (id(g_control_mode) == 0 ? id(g_local_volume) : id(g_backlight_pct));
            }
            if (value < 0) value = 0;
            if (value > 100) value = 100;
            id(g_arc_pct) = (int) roundf(value);
            return id(g_arc_pct);
      - script.execute: ring_update_state

  - id: render_aod
    then:
      # One shared clock string, pushed to the main label plus the four glow
      # copies so the halo never drifts out of sync with the visible digits.
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            id(g_aod_clock) = "--:--";
          } else {
            char text[8];
            snprintf(text, sizeof(text), "%02d:%02d", now.hour, now.minute);
            id(g_aod_clock) = text;
          }
      - lvgl.label.update:
          id: lbl_aod_time
          text: !lambda 'return id(g_aod_clock);'
      - lvgl.label.update:
          id: lbl_aod_date
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("正在同步时间");
            static const char *weekdays[] = {
              "星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"
            };
            char text[40];
            snprintf(text, sizeof(text), "%d月%d日 · %s", now.month, now.day_of_month, weekdays[now.day_of_week - 1]);
            return std::string(text);
      - lvgl.label.update:
          id: lbl_aod_holiday
          text: !lambda |-
            if (id(holiday_calendar_state).state == "on" &&
                !id(holiday_calendar_name).state.empty() &&
                id(holiday_calendar_name).state != "unknown" &&
                id(holiday_calendar_name).state != "unavailable") {
              return id(holiday_calendar_name).state;
            }
            return std::string("");
      - lambda: |-
          const bool show_holiday = id(holiday_calendar_state).state == "on" &&
            !id(holiday_calendar_name).state.empty() &&
            id(holiday_calendar_name).state != "unknown" &&
            id(holiday_calendar_name).state != "unavailable";
          const std::string art_url = id(aod_media_artwork_url).state;
          const bool media_ready = id(g_aod_media_ready) && !art_url.empty() &&
            art_url != "unknown" && art_url != "unavailable";
          ESP_LOGI("aod_media", "Render AOD: sleeping=%s ready=%s url_len=%u hidden_before=%s",
                   id(g_sleeping) ? "yes" : "no", id(g_aod_media_ready) ? "yes" : "no",
                   static_cast<unsigned>(art_url.size()),
                   lv_obj_has_flag(id(aod_media_image), LV_OBJ_FLAG_HIDDEN) ? "yes" : "no");
          if (media_ready) {
            lv_obj_clear_flag(id(aod_media_image), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_aod_time), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_aod_date), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_aod_holiday), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(aod_media_image), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_aod_time), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_aod_date), LV_OBJ_FLAG_HIDDEN);
            if (show_holiday) lv_obj_clear_flag(id(lbl_aod_holiday), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(lbl_aod_holiday), LV_OBJ_FLAG_HIDDEN);
          }

  - id: enter_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(g_va_active);"
          then:
            - script.execute: va_claim_display
            - script.stop: enter_sleep
      - lambda: |-
          id(g_sleeping) = true;
      - if:
          condition:
            lambda: |-
              const std::string art_url = id(aod_media_artwork_url).state;
              return !art_url.empty() && art_url != "unknown" && art_url != "unavailable";
          then:
            - lambda: |-
                magic_dial::media_artwork::loader.request(id(aod_media_artwork_url).state);
      - script.execute: ring_update_state
      - script.execute: render_aod
      - lvgl.page.show:
          id: page_aod
          animation: fade_in
          time: 300ms
      - script.execute: apply_screen_brightness

  - id: wake_display
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(g_va_active);"
          then:
            - script.execute: va_claim_display
            - script.stop: wake_display
      - lambda: |-
          ESP_LOGI("wake", "Leaving AOD and restoring main page");
          id(g_sleeping) = false;
          id(g_last_activity) = millis();
          id(g_manual_until) = 0;
          id(g_backlight_pct) = 100;
          lv_obj_add_flag(id(aod_media_image), LV_OBJ_FLAG_HIDDEN);
      - light.turn_on:
          id: backlight_light
          brightness: 100%
      - script.execute: resolve_priority
      - lvgl.page.show:
          id: page_main
          animation: none
      - script.execute: render_main
      - lambda: |-
          lv_obj_invalidate(lv_screen_active());
          lv_refr_now(lv_display_get_default());
          ESP_LOGI("wake", "Main page refresh completed");

  - id: refresh_visible_display
    then:
      - lambda: |-
          lv_obj_invalidate(lv_screen_active());
          lv_refr_now(lv_display_get_default());
          ESP_LOGI("ui", "Forced LCD refresh on active screen");

  - id: cycle_target
    parameters:
      direction: int
    then:
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: cycle_target
      - lambda: |-
          // Swipes walk the FULL fixed target order and never skip anything: an
          // inactive device is still reachable so it can be turned on from the dial.
          // (Auto-selection on wake still jumps to the highest-priority active one.)
          id(g_target) = (id(g_target) + (direction > 0 ? 1 : 7)) % 8;
          id(g_control_mode) = id(g_target) <= 1 ? 1 : 0;
          id(g_optimistic_valid) = false;
          id(g_manual_until) = millis() + 60000;
      - script.execute: render_main
      - script.execute: refresh_visible_display
      - script.execute: ring_device_feedback
      - lambda: |-
          // Lightweight target transition: the center stage fades in; the outer orbit stays fixed.
          lv_obj_t *items[] = {id(lbl_value), id(lbl_unit), id(wheel_box)};
          for (auto *item : items) {
            // Drop any animation still running from a previous rapid swipe, otherwise its
            // remaining frames keep writing stale values over the fresh layout.
            lv_anim_del(item, nullptr);
            lv_obj_set_style_opa(item, LV_OPA_20, LV_PART_MAIN);
            lv_anim_t a; lv_anim_init(&a); lv_anim_set_var(&a, item);
            lv_anim_set_values(&a, LV_OPA_20, LV_OPA_COVER); lv_anim_set_duration(&a, 240);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
            lv_anim_set_exec_cb(&a, [](void *o, int32_t v) { lv_obj_set_style_opa((lv_obj_t *) o, (lv_opa_t) v, LV_PART_MAIN); });
            lv_anim_start(&a);
          }
          // Direction-aware fly-in for the device identity only. translate_x is used
          // instead of x so the group centering computed by render_main stays intact;
          // render_main also zeroes translate_x, so a cancelled animation self-heals.
          const int32_t from_dx = direction > 0 ? 20 : -20;
          lv_obj_t *identity[] = {id(dev_icon), id(lbl_device_name)};
          for (auto *item : identity) {
            lv_anim_del(item, nullptr);
            lv_obj_set_style_translate_x(item, from_dx, LV_PART_MAIN);
            lv_obj_set_style_opa(item, LV_OPA_20, LV_PART_MAIN);
            lv_anim_t slide; lv_anim_init(&slide); lv_anim_set_var(&slide, item);
            lv_anim_set_values(&slide, from_dx, 0); lv_anim_set_duration(&slide, 200);
            lv_anim_set_path_cb(&slide, lv_anim_path_ease_in_out);
            lv_anim_set_exec_cb(&slide, [](void *o, int32_t v) { lv_obj_set_style_translate_x((lv_obj_t *) o, v, LV_PART_MAIN); });
            lv_anim_start(&slide);
            lv_anim_t fade; lv_anim_init(&fade); lv_anim_set_var(&fade, item);
            lv_anim_set_values(&fade, LV_OPA_20, LV_OPA_COVER); lv_anim_set_duration(&fade, 200);
            lv_anim_set_path_cb(&fade, lv_anim_path_ease_in_out);
            lv_anim_set_exec_cb(&fade, [](void *o, int32_t v) { lv_obj_set_style_opa((lv_obj_t *) o, (lv_opa_t) v, LV_PART_MAIN); });
            lv_anim_start(&fade);
          }
      - homeassistant.event:
          event: esphome.magic_dial_target_changed
          data:
            target: !lambda |-
              switch (id(g_target)) {
                case 0: return std::string("${tv_entity}");
                case 1: return std::string("${homepod_entity}");
                case 2: return std::string("${ceiling_light_entity}");
                case 3: return std::string("${strip_light_entity}");
                case 4: return std::string("${living_room_climate_entity}");
                case 5: return std::string("${dining_room_climate_entity}");
                case 6: return std::string("${floor_heating_entity}");
                default: return std::string("local_speaker");
              }

  - id: switch_mode
    parameters:
      direction: int
    then:
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: switch_mode
      - lambda: |-
          // 本机 (target 7) has four modes: 本机音量 / 屏幕亮度 / 锁屏亮度 / 电量. Every
          // other target still has two, where cycling either way is the same toggle.
          const int mode_count = id(g_target) == 7 ? 4 : 2;
          id(g_control_mode) = (id(g_control_mode) + (direction > 0 ? 1 : mode_count - 1)) % mode_count;
          id(g_optimistic_valid) = false;
          id(g_manual_until) = millis() + 60000;
      - script.execute: render_main
      - script.execute: refresh_visible_display
      - script.execute: ring_mode_feedback
      - lambda: |-
          lv_obj_t *items[] = {id(lbl_value), id(lbl_unit)};
          for (auto *item : items) {
            lv_obj_set_style_opa(item, LV_OPA_20, LV_PART_MAIN);
            lv_anim_t a; lv_anim_init(&a); lv_anim_set_var(&a, item);
            lv_anim_set_values(&a, LV_OPA_20, LV_OPA_COVER); lv_anim_set_duration(&a, 200);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
            lv_anim_set_exec_cb(&a, [](void *o, int32_t v) { lv_obj_set_style_opa((lv_obj_t *) o, (lv_opa_t) v, LV_PART_MAIN); });
            lv_anim_start(&a);
          }
          // Wheel rotation: the whole three-slot stack travels one notch (26px, the
          // tightened slot pitch) from the side the finger came from, while the new
          // centre label fades up. direction > 0 (flick up) starts the stack low and
          // lifts it, so the incoming option rises from the lower slot.
          const int32_t from_y = 214 + (direction > 0 ? 26 : -26);
          lv_anim_del(id(wheel_box), nullptr);
          lv_obj_set_y(id(wheel_box), from_y);
          lv_anim_t slide; lv_anim_init(&slide); lv_anim_set_var(&slide, id(wheel_box));
          lv_anim_set_values(&slide, from_y, 214); lv_anim_set_duration(&slide, 200);
          lv_anim_set_path_cb(&slide, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&slide, [](void *o, int32_t v) { lv_obj_set_y((lv_obj_t *) o, v); });
          lv_anim_start(&slide);
          lv_obj_set_style_text_opa(id(lbl_mode), LV_OPA_40, LV_PART_MAIN);
          lv_anim_t fade; lv_anim_init(&fade); lv_anim_set_var(&fade, id(lbl_mode));
          lv_anim_set_values(&fade, LV_OPA_40, LV_OPA_COVER); lv_anim_set_duration(&fade, 200);
          lv_anim_set_path_cb(&fade, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&fade, [](void *o, int32_t v) { lv_obj_set_style_text_opa((lv_obj_t *) o, (lv_opa_t) v, LV_PART_MAIN); });
          lv_anim_start(&fade);
      - homeassistant.event:
          event: esphome.magic_dial_mode_changed
          data:
            direction: !lambda 'return direction > 0 ? std::string("up") : std::string("down");'
            mode: !lambda |-
              if (id(g_target) <= 1) return id(g_control_mode) == 0 ? std::string("progress") : std::string("volume");
              if (id(g_target) == 2) return id(g_control_mode) == 0 ? std::string("brightness") : std::string("color_temperature");
              if (id(g_target) == 3) return id(g_control_mode) == 0 ? std::string("brightness") : std::string("hue");
              if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6) return id(g_control_mode) == 0 ? std::string("target_temperature") : std::string("hvac_mode");
              if (id(g_control_mode) == 3) return std::string("battery");
              if (id(g_control_mode) == 2) return std::string("aod_brightness");
              return id(g_control_mode) == 0 ? std::string("local_volume") : std::string("screen_brightness");

  - id: handle_tap
    then:
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: handle_tap
      # A tap changes the state of the very device the page is showing, so the HA
      # push that follows must NOT be allowed to re-run resolve_priority and swap
      # g_target out from under the user - that reads as "tap did nothing" (or
      # worse, "the dial jumped pages"). Pin the current selection the same way
      # the knob and swipe paths do, just with a shorter lease.
      - lambda: 'id(g_manual_until) = millis() + 10000;'
      - if:
          condition: { lambda: 'return id(g_target) == 0;' }
          then:
            - if:
                # A dark TV cannot honour a transport command, so the first tap
                # is spent powering it on; only a live TV gets mute / TogglePause.
                condition:
                  lambda: |-
                    const std::string state = id(tv_state).state;
                    return state == "off" || state == "unavailable";
                then:
                  - homeassistant.action:
                      action: media_player.turn_on
                      data:
                        entity_id: ${tv_entity}
                else:
                  - if:
                      # Mute belongs to 音量 (mode 1); 进度 (mode 0) taps toggle playback.
                      condition: { lambda: 'return id(g_control_mode) == 1;' }
                      then:
                        - homeassistant.action:
                            action: media_player.volume_mute
                            data:
                              entity_id: ${tv_entity}
                              is_volume_muted: !lambda 'return id(tv_muted).state ? std::string("false") : std::string("true");'
                      else:
                        # Flip the local icon first for instant feedback, then toggle.
                        # The Sony media_player entity does not accept transport
                        # commands reliably, so the remote's Confirm key is used
                        # (acts as play/pause confirm in most TV apps).
                        - lambda: |-
                            const bool currently_playing = id(g_tv_transport_optimistic) &&
                              millis() - id(g_tv_transport_changed_ms) <= 2000
                              ? id(g_tv_transport_playing) : id(tv_state).state == "playing";
                            id(g_tv_transport_playing) = !currently_playing;
                            id(g_tv_transport_optimistic) = true;
                            id(g_tv_transport_changed_ms) = millis();
                        - homeassistant.action:
                            action: remote.send_command
                            data:
                              entity_id: ${tv_remote_entity}
                              command: Confirm
                        - script.execute: render_main
                        - script.execute: tv_transport_settle
      - if:
          condition: { lambda: 'return id(g_target) == 1;' }
          then:
            - homeassistant.action: { action: media_player.media_play_pause, data: { entity_id: '${homepod_entity}' } }
      # Both light pages share one shape: flip the local power state, repaint the
      # LCD right away, and only then talk to HA. Switching on is an explicit
      # `turn_on` carrying the brightness the screen is already showing, so the
      # dial never has to guess what HA will restore - what you see is what was
      # sent. (`toggle` used to leave the page rendering 0 % until HA answered.)
      - if:
          condition: { lambda: 'return id(g_target) == 2;' }
          then:
            - lambda: |-
                const bool currently_on =
                  (id(g_light_power_optimistic_valid) && id(g_light_power_optimistic_target) == 2)
                    ? id(g_light_power_optimistic_on)
                    : id(ceiling_light_state).state == "on";
                id(g_light_power_optimistic_target) = 2;
                id(g_light_power_optimistic_on) = !currently_on;
                id(g_light_power_optimistic_valid) = true;
            - script.execute: render_main
            - script.execute: refresh_visible_display
            - if:
                condition: { lambda: 'return id(g_light_power_optimistic_on);' }
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: ${ceiling_light_entity}
                        brightness_pct: !lambda |-
                          const int pct = (int) roundf(fmaxf(1.0f, fminf(100.0f, id(g_ceiling_last_brightness) * 100.0f)));
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d", pct);
                          return std::string(buf);
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${ceiling_light_entity}
            - script.execute: light_power_optimistic_settle
      - if:
          condition: { lambda: 'return id(g_target) == 3;' }
          then:
            - lambda: |-
                const bool currently_on =
                  (id(g_light_power_optimistic_valid) && id(g_light_power_optimistic_target) == 3)
                    ? id(g_light_power_optimistic_on)
                    : id(strip_light_state).state == "on";
                id(g_light_power_optimistic_target) = 3;
                id(g_light_power_optimistic_on) = !currently_on;
                id(g_light_power_optimistic_valid) = true;
            - script.execute: render_main
            - script.execute: refresh_visible_display
            - if:
                condition: { lambda: 'return id(g_light_power_optimistic_on);' }
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: ${strip_light_entity}
                        brightness_pct: !lambda |-
                          const int pct = (int) roundf(fmaxf(1.0f, fminf(100.0f, id(g_strip_last_brightness) * 100.0f)));
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d", pct);
                          return std::string(buf);
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${strip_light_entity}
            - script.execute: light_power_optimistic_settle
      # The three climate pages follow the light shape: flip the local power state,
      # repaint, then send the toggle. Unlike the lights there is nothing to send
      # along with it - HA restores its own HVAC mode, and the setpoint the screen
      # shows is the one HA keeps publishing even while the unit is off, so the
      # number is honest the moment the page lights up.
      - if:
          condition: { lambda: 'return id(g_target) == 4;' }
          then:
            - lambda: |-
                const auto s = id(climate_state).state;
                const bool currently_on =
                  (id(g_climate_power_optimistic_valid) && id(g_climate_power_optimistic_target) == 4)
                    ? id(g_climate_power_optimistic_on)
                    : (!s.empty() && s != "off" && s != "unknown" && s != "unavailable");
                id(g_climate_power_optimistic_target) = 4;
                id(g_climate_power_optimistic_on) = !currently_on;
                id(g_climate_power_optimistic_valid) = true;
            - script.execute: render_main
            - script.execute: refresh_visible_display
            - homeassistant.action: { action: climate.toggle, data: { entity_id: '${living_room_climate_entity}' } }
            - script.execute: climate_power_optimistic_settle
      - if:
          condition: { lambda: 'return id(g_target) == 5;' }
          then:
            - lambda: |-
                const auto s = id(dining_room_climate_state).state;
                const bool currently_on =
                  (id(g_climate_power_optimistic_valid) && id(g_climate_power_optimistic_target) == 5)
                    ? id(g_climate_power_optimistic_on)
                    : (!s.empty() && s != "off" && s != "unknown" && s != "unavailable");
                id(g_climate_power_optimistic_target) = 5;
                id(g_climate_power_optimistic_on) = !currently_on;
                id(g_climate_power_optimistic_valid) = true;
            - script.execute: render_main
            - script.execute: refresh_visible_display
            - homeassistant.action: { action: climate.toggle, data: { entity_id: '${dining_room_climate_entity}' } }
            - script.execute: climate_power_optimistic_settle
      - if:
          condition: { lambda: 'return id(g_target) == 6;' }
          then:
            - lambda: |-
                const auto s = id(floor_heating_state).state;
                const bool currently_on =
                  (id(g_climate_power_optimistic_valid) && id(g_climate_power_optimistic_target) == 6)
                    ? id(g_climate_power_optimistic_on)
                    : (!s.empty() && s != "off" && s != "unknown" && s != "unavailable");
                id(g_climate_power_optimistic_target) = 6;
                id(g_climate_power_optimistic_on) = !currently_on;
                id(g_climate_power_optimistic_valid) = true;
            - script.execute: render_main
            - script.execute: refresh_visible_display
            - homeassistant.action: { action: climate.toggle, data: { entity_id: '${floor_heating_entity}' } }
            - script.execute: climate_power_optimistic_settle
      - if:
          condition: { lambda: 'return id(g_target) == 7;' }
          then:
            - if:
                condition:
                  lambda: |-
                    const std::string state = id(tv_state).state;
                    return state == "on" || state == "playing" || state == "paused";
                then:
                  - homeassistant.action:
                      action: media_player.volume_mute
                      data:
                        entity_id: ${tv_entity}
                        is_volume_muted: !lambda 'return id(tv_muted).state ? std::string("false") : std::string("true");'
                else:
                  - if:
                      condition:
                        lambda: |-
                          const std::string state = id(homepod_state).state;
                          return state == "on" || state == "playing" || state == "paused";
                      then:
                        - homeassistant.action:
                            action: media_player.volume_mute
                            data:
                              entity_id: ${homepod_entity}
                              is_volume_muted: !lambda 'return id(homepod_muted).state ? std::string("false") : std::string("true");'
                      else:
                        - switch.toggle: dac_unmute
      # Haptic-style feedback runs last so it never delays the outbound command.
      # Ring-only: the old wheel_pill flash is gone along with the pill background.
      - script.execute: ring_tap_feedback

  - id: dispatch_gesture
    then:
      # Dedicated TV progress matrix gestures (11=Confirm, 12=Back, 13=Up, 14=Down).
      - if:
          condition: { lambda: 'return id(g_gesture) == 11;' }
          then:
            - script.execute: handle_tap
      - if:
          condition: { lambda: 'return id(g_gesture) == 12;' }
          then:
            - homeassistant.action:
                action: remote.send_command
                data: { entity_id: '${tv_remote_entity}', command: Return }
            - script.execute: ring_tap_feedback
      - if:
          condition: { lambda: 'return id(g_gesture) == 13;' }
          then:
            - homeassistant.action:
                action: remote.send_command
                data: { entity_id: '${tv_remote_entity}', command: Up }
            - script.execute: ring_tap_feedback
      - if:
          condition: { lambda: 'return id(g_gesture) == 14;' }
          then:
            - homeassistant.action:
                action: remote.send_command
                data: { entity_id: '${tv_remote_entity}', command: Down }
            - script.execute: ring_tap_feedback
      # HomePod controls are shared by both progress and volume pages.
      - if:
          condition: { lambda: 'return id(g_gesture) == 15;' }
          then:
            - homeassistant.action: { action: media_player.media_previous_track, data: { entity_id: '${homepod_entity}' } }
            - script.execute: ring_tap_feedback
      - if:
          condition: { lambda: 'return id(g_gesture) == 16;' }
          then:
            - homeassistant.action: { action: media_player.media_play_pause, data: { entity_id: '${homepod_entity}' } }
            - script.execute: ring_tap_feedback
      - if:
          condition: { lambda: 'return id(g_gesture) == 17;' }
          then:
            - homeassistant.action: { action: media_player.media_next_track, data: { entity_id: '${homepod_entity}' } }
            - script.execute: ring_tap_feedback
      # 本机 mode 3 (电量) is read-only. Media control backgrounds do not act as buttons.
      - if:
          condition: { lambda: 'return id(g_gesture) == 0 && !(id(g_target) == 7 && id(g_control_mode) == 3) && !(id(g_target) == 0 && id(g_control_mode) == 0) && !(id(g_target) == 1 && id(g_control_mode) == 0);' }
          then:
            - script.execute: handle_tap
      # P6 defers Voice Assistant; a recognized long press is intentionally consumed.
      - if:
          condition: { lambda: 'return id(g_gesture) == 2;' }
          then:
            - script.execute: { id: cycle_target, direction: 1 }
      - if:
          condition: { lambda: 'return id(g_gesture) == 3;' }
          then:
            - script.execute: { id: cycle_target, direction: -1 }
      - if:
          condition: { lambda: 'return id(g_gesture) == 4;' }
          then:
            - script.execute: { id: switch_mode, direction: 1 }
      - if:
          condition: { lambda: 'return id(g_gesture) == 5;' }
          then:
            - script.execute: { id: switch_mode, direction: -1 }

  - id: handle_knob
    parameters:
      direction: int
    then:
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: handle_knob
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t previous_rotate = id(g_knob_last_rotate_ms);
          id(g_last_activity) = now;
          id(g_knob_last_rotate_ms) = now;
          const bool tv_volume_muted = id(g_target) == 0 && id(g_control_mode) == 1 && id(tv_muted).state;
          const bool homepod_volume_inactive = id(g_target) == 1 && id(g_control_mode) == 1 &&
            id(homepod_state).state != "playing";
          lv_obj_set_style_text_color(id(lbl_value), lv_color_hex((tv_volume_muted || homepod_volume_inactive) ? 0x617681 : 0xFFFFFF), LV_PART_MAIN);
          lv_obj_set_style_arc_opa(id(arc_value), LV_OPA_COVER, LV_PART_INDICATOR);
          lv_obj_set_style_opa(id(arc_value), LV_OPA_TRANSP, LV_PART_KNOB);
          lv_obj_set_style_bg_opa(id(arc_value), LV_OPA_TRANSP, LV_PART_KNOB);

          // Reuse the pending value during a fast burst; never restart from a stale HA sensor.
          const bool reuse = id(g_optimistic_valid) && id(g_optimistic_target) == id(g_target) &&
            id(g_optimistic_mode) == id(g_control_mode) && now - previous_rotate <= 2000;
          float value = reuse ? id(g_optimistic_value) : 0.0f;
          bool optimistic = true;
          const int target = id(g_target), mode = id(g_control_mode);
          const float speed_pct = (float) id(g_knob_speed_pct);
          if (target == 0 && mode == 1) {
            if (!reuse) value = isnan(id(tv_volume).state) ? 0.0f : id(tv_volume).state * 100.0f;
            const float step = speed_pct;
            value = fminf(100.0f, fmaxf(0.0f, value + direction * step));
          } else if (target == 0 && mode == 0) {
            optimistic = false;  // TV directional navigation has no synthetic progress value.
          } else if (target == 1 && mode == 1) {
            if (!reuse) value = isnan(id(homepod_volume).state) ? 0.0f : id(homepod_volume).state * 100.0f;
            const float step = speed_pct;
            value = fminf(100.0f, fmaxf(0.0f, value + direction * step));
          } else if (target == 1 && mode == 0) {
            if (!reuse) value = isnan(id(homepod_position).state) ? 0.0f : id(homepod_position).state;
            const float duration = id(homepod_duration).state;
            float seek_step;
            if (!isnan(duration) && duration > 0) {
              const float normalized = fminf(100.0f, fmaxf(0.0f, value / duration * 100.0f));
              seek_step = duration * speed_pct / 100.0f;
            } else {
              seek_step = speed_pct * 2.0f;  // 2..40 s fallback when duration is unknown.
            }
            value = fmaxf(0.0f, value + direction * seek_step);
            if (!isnan(duration) && duration > 0) value = fminf(value, duration);
          } else if (target == 2 && mode == 0) {
            if (!reuse) value = isnan(id(ceiling_light_brightness).state) ? 0.0f : id(ceiling_light_brightness).state / 2.55f;
            const float step = speed_pct;
            value = fminf(100.0f, fmaxf(0.0f, value + direction * step));
          } else if (target == 2 && mode == 1) {
            if (!reuse) value = isnan(id(ceiling_light_color_temp).state) ? 4000.0f : id(ceiling_light_color_temp).state;
            const float ct_span = ${ceiling_ct_max}.0f - ${ceiling_ct_min}.0f;
            const float pct = speed_pct;
            const float kelvin_step = fmaxf(100.0f, roundf((ct_span * pct / 100.0f) / 100.0f) * 100.0f);
            value = roundf(fminf(${ceiling_ct_max}.0f, fmaxf(${ceiling_ct_min}.0f, value + direction * kelvin_step)) / 100.0f) * 100.0f;
          } else if (target == 3 && mode == 0) {
            if (!reuse) value = isnan(id(strip_light_brightness).state) ? 0.0f : id(strip_light_brightness).state / 2.55f;
            const float step = speed_pct;
            value = fminf(100.0f, fmaxf(0.0f, value + direction * step));
          } else if (target == 3 && mode == 1) {
            if (!reuse) value = isnan(id(strip_light_hue).state) ? 0.0f : id(strip_light_hue).state;
            // Hue is the only mode with no natural quantum, so the raw
            // 360 * pct / 100 mapping put a 72 deg jump on the top of the
            // acceleration curve - a full quarter of the colour wheel per pulse.
            // Clamped to 2..15 deg: the ceiling bites from ~5 % upward, so fast
            // turns cross the wheel in 24 pulses at a constant, readable rate
            // instead of teleporting between hues.
            const float hue_step = fminf(15.0f, fmaxf(2.0f, 360.0f * speed_pct / 100.0f));
            value = fmodf(value + direction * hue_step + 3600.0f, 360.0f);
          } else if (target >= 4 && target <= 6 && mode == 0) {
            if (!reuse) value = target == 4 ? id(climate_target_temperature).state :
              (target == 5 ? id(dining_room_climate_target_temp).state : id(floor_heating_target_temp).state);
            if (isnan(value)) value = 22.0f;
            const float normalized = (value - 16.0f) / 15.0f * 100.0f;
            const float pct = speed_pct;
            const float temp_step = fmaxf(0.5f, roundf((15.0f * pct / 100.0f) * 2.0f) / 2.0f);
            value = roundf(fminf(31.0f, fmaxf(16.0f, value + direction * temp_step)) * 2.0f) / 2.0f;
          } else if (target >= 4 && target <= 6 && mode == 1) {
            if (!reuse) {
              const std::string state = target == 4 ? id(climate_state).state :
                (target == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
              if (target == 6) {
                static const char *modes[] = {"off", "auto", "heat"};
                for (int i=0;i<3;i++) if (state == modes[i]) value = i;
              } else {
                static const char *modes[] = {"off", "auto", "cool", "heat", "dry", "fan_only"};
                for (int i=0;i<6;i++) if (state == modes[i]) value = i;
              }
            }
            const int count = target == 6 ? 3 : 6;
            value = ((int) value + (direction > 0 ? 1 : count - 1)) % count;
          } else if (target == 7 && mode == 0) {
            if (!reuse) value = id(g_local_volume);
            const float step = speed_pct;
            value = fminf(100.0f, fmaxf(0.0f, value + direction * step));
          } else if (target == 7 && mode == 1) {
            if (!reuse) value = id(g_backlight_pct);
            const float normalized = (value - 10.0f) / 90.0f * 100.0f;
            const float step = speed_pct;
            value = fminf(100.0f, fmaxf(10.0f, value + direction * step));
          } else if (target == 7 && mode == 2) {
            // 锁屏亮度 5-50 %: a fixed 2 % detent. The acceleration curve used by
            // the other percentage modes is deliberately skipped - the whole range
            // is 45 points wide, so a linear step already crosses it in ~23 clicks.
            if (!reuse) value = id(g_aod_backlight_pct);
            const float step = 2.0f;
            value = fminf(50.0f, fmaxf(5.0f, value + direction * step));
          } else optimistic = false;   // mode 3 (电量) is read-only

          id(g_optimistic_valid) = optimistic;
          if (optimistic) {
            id(g_optimistic_target) = target;
            id(g_optimistic_mode) = mode;
            id(g_optimistic_value) = value;
          }
          // Dialling brightness is also a power change on the strip: 0 % turns it
          // off, anything above 0 turns it back on. (The ceiling light resolves
          // brightness 0 to "off" inside its HA template, so it needs no branch.)
          if (target == 3 && mode == 0) {
            id(g_light_power_optimistic_target) = 3;
            id(g_light_power_optimistic_on) = value > 0.0f;
            id(g_light_power_optimistic_valid) = true;
          }
      - script.execute: knob_visual_settle
      - script.execute: optimistic_settle
      - script.execute: render_main
      - script.execute: refresh_visible_display
      - if:
          condition: { lambda: 'return id(g_sleeping);' }
          then:
            - script.execute: wake_display
      - script.execute:
          id: ring_rotate_feedback
          direction: !lambda 'return direction;'
      # g_target == current_device_index; g_control_mode == current_mode_index.
      # Every branch checks both values so knob actions always follow the visible mode.
      - if:
          condition: { lambda: 'return id(g_target) == 0 && id(g_control_mode) == 1;' }
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: ${tv_entity}
                  volume_level: !lambda |-
                    const float value = id(g_optimistic_value) / 100.0f;
                    char text[8]; snprintf(text, sizeof(text), "%.2f", value); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 0 && id(g_control_mode) == 0;' }
          then:
            - if:
                condition: { lambda: 'return direction > 0;' }
                then:
                  - homeassistant.action:
                      action: remote.send_command
                      data:
                        entity_id: ${tv_remote_entity}
                        command: Right
                else:
                  - homeassistant.action:
                      action: remote.send_command
                      data:
                        entity_id: ${tv_remote_entity}
                        command: Left
      - if:
          condition: { lambda: 'return id(g_target) == 1 && id(g_control_mode) == 1;' }
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: ${homepod_entity}
                  volume_level: !lambda |-
                    const float value = id(g_optimistic_value) / 100.0f;
                    char text[8]; snprintf(text, sizeof(text), "%.2f", value); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 1 && id(g_control_mode) == 0;' }
          then:
            - homeassistant.action:
                action: media_player.media_seek
                data:
                  entity_id: ${homepod_entity}
                  seek_position: !lambda |-
                    const float value = id(g_optimistic_value);
                    char text[16]; snprintf(text, sizeof(text), "%.1f", value); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 2 && id(g_control_mode) == 0;' }
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${ceiling_light_entity}
                  brightness: !lambda |-
                    char text[8]; snprintf(text, sizeof(text), "%.0f", roundf(id(g_optimistic_value) * 2.55f)); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 2 && id(g_control_mode) == 1;' }
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${ceiling_light_entity}
                  # HA has no color_temp_step action field; calculate the next valid Kelvin value.
                  color_temp_kelvin: !lambda |-
                    const float value = id(g_optimistic_value);
                    char text[8]; snprintf(text, sizeof(text), "%.0f", value); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 3 && id(g_control_mode) == 0;' }
          then:
            - if:
                condition:
                  lambda: 'return id(g_optimistic_value) <= 0.0f;'
                then:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${strip_light_entity}
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: ${strip_light_entity}
                        brightness_pct: !lambda |-
                          char text[8];
                          snprintf(text, sizeof(text), "%.0f", id(g_optimistic_value));
                          return std::string(text);
            - script.execute: light_power_optimistic_settle
      - if:
          condition: { lambda: 'return id(g_target) == 3 && id(g_control_mode) == 1;' }
          then:
            # hs_color must reach HA as a real 2-element list. Plain `data` sends
            # everything as a string, which fails light.turn_on's schema, so the value
            # goes through `variables` + `data_template` and HA parses the rendered
            # "[h, 100]" back into a list.
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${strip_light_entity}
                variables:
                  hue_value: !lambda 'return id(g_optimistic_value);'
                data_template:
                  hs_color: "[{{ hue_value | float | round(0) }}, 100]"
      - if:
          condition: { lambda: 'return id(g_target) == 4 && id(g_control_mode) == 0;' }
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${living_room_climate_entity}
                  temperature: !lambda |-
                    const float value = id(g_optimistic_value);
                    char text[8]; snprintf(text, sizeof(text), "%.1f", value); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 4 && id(g_control_mode) == 1;' }
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${living_room_climate_entity}
                  hvac_mode: !lambda |-
                    static const char *modes[] = {"off", "auto", "cool", "heat", "dry", "fan_only"};
                    int current = (int) roundf(id(g_optimistic_value));
                    if (current < 0) current = 0; if (current > 5) current = 5;
                    return std::string(modes[current]);
      - if:
          condition: { lambda: 'return id(g_target) == 5 && id(g_control_mode) == 0;' }
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${dining_room_climate_entity}
                  temperature: !lambda |-
                    const float value = id(g_optimistic_value);
                    char text[8]; snprintf(text, sizeof(text), "%.1f", value); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 5 && id(g_control_mode) == 1;' }
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${dining_room_climate_entity}
                  hvac_mode: !lambda |-
                    static const char *modes[] = {"off", "auto", "cool", "heat", "dry", "fan_only"};
                    int current = (int) roundf(id(g_optimistic_value));
                    if (current < 0) current = 0; if (current > 5) current = 5;
                    return std::string(modes[current]);
      - if:
          condition: { lambda: 'return id(g_target) == 6 && id(g_control_mode) == 0;' }
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${floor_heating_entity}
                  temperature: !lambda |-
                    const float value = id(g_optimistic_value);
                    char text[8]; snprintf(text, sizeof(text), "%.1f", value); return std::string(text);
      - if:
          condition: { lambda: 'return id(g_target) == 6 && id(g_control_mode) == 1;' }
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${floor_heating_entity}
                  hvac_mode: !lambda |-
                    static const char *modes[] = {"off", "auto", "heat"};
                    int current = (int) roundf(id(g_optimistic_value));
                    if (current < 0) current = 0; if (current > 2) current = 2;
                    return std::string(modes[current]);
      - if:
          condition: { lambda: 'return id(g_target) == 7 && id(g_control_mode) == 0;' }
          then:
            - lambda: 'id(g_local_volume) = id(g_optimistic_value);'
            # The knob used to only move a number on screen. `voice_assistant`
            # writes TTS straight into `magic_dial_speaker`, and the PCM5100A has
            # no I2C control surface (so no `audio_dac:` component), which means
            # the ONLY volume stage in the whole output path is the i2s_audio
            # speaker's software q31 gain. Setting it here is what makes the dial
            # actually control VA playback loudness.
            - script.execute: apply_local_volume
            - script.execute: render_main
      - if:
          condition: { lambda: 'return id(g_target) == 7 && id(g_control_mode) == 1;' }
          then:
            - lambda: 'id(g_backlight_pct) = (int) roundf(id(g_optimistic_value));'
            - light.turn_on:
                id: backlight_light
                brightness: !lambda 'return id(g_backlight_pct) / 100.0f;'
            - script.execute: render_main
      # 锁屏亮度 only takes effect the next time the dial falls asleep, so the
      # backlight is deliberately NOT touched here.
      - if:
          condition: { lambda: 'return id(g_target) == 7 && id(g_control_mode) == 2;' }
          then:
            - lambda: 'id(g_aod_backlight_pct) = (int) roundf(id(g_optimistic_value));'
            - script.execute: render_main
      # Mirror the new value onto the Ulanzi pixel clock. Runs last so it always
      # reflects the value that was just pushed to HA above.
      - script.execute:
          id: publish_knob_bar
          force: false
      - script.execute: knob_bar_trailing

  # Pushes `g_local_volume` (0-100 %) into the i2s_audio speaker.
  #
  # Why this exists: there is no `media_player:` component on this device. The
  # "本机扬声器" knob target was purely cosmetic -- it moved `g_local_volume` and
  # re-rendered the screen, and nothing ever reached the audio path, so VA TTS
  # always played at the hardware full-scale level.
  #
  # `speaker.volume_set` on an `i2s_audio` speaker with no `audio_dac:`
  # configured falls back to software volume: it converts the 0.0-1.0 value into
  # a Q31 gain factor (linear over -49 dB .. 0 dB) that
  # `I2SAudioSpeakerBase::apply_software_volume_` applies to every buffer written
  # to the DAC. `voice_assistant` hands TTS chunks to the exact same speaker
  # object, so this covers VA playback, `speaker.play`, and any future media.
  #
  # 100 % is special-cased upstream to INT32_MAX, i.e. the gain stage is skipped
  # entirely -- so the default is bit-identical to the pre-fix behaviour.
  - id: apply_local_volume
    mode: restart
    then:
      - speaker.volume_set:
          id: magic_dial_speaker
          volume: !lambda 'return fminf(1.0f, fmaxf(0.0f, id(g_local_volume) / 100.0f));'

  # Renders the current knob value as a 52x16 full-screen bar and publishes it
  # straight to the Ulanzi's custom app (`ulanzi_aa68/custom/test`). The frame is
  # built on-device by ulanzi_bar.h, so nothing but the broker sits between the
  # knob and the pixels - the bar is intentionally the highest-priority thing on
  # the Ulanzi and does not take `input_text.ulanzi_display_owner`.
  #
  # `force: false` = called from handle_knob on every pulse, throttled to 200 ms
  #                  so the Ulanzi is not flooded (see g_knob_pub_ms).
  # `force: true`  = trailing call from knob_bar_trailing once the knob settles;
  #                  ignores the throttle but skips duplicate values.
  #
  # pct and the accent color mirror the branch table in handle_knob one-for-one.
  # `duration: 3` lets the frame time out on its own, so there is no clear message
  # and whatever the Ulanzi was showing comes back by itself.
  - id: publish_knob_bar
    parameters:
      force: bool
    mode: single
    then:
      - lambda: |-
          const int target = id(g_target), mode = id(g_control_mode);
          const uint32_t now = millis();
          id(g_knob_pub_ok) = false;

          // Branches without a synthetic value (e.g. TV directional navigation)
          // have nothing meaningful to show as a bar.
          if (!id(g_optimistic_valid)) return;
          const float v = id(g_optimistic_value);

          float pct;
          uint32_t rgb;
          bool hue_mode = false;
          if (target == 0 && mode == 1) {                      // TV volume
            pct = v; rgb = 0x00B4D8;
          } else if (target == 1 && mode == 1) {               // HomePod volume
            pct = v; rgb = 0x00B4D8;
          } else if (target == 1 && mode == 0) {               // HomePod seek
            const float duration = id(homepod_duration).state;
            if (isnan(duration) || duration <= 0) return;      // no scale -> no bar
            pct = v / duration * 100.0f; rgb = 0xFFFFFF;
          } else if (target == 2 && mode == 0) {               // ceiling brightness
            pct = v; rgb = 0xFFD580;
          } else if (target == 2 && mode == 1) {               // ceiling colour temperature
            pct = (v - ${ceiling_ct_min}.0f) / ((${ceiling_ct_max}.0f - ${ceiling_ct_min}.0f) / 100.0f); rgb = 0x87CEEB;
          } else if (target == 3 && mode == 0) {               // strip brightness
            pct = v; rgb = 0xFFD580;
          } else if (target == 3 && mode == 1) {               // strip hue 0-360
            pct = v / 3.6f; rgb = 0; hue_mode = true;
          } else if (target >= 4 && target <= 6 && mode == 0) {  // climate 16-31 C
            pct = (v - 16.0f) / 15.0f * 100.0f; rgb = 0xFF6B35;
          } else if (target >= 4 && target <= 6 && mode == 1) {  // hvac mode index
            const int count = target == 6 ? 3 : 6;
            pct = ((int) roundf(v)) * 100.0f / (count - 1);
            rgb = 0xFF6B35;
          } else if (target == 7 && mode == 0) {               // local speaker volume
            pct = v; rgb = 0xAAAAAA;
          } else if (target == 7 && mode == 1) {               // backlight 10-100 %
            pct = (v - 10.0f) / 90.0f * 100.0f; rgb = 0xFFD580;
          } else if (target == 7 && mode == 2) {               // aod backlight 5-50 %
            pct = (v - 5.0f) / 45.0f * 100.0f; rgb = 0x4488FF;
          } else {
            return;
          }

          const int p = (int) roundf(fminf(100.0f, fmaxf(0.0f, pct)));
          if (!force) {
            if (now - id(g_knob_pub_ms) < 200) return;         // leading-edge throttle
          } else if (p == id(g_knob_pub_pct)) {
            return;                                            // trailing frame is a no-op
          }

          uint8_t r, g, b;
          if (hue_mode) {
            // The light-strip hue mode paints the bar in the hue being dialed in.
            ulanzi_bar::hsv_to_rgb(v, r, g, b);
          } else {
            r = (rgb >> 16) & 0xFF; g = (rgb >> 8) & 0xFF; b = rgb & 0xFF;
          }

          id(g_knob_pub_ms) = now;
          id(g_knob_pub_pct) = p;
          id(g_knob_pub_payload) = ulanzi_bar::payload((float) p, r, g, b, 3);
          id(g_knob_pub_ok) = true;
      - if:
          condition:
            lambda: 'return id(g_knob_pub_ok) && id(mqtt_client)->is_connected();'
          then:
            - mqtt.publish:
                topic: ulanzi_aa68/custom/test
                qos: 0
                retain: false
                payload: !lambda 'return id(g_knob_pub_payload);'

  # Trailing edge. Every knob pulse restarts this, so it fires 260 ms after the
  # knob stops and guarantees the bar ends on the real value even when the 200 ms
  # throttle dropped the final pulse.
  - id: knob_bar_trailing
    mode: restart
    then:
      - delay: 260ms
      - script.execute:
          id: publish_knob_bar
          force: true

interval:
  # The FreeRTOS worker only downloads into the inactive PSRAM buffer. This
  # short main-loop callback is the sole owner of LVGL source changes.
  - interval: 100ms
    then:
      - lambda: |-
          uint8_t *buffer = nullptr;
          const auto result = magic_dial::media_artwork::loader.poll(&buffer);
          id(g_aod_media_download_result) = static_cast<int>(result);
          if (result == magic_dial::media_artwork::PollResult::READY) {
            id(g_aod_media_ready) = true;
            static lv_draw_buf_t artwork_draw_buf;
            lv_draw_buf_init(&artwork_draw_buf,
                             magic_dial::media_artwork::WIDTH,
                             magic_dial::media_artwork::HEIGHT,
                             LV_COLOR_FORMAT_RGB565, 0, buffer,
                             magic_dial::media_artwork::BUFFER_BYTES);
            lv_draw_buf_set_flag(&artwork_draw_buf, LV_IMAGE_FLAGS_MODIFIABLE);
            lv_canvas_set_draw_buf(id(aod_media_image), &artwork_draw_buf);
            lv_obj_invalidate(id(aod_media_image));
            ESP_LOGI("aod_media", "Published canvas buffer: sleeping=%s data=%p size=%u %ux%u",
                     id(g_sleeping) ? "yes" : "no", buffer,
                     static_cast<unsigned>(magic_dial::media_artwork::BUFFER_BYTES),
                     static_cast<unsigned>(magic_dial::media_artwork::WIDTH),
                     static_cast<unsigned>(magic_dial::media_artwork::HEIGHT));
            id(mqtt_client)->publish("magic_dial/debug/artwork/ready",
                                     id(aod_media_artwork_url).state, 0, false);
          } else if (result == magic_dial::media_artwork::PollResult::ERROR) {
            id(g_aod_media_ready) = false;
            id(mqtt_client)->publish("magic_dial/debug/artwork/error",
                                     id(aod_media_artwork_url).state, 0, false);
          }
      - if:
          condition:
            lambda: "return id(g_aod_media_download_result) != 0;"
          then:
            - script.execute: apply_screen_brightness
            - if:
                condition:
                  lambda: "return id(g_sleeping);"
                then:
                  - script.execute: render_aod
                  - lambda: |-
                      lv_obj_move_foreground(id(aod_media_image));
                      lv_obj_invalidate(lv_screen_active());
                      lv_refr_now(lv_display_get_default());
      - lambda: |-
          magic_dial::screenshot::publisher.publish_next(id(mqtt_client));

  - interval: 1s
    then:
      # Charging "filling" animation, ported from upstream. Only advanced while 本机
      # mode 3 (电量) is on screen, so it costs nothing the rest of the time.
      - if:
          condition:
            lambda: 'return id(g_charging) && !id(g_sleeping) && id(g_target) == 7 && id(g_control_mode) == 3;'
          then:
            - lambda: 'id(g_chg_anim) = (id(g_chg_anim) + 1) % 5;'
            - script.execute: render_main
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active) && millis() - id(g_va_started_ms) > 120000;' }
          then:
            - voice_assistant.stop:
            - script.execute: va_cleanup
      # [VA] Normal session end: the component is IDLE *and* the pipeline has
      # been completely silent for 8 s. The previous 3 s version watched
      # is_running() alone and lost: in a continued conversation the gap between
      # turns really does leave the component IDLE -- HA, not the component,
      # opens the next turn -- and after a few rounds that gap exceeded 3 s,
      # tearing the screen down while the conversation was still alive. Every
      # trigger stamps g_va_last_evt_ms, so any sign of life (even a VAD edge)
      # restarts the count. A genuine goodbye usually exits sooner through
      # on_error (stt-no-text-recognized); this is the quiet fallback.
      - if:
          condition:
            lambda: |-
              return id(g_va_active) && !id(magic_dial_va).is_running() &&
                millis() - id(g_va_last_evt_ms) > 8000;
          then:
            - logger.log: "[vatrace] idle+silent 8s -> cleanup"
            - script.execute: va_cleanup
      # [VA] Stuck-listening watchdog. The turn is normally closed by HA's microVAD
      # a second or so after the finger comes up, so still sitting in `listening`
      # with nothing recognised after 12 s means the session is phantom (VAD never
      # fired, or the mic produced no usable audio). End it instead of quietly
      # holding the microphone open until the 120 s ceiling above.
      - if: # [VA]
          condition:
            lambda: |-
              return id(g_va_active) && id(g_va_phase) == 1 &&
                !id(g_va_stt_seen) && millis() - id(g_va_started_ms) > 12000;
          then:
            - voice_assistant.stop:
            - script.execute: va_fail
      - if:
          condition:
            lambda: 'return !id(g_sleeping) && !id(g_va_active) && millis() - id(g_last_activity) >= 60000;'
          then:
            - script.execute: enter_sleep

  # [VA] The former 100 ms animation driver is gone. It hand-stepped the
  # listening bars, the thinking arc rotations and the speaking wave from the
  # main loop, which capped every assistant animation at 10 fps and competed
  # with the audio path for loop time. The assistant page is now a static mic
  # glyph plus a text line, repainted only when the phase actually changes, and
  # the only periodic writer left is the on-demand `va_think_pulse` script, so
  # there is nothing to tick globally here.

font:
  # P6 typography. Local TTFs are used instead of `gfonts://` so the exact
  # Roboto Mono Medium / Noto Sans SC weights are embedded deterministically and
  # the build never silently falls back to the LVGL default font.
  # Latin coverage is spelled out explicitly rather than via GF_Latin_Core,
  # which pulled in 96 accented glyphs the UI never shows.
  # Material Design Icons webfont, the same source the reference Guition project
  # uses. An icon font sidesteps PNG asset paths entirely and lets the icon take
  # the label's text color.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_28
    size: 28
    bpp: 4
    glyphs:
      - "󰔂"  # mdi-television
      - "󰓃"  # mdi-speaker
      - "󰝩"  # mdi-ceiling-light
      - "󰟖"  # mdi-led-strip
      - "󰀛"  # mdi-air-conditioner
      - "󰐸"  # mdi-radiator
      - "󱮖"  # mdi-knob
      # Battery page: static level icons ...
      - "󰁹"  # mdi-battery
      - "󰂁"  # mdi-battery-80
      - "󰁿"  # mdi-battery-60
      - "󰁽"  # mdi-battery-40
      - "󰁻"  # mdi-battery-20
      - "󰂎"  # mdi-battery-outline (no reading yet)
      # ... plus the five charging animation frames.
      - "󰂆"  # mdi-battery-charging-20
      - "󰂈"  # mdi-battery-charging-40
      - "󰂉"  # mdi-battery-charging-60
      - "󰂊"  # mdi-battery-charging-80
      - "󰂅"  # mdi-battery-charging-100
      # [VA] Assistant states. These MUST be declared here: the VA page renders
      # them through `font_icons_28`, and an undeclared codepoint draws as a
      # filled box, which is exactly what the first VA build showed.
      - "󰍬"  # mdi-microphone (listening / proactive ask)
      - "󰇙"  # mdi-dots-horizontal (thinking)
      - "󰅖"  # mdi-close (error)
  # [VA] font_va_icons_44 was removed together with the mic glyph: the assistant
  # page now shows the Doubao avatar image instead, so a dedicated 44 px icon
  # face carrying three glyphs is dead weight in flash.
  # Dedicated TV remote icon fonts. Both sizes are embedded so press feedback
  # shrinks the glyph without relying on an undeclared LVGL fallback font.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_remote_28
    size: 28
    bpp: 4
    glyphs: ["󰐊", "󰏤", "󰌑", "󰁝", "󰁅", "󰒮", "󰒭"]
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_remote_24
    size: 24
    bpp: 4
    glyphs: ["󰐊", "󰏤", "󰌑", "󰁝", "󰁅", "󰒮", "󰒭"]
  # AOD lock screen: Pacifico script face, digits + colon only.
  - file: fonts/Pacifico.ttf
    id: font_pacifico_aod
    size: 138
    bpp: 4
    glyphs: "0123456789:"
  - file: fonts/RobotoMono-Medium.ttf
    id: font_mono_76
    size: 76
    bpp: 4
    glyphs: &mono_glyphs "0123456789:.-—"
  - file: fonts/RobotoMono-Medium.ttf
    id: font_mono_68
    size: 68
    bpp: 4
    glyphs: *mono_glyphs
  - file: fonts/NotoSansSC-Medium.ttf
    id: font_sc_24
    size: 24
    bpp: 4
    glyphs: &p6_glyphs " !%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz年月日星期一二三四五六天·客餐厅电视音量箱吸顶灯带亮度色温相空调目标模式本机屏幕进设备离线正在同步时间低中高制冷热自动送风除湿关闭已打开暂停播放当前魔法旋钮元旦春节清明劳端午秋国庆圣诞复活万情人母父感恩无效连接失败听请重试上下左右暖扇扬声器圆盘地提问↔▶Ⅱ°—充锁|出现错误说话"
  # [VA] `font_va_30` used to live here for the `va_bars` ASCII level meter
  # ("|||||" / "-----"). Both the meter and its font are gone now that the
  # listening and speaking states are pre-rendered ribbons; the only remaining
  # VA text is 正在提问 / 出现错误, which render from the shared font_sc_24.
  # Hero value fonts run at bpp 4 again: the 16 MB partition table (~7.94 MB app
  # slot) leaves plenty of room, so the ~400 KB of 52 px / 44 px bitmaps that
  # forced the earlier bpp 2 downgrade are no longer a problem. Glyph sets stay
  # trimmed - these fonts only ever render a handful of characters.
  - file: fonts/NotoSansSC-Medium.ttf
    id: font_sc_52
    size: 52
    bpp: 4
    # Hero font only ever renders: ▶ / Ⅱ (TV transport), 暖↔冷 (color temp),
    # 低 / 中 / 高 (screen brightness), plus a digit/em-dash safety net for the
    # single frame between a text update and the font switch. 202 -> 23 glyphs.
    glyphs: "%-.0123456789:—Ⅱ↔▶中低冷暖高"
  - file: fonts/NotoSansSC-Medium.ttf
    id: font_sc_44
    size: 44
    bpp: 4
    # Only the climate mode names: 关闭/自动/制冷/制热/除湿/送风 (+ digit safety net).
    glyphs: "%-.0123456789:—关冷制动湿热自送闭除风"
  - file: fonts/NotoSansSC-Regular.ttf
    id: font_sc_20
    size: 20
    bpp: 4
    glyphs: *p6_glyphs
  - file: fonts/NotoSansSC-Regular.ttf
    id: font_sc_18
    size: 18
    bpp: 4
    glyphs: *p6_glyphs
  - file: fonts/NotoSansSC-Medium.ttf
    id: font_sc_16
    size: 16
    bpp: 4
    glyphs: *p6_glyphs

# [VA] 2026-08-29: the pre-rendered interwoven-arc frames are NO LONGER built
# into the firmware. `image: !include va_arc_images.yaml` used to pull in 90
# 192x56 RGB565 PNGs (~1.85 MB of flash) for the animimg ribbons; on real
# hardware the effect did not justify either the flash or the per-frame LVGL
# image-cache churn in internal RAM, so the assistant page went back to plain
# LVGL text: one large mic glyph plus an ASCII status line.
# images/va_arc_*/, va_arc_images.yaml and tools/gen_va_arcs.py are kept on disk
# (and whitelisted in .gitignore) purely as a rollback path -- re-adding the one
# include line above brings the whole scheme back.

# [VA] The one image left in the build: the Doubao mascot on the assistant page.
# OPAQUE on purpose. `transparency: alpha_channel` was tried first and rendered
# the face as a rainbow gradient: ESPHome declares the buffer as
# LV_COLOR_FORMAT_RGB565A8 but emits 3 interleaved bytes per pixel (RGB565 + A),
# while LVGL's RGB565A8 is planar (w*h*2 colour plane, then a w*h alpha plane).
# LVGL therefore reads colour straight through the alpha bytes and every pixel
# drifts by one byte. The cutout is instead matted onto pure black by
# tools/gen_doubao_avatar.py -- page_va's background is pinned to 0x000000, so
# the result is visually identical while using the plain RGB565 path.
# `byte_order: little_endian` is the CORRECT setting here, measured on real
# hardware 2026-08-29: with `big_endian` the avatar drew with the right shape but
# completely wrong colours (a pure per-pixel byte swap). The earlier claim that
# big_endian "matches LV_COLOR_16_SWAP=1" was wrong and has been removed -- do
# not reintroduce it. (The retired va_arc frames in va_arc_images.yaml still
# carry the old big_endian setting; those files are dead rollback material and
# are not compiled, so their byte_order is untrustworthy too.)
image:
  - platform: file
    id: img_doubao_avatar
    file: images/doubao_avatar.png
    type: RGB565
    byte_order: little_endian

lvgl:
  # 10% (~25 KB for 360x360 RGB565) was too tight; 25% left the largest free
  # internal block at only 7.5 KB, which is what `mic_task` and the I2S DMA
  # descriptors have to share. 20% is the compromise being trialled.
  # 12%, down from 20%: the pre-rendered VA ribbons made LVGL's own image
  # draw/cache allocations bite into internal RAM, dropping heap_max_block from
  # 31 KB back to 7.68 KB and starving mic_task again. This buffer is internal
  # DMA memory, so shrinking it is the most direct way to hand that back.
  buffer_size: 12%
  # Charging port down: LVGL owns the rotation because the display component
  # rejects `rotation` when LVGL is attached.
  rotation: 180
  update_when_display_idle: true
  # Every label sets `text_font` explicitly; this default only guards widgets
  # that have no text of their own.
  default_font: font_sc_16
  displays:
    - main_display
  touchscreens:
    - main_touchscreen
  pages:
    # P6 Midnight Orbit: a frameless center stage inside a 316 px / 270° instrument arc.
    - id: page_main
      bg_color: ${color_bg_canvas}
      widgets:
        - arc:
            id: arc_value
            align: CENTER
            width: 316
            height: 316
            arc_width: 8
            adjustable: false
            min_value: 0
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            arc_color: ${color_line_track}
            indicator:
              arc_color: ${color_local}
              arc_width: 8
