touchscreen:
  - platform: cst816
    id: main_touchscreen
    i2c_id: touchscreen_bus
    interrupt_pin: GPIO7
    reset_pin: GPIO8
    display: main_display
    # ESPHome 2026.7.x 的 CST816 驱动没有 on_gesture，也不会直接暴露
    # SWIPE_LEFT 等枚举。手势需通过坐标增量自行识别。
    # touch_timeout 会在最后一次触摸中断后继续轮询，确保抬手时触发
    # on_release；若不设置，部分 CST816 固件不会为抬手产生 IRQ，导致
    # dispatch_gesture 永远不执行。
    touch_timeout: 100ms
    on_touch:
      - lambda: |-
          id(g_touch_x0) = (int) touch.x;
          id(g_touch_y0) = (int) touch.y;
          id(g_touch_dx) = 0;
          id(g_touch_dy) = 0;
          id(g_touch_t0) = millis();
          id(g_touch_down) = true;   // [VA]
          id(g_wake_consume) = id(g_sleeping);
          id(g_last_activity) = millis();

          // TV progress mode owns a centered 1x4 remote row in screen coordinates.
          // The group center stays at (180,162), matching the former 2x2 matrix.
          // CST816 coordinates are unrotated while LVGL is rotated 180 degrees.
          id(g_remote_button) = 0;
          if (!id(g_sleeping) && id(g_target) == 0 && id(g_control_mode) == 0) {
            const int sx = 359 - (int) touch.x;
            const int sy = 359 - (int) touch.y;
            if (sx >= 59 && sx < 115 && sy >= 134 && sy < 190) id(g_remote_button) = 3;       // Up
            else if (sx >= 121 && sx < 177 && sy >= 134 && sy < 190) id(g_remote_button) = 1; // Confirm
            else if (sx >= 183 && sx < 239 && sy >= 134 && sy < 190) id(g_remote_button) = 2; // Return
            else if (sx >= 245 && sx < 301 && sy >= 134 && sy < 190) id(g_remote_button) = 4; // Down
          }
          if (id(g_remote_button) > 0) {
            lv_obj_t *buttons[] = {id(btn_remote_confirm), id(btn_remote_back), id(btn_remote_up), id(btn_remote_down)};
            lv_obj_t *icons[] = {id(icon_remote_confirm), id(icon_remote_back), id(icon_remote_up), id(icon_remote_down)};
            const int x[] = {121, 183, 59, 245};
            const int y[] = {134, 134, 134, 134};
            const int i = id(g_remote_button) - 1;
            lv_obj_set_pos(buttons[i], x[i] + 3, y[i] + 3);
            lv_obj_set_size(buttons[i], 50, 50);
            lv_obj_set_style_text_font(icons[i], id(font_icons_remote_24), LV_PART_MAIN);
            lv_obj_set_style_bg_color(buttons[i], lv_color_hex(0x16323F), LV_PART_MAIN);
          }

          // HomePod progress uses the same TV-style key geometry; volume stays numeric.
          id(g_homepod_button) = 0;
          if (!id(g_sleeping) && id(g_target) == 1 && id(g_control_mode) == 0) {
            const int sx = 359 - (int) touch.x;
            const int sy = 359 - (int) touch.y;
            if (sx >= 90 && sx < 146 && sy >= 134 && sy < 190) id(g_homepod_button) = 1;       // Previous
            else if (sx >= 152 && sx < 208 && sy >= 134 && sy < 190) id(g_homepod_button) = 2; // Play/pause
            else if (sx >= 214 && sx < 270 && sy >= 134 && sy < 190) id(g_homepod_button) = 3; // Next
          }
          if (id(g_homepod_button) > 0) {
            lv_obj_t *buttons[] = {id(btn_homepod_previous), id(btn_homepod_play_pause), id(btn_homepod_next)};
            lv_obj_t *icons[] = {id(icon_homepod_previous), id(icon_homepod_play_pause), id(icon_homepod_next)};
            const int x[] = {90, 152, 214};
            const int i = id(g_homepod_button) - 1;
            lv_obj_set_pos(buttons[i], x[i] + 3, 137);
            lv_obj_set_size(buttons[i], 50, 50);
            lv_obj_set_style_text_font(icons[i], id(font_icons_remote_24), LV_PART_MAIN);
            lv_obj_set_style_bg_color(buttons[i], lv_color_hex(0x16323F), LV_PART_MAIN);
          }
      - if:
          condition:
            lambda: 'return id(g_sleeping);'
          then:
            - script.execute: wake_display
      - script.execute: ptt_long_press  # [VA]
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(g_touch_dx) = (int) touches[0].x - id(g_touch_x0);
            id(g_touch_dy) = (int) touches[0].y - id(g_touch_y0);
          }
          id(g_last_activity) = millis();
    on_release:
      - lambda: |-
          id(g_touch_down) = false; // [VA]
          if (id(g_ptt_started)) {  // [VA]
            // A PTT hold that started on the lock screen leaves `g_wake_consume`
            // armed; clear it here because this release never reaches the
            // gesture path that normally consumes it, and a stale flag would
            // swallow the user's next tap/swipe.
            id(g_wake_consume) = false;
            // Push-to-talk feel without stopping the stream: the screen flips to
            // `thinking` the instant the finger comes up, but the audio keeps
            // flowing so HA's microVAD can see the silence and close the turn
            // itself. Calling `voice_assistant.stop` here would abort the
            // pipeline and throw the recording away.
            if (id(g_va_phase) == 1) id(g_va_phase) = 2; // thinking
            id(va_render).execute();
            id(va_ptt_release_feedback).execute();
            return; // [VA]
          }
          // The panel is rotated 180 deg in hardware, but the touch controller
          // still reports raw unrotated coordinates, so both axes must be
          // negated for swipe direction to match what the user sees.
          const int dx = -id(g_touch_dx);
          const int dy = -id(g_touch_dy);
          const uint32_t held = millis() - id(g_touch_t0);
          int gesture = -1;
          if (abs(dx) > 50 && abs(dx) > abs(dy)) gesture = dx < 0 ? 2 : 3;
          else if (abs(dy) > 50 && abs(dy) > abs(dx)) gesture = dy < 0 ? 4 : 5;
          // Anything below the 50 px swipe threshold is a tap/hold. Using 16 px
          // here created a 16..50 px dead zone where taps (including TV mute) vanished.
          else if (abs(dx) <= 50 && abs(dy) <= 50) gesture = held >= 600 ? 1 : 0;
          if (id(g_wake_consume)) {
            gesture = -1;
            id(g_wake_consume) = false;
          }
          if (id(g_remote_button) > 0) {
            lv_obj_t *buttons[] = {id(btn_remote_confirm), id(btn_remote_back), id(btn_remote_up), id(btn_remote_down)};
            lv_obj_t *icons[] = {id(icon_remote_confirm), id(icon_remote_back), id(icon_remote_up), id(icon_remote_down)};
            const int x[] = {121, 183, 59, 245};
            const int y[] = {134, 134, 134, 134};
            const int i = id(g_remote_button) - 1;
            lv_obj_set_pos(buttons[i], x[i], y[i]);
            lv_obj_set_size(buttons[i], 56, 56);
            lv_obj_set_style_text_font(icons[i], id(font_icons_remote_28), LV_PART_MAIN);
            lv_obj_set_style_bg_color(buttons[i], lv_color_hex(0x09131B), LV_PART_MAIN);
            // A remote key claims any release inside the normal 50 px touch slop.
            // This removes the old 16..50 px dead zone while preserving real swipes.
            if (abs(dx) <= 50 && abs(dy) <= 50) gesture = 10 + id(g_remote_button);
            id(g_remote_button) = 0;
          }
          if (id(g_homepod_button) > 0) {
            lv_obj_t *buttons[] = {id(btn_homepod_previous), id(btn_homepod_play_pause), id(btn_homepod_next)};
            lv_obj_t *icons[] = {id(icon_homepod_previous), id(icon_homepod_play_pause), id(icon_homepod_next)};
            const int x[] = {90, 152, 214};
            const int i = id(g_homepod_button) - 1;
            lv_obj_set_pos(buttons[i], x[i], 134);
            lv_obj_set_size(buttons[i], 56, 56);
            lv_obj_set_style_text_font(icons[i], id(font_icons_remote_28), LV_PART_MAIN);
            lv_obj_set_style_bg_color(buttons[i], lv_color_hex(0x09131B), LV_PART_MAIN);
            if (abs(dx) <= 50 && abs(dy) <= 50) gesture = 14 + id(g_homepod_button);
            id(g_homepod_button) = 0;
          }
          id(g_gesture) = gesture;
          id(g_last_activity) = millis();
      - if: # [VA]
          condition: { lambda: 'return !id(g_ptt_started);' }
          then:
            - script.execute: dispatch_gesture

# Home Assistant time drives the sleep clock and Chinese date/weekday text.
time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: render_aod

# State subscriptions used by the P2 local priority resolver.
text_sensor:
  - platform: homeassistant
    id: tv_state
    entity_id: ${tv_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: homepod_state
    entity_id: ${homepod_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: ceiling_light_state
    entity_id: ${ceiling_light_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  # Wall relay feeding the ceiling lamp. Tracked so tap knows whether it must
  # power the lamp up before talking to the light entity.
  - platform: homeassistant
    id: ceiling_power_state
    entity_id: ${ceiling_power_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: strip_light_state
    entity_id: ${strip_light_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: strip_light_hs_color
    entity_id: ${strip_light_entity}
    attribute: hs_color
    internal: true
    on_value:
      - lambda: |-
          // HA serialises the hs_color attribute as a Python tuple, e.g. "(240.0, 100.0)",
          // but older builds also emitted "[240.0, 100.0]". Skip whatever bracket style
          // arrives and parse the first number, otherwise hue stays NaN forever and the
          // knob always restarts from 0.
          const char *p = x.c_str();
          while (*p != '\0' && !(*p == '-' || *p == '.' || (*p >= '0' && *p <= '9'))) p++;
          float hue = 0.0f;
          if (*p != '\0' && sscanf(p, "%f", &hue) == 1) id(strip_light_hue).publish_state(hue);
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: climate_state
    entity_id: ${living_room_climate_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: dining_room_climate_state
    entity_id: ${dining_room_climate_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: floor_heating_state
    entity_id: ${floor_heating_entity}
    internal: true
    on_value:
      - script.execute: sync_from_ha

  - platform: homeassistant
    id: holiday_calendar_state
    entity_id: ${holiday_calendar_entity}
    internal: true
    on_value:
      - script.execute: render_aod

  - platform: homeassistant
