        - line: { id: tick_6, align: CENTER, x: -136, y: -36, points: [[10, 3], [0, 0]], line_width: 2, line_rounded: true, line_color: 0x263945, line_opa: 85%, clickable: false }
        - line: { id: tick_7, align: CENTER, x: -128, y: -60, points: [[9, 4], [0, 0]], line_width: 2, line_rounded: true, line_color: 0x263945, line_opa: 85%, clickable: false }
