touchscreen:
  - platform: cst816
    id: main_touchscreen
    i2c_id: touchscreen_bus
    interrupt_pin: GPIO7
    reset_pin: GPIO8
    display: main_display
    # ESPHome 2026.7.x 的 CST816 驱动没有 on_gesture，也不会直接暴露
    # SWIPE_LEFT 等枚举。手势需通过坐标增量自行识别。
    # touch_timeout 会在最后一次触摸中断后继续轮询，确保抬手时触发
    # on_release；若不设置，部分 CST816 固件不会为抬手产生 IRQ，导致
    # dispatch_gesture 永远不执行。
    touch_timeout: 100ms
    on_touch:
      - lambda: |-
          id(g_touch_x0) = (int) touch.x;
          id(g_touch_y0) = (int) touch.y;
          id(g_touch_dx) = 0;
          id(g_touch_dy) = 0;
          id(g_touch_t0) = millis();
          id(g_wake_consume) = id(g_sleeping);
          id(g_last_activity) = millis();

          // TV progress mode owns a centered 1x4 remote row in screen coordinates.
          // The group center stays at (180,162), matching the former 2x2 matrix.
          // CST816 coordinates are unrotated while LVGL is rotated 180 degrees.
          id(g_remote_button) = 0;
          if (!id(g_sleeping) && id(g_target) == 0 && id(g_control_mode) == 0) {
            const int sx = 359 - (int) touch.x;
            const int sy = 359 - (int) touch.y;
            if (sx >= 59 && sx < 115 && sy >= 134 && sy < 190) id(g_remote_button) = 3;       // Up
            else if (sx >= 121 && sx < 177 && sy >= 134 && sy < 190) id(g_remote_button) = 1; // Confirm
            else if (sx >= 183 && sx < 239 && sy >= 134 && sy < 190) id(g_remote_button) = 2; // Return
            else if (sx >= 245 && sx < 301 && sy >= 134 && sy < 190) id(g_remote_button) = 4; // Down
          }
          if (id(g_remote_button) > 0) {
            lv_obj_t *buttons[] = {id(btn_remote_confirm), id(btn_remote_back), id(btn_remote_up), id(btn_remote_down)};
            lv_obj_t *icons[] = {id(icon_remote_confirm), id(icon_remote_back), id(icon_remote_up), id(icon_remote_down)};
            const int x[] = {121, 183, 59, 245};
            const int y[] = {134, 134, 134, 134};
            const int i = id(g_remote_button) - 1;
            lv_obj_set_pos(buttons[i], x[i] + 3, y[i] + 3);
            lv_obj_set_size(buttons[i], 50, 50);
            lv_obj_set_style_text_font(icons[i], id(font_icons_remote_24), LV_PART_MAIN);
            lv_obj_set_style_bg_color(buttons[i], lv_color_hex(0x16323F), LV_PART_MAIN);
          }
      - if:
          condition:
            lambda: 'return id(g_sleeping);'
          then:
            - script.execute: wake_display
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(g_touch_dx) = (int) touches[0].x - id(g_touch_x0);
            id(g_touch_dy) = (int) touches[0].y - id(g_touch_y0);
          }
          id(g_last_activity) = millis();
    on_release:
      - lambda: |-
          // The panel is rotated 180 deg in hardware, but the touch controller
          // still reports raw unrotated coordinates, so both axes must be
          // negated for swipe direction to match what the user sees.
          const int dx = -id(g_touch_dx);
          const int dy = -id(g_touch_dy);
          const uint32_t held = millis() - id(g_touch_t0);
          int gesture = -1;
          if (abs(dx) > 50 && abs(dx) > abs(dy)) gesture = dx < 0 ? 2 : 3;
          else if (abs(dy) > 50 && abs(dy) > abs(dx)) gesture = dy < 0 ? 4 : 5;
          // Anything below the 50 px swipe threshold is a tap/hold. Using 16 px
          // here created a 16..50 px dead zone where taps (including TV mute) vanished.
          else if (abs(dx) <= 50 && abs(dy) <= 50) gesture = held >= 600 ? 1 : 0;
          if (id(g_wake_consume)) {
            gesture = -1;
            id(g_wake_consume) = false;
          }
          if (id(g_remote_button) > 0) {
            lv_obj_t *buttons[] = {id(btn_remote_confirm), id(btn_remote_back), id(btn_remote_up), id(btn_remote_down)};
            lv_obj_t *icons[] = {id(icon_remote_confirm), id(icon_remote_back), id(icon_remote_up), id(icon_remote_down)};
            const int x[] = {121, 183, 59, 245};
            const int y[] = {134, 134, 134, 134};
            const int i = id(g_remote_button) - 1;
            lv_obj_set_pos(buttons[i], x[i], y[i]);
            lv_obj_set_size(buttons[i], 56, 56);
            lv_obj_set_style_text_font(icons[i], id(font_icons_remote_28), LV_PART_MAIN);
            lv_obj_set_style_bg_color(buttons[i], lv_color_hex(0x09131B), LV_PART_MAIN);
            // A remote key claims any release inside the normal 50 px touch slop.
            // This removes the old 16..50 px dead zone while preserving real swipes.
            if (abs(dx) <= 50 && abs(dy) <= 50) gesture = 10 + id(g_remote_button);
            id(g_remote_button) = 0;
          }
          id(g_gesture) = gesture;
          id(g_last_activity) = millis();
      - script.execute: dispatch_gesture

