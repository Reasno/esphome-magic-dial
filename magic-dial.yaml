substitutions:
  device_name: magic-dial
  friendly_name: "Magic Dial"
  timezone: "Asia/Shanghai"

  # Magic Dial P6 / Midnight Orbit color tokens.
  color_bg_canvas: "0x03070A"
  color_bg_aod: "0x010304"
  color_bg_surface: "0x09131B"
  color_line_track: "0x14222C"
  color_line_tick: "0x263945"
  color_text_primary: "0xF2F6F8"
  color_text_secondary: "0xA5B4BD"
  color_text_tertiary: "0x617681"
  color_offline: "0xE66472"
  color_media: "0x49A8FF"
  color_light: "0xFFC05A"
  color_local: "0x45D6C5"
  color_va_listening: "0xCAE4FF"  # [VA] Doubao icon light blue -- one accent for all phases
  color_va_thinking: "0xCAE4FF"   # [VA]
  color_va_error: "0xFF6B6B"      # [VA] kept distinct: a failure must not read as a normal phase

  # Home Assistant entities. Change only these substitutions if entity IDs differ.
  tv_entity: media_player.sony_k_55xr50
  tv_remote_entity: remote.sony_k_55xr50
  homepod_entity: media_player.ke_ting_ke_ting
  ceiling_light_entity: light.opple_cn_246509731_bydceiling_s_2_light
  # The ceiling lamp is fed through a wall relay. With the relay off the lamp has
  # no power at all, so a bare `light.toggle` silently does nothing. Tap on the
  # ceiling target therefore switches the relay first (see `on_tap`).
  ceiling_power_entity: switch.lumi_cn_lumi_4cf8cdf3c7cea70_l3acn3_on_p_4_1
  strip_light_entity: light.yeelink_cn_48303523_strip1_s_2_light
  dining_room_climate_entity: climate.24dfa79bdf8f
  living_room_climate_entity: climate.24dfa7d09617
  floor_heating_entity: climate.suittc_cn_929054575_m302

  # Local BLE presence threshold. Presence is debounced below: 10 s to enter,
  # 2 min to leave, matching the existing HA template sensors.
  bracelet_presence_rssi: "-95"

  # [VA] Proactive ask. `satellite_entity` is this device's assist_satellite
  # entity in HA; `assist_satellite.start_conversation` is what makes the dial
  # speak first and then listen. Adjust if the entity id differs.
  satellite_entity: assist_satellite.ke_ting_magic_dial_assist_satellite
  # Seconds the dial keeps listening after a proactive question before it gives
  # up and returns to the previous screen.
  proactive_listen_seconds: "10"

  # Point this at a calendar that aggregates every holiday you want to display.
  # The current event's `message` attribute is shown verbatim; an inactive calendar
  # leaves the holiday line blank. This is intentionally not limited to Chinese holidays.
  holiday_calendar_entity: calendar.zhong_guo

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  # Hand-rolled PNG encoder for the Ulanzi knob bar. See publish_knob_bar.
  includes:
    - ulanzi_bar.h
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - light.turn_on:
          id: backlight_light
          brightness: 100%
      - lambda: |-
          id(g_last_activity) = millis();
          id(g_backlight_pct) = 100;
      # Keep the speaker's software gain in sync with the number the 本机扬声器
      # target shows from the very first frame, so the first VA turn after a
      # reboot is already at the displayed volume.
      - script.execute: apply_local_volume
      - script.execute: resolve_priority
      - lvgl.page.show:
          id: page_main
          animation: fade_in
          time: 250ms

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB          # 16 MB flash (JC3636K718C)
  partitions: partitions.csv  # MAX app partitions (~7.94 MB/slot). Requires USB flashing!
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # PSRAM into the general malloc heap. Without this only heap_caps_malloc
      # with MALLOC_CAP_SPIRAM reaches PSRAM, so every plain new/malloc drains
      # the ~21 KB of internal RAM that xTaskCreate("mic_task") also needs, and
      # the mic task fails to start on the first PTT press.
      CONFIG_SPIRAM_USE_MALLOC: "y"
      # Allocations at or below this size stay internal (the 16384 default is
      # too greedy here); everything larger is pushed out to PSRAM.
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      # Hard-reserve internal RAM that PSRAM can never satisfy: I2S in/out DMA
      # descriptors and task stacks.
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  initial_level: INFO

# Internal / DMA RAM is the scarce resource on this build (display + LVGL +
# BLE proxy + MQTT + I2S in/out all compete for it). `mic_task` creation has
# already failed once because of exhaustion, so expose the heap counters and
# quantify the headroom instead of guessing.
debug:
  update_interval: 10s

api:
  encryption:
    key: !secret magic_dial_api_key
  actions:
    # [VA] Proactive ask: HA (or any automation) hands the dial a question, the
    # dial wakes, shows the asking screen, speaks the question through the
    # Assist pipeline and then keeps listening for `listen_seconds`.
    - action: proactive_ask
      variables:
        question: string
        listen_seconds: int
      then:
        - script.execute:
            id: proactive_ask_start
            question: !lambda 'return question;'
            listen_seconds: !lambda 'return listen_seconds > 0 ? listen_seconds : ${proactive_listen_seconds};'
    - action: proactive_cancel
      then:
        - script.execute: proactive_abort

ota:
  - platform: esphome
    password: !secret magic_dial_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.31.33
    gateway: 192.168.31.1
    subnet: 255.255.255.0
    dns1: 192.168.31.1
  ap:
    ssid: "Magic Dial Setup"

captive_portal:

# BLE scanning runs alongside Wi-Fi on the ESP32-S3. Active scanning lets the
# Home Assistant Bluetooth proxy request scan responses from nearby devices.
esp32_ble_tracker:

bluetooth_proxy:
  active: true

# MQTT is used for exactly one thing: driving the Ulanzi pixel clock's knob bar.
# The dial publishes a ready-made AWTRIX payload straight to
# `ulanzi_aa68/custom/test` on the shared EMQX broker - no Home Assistant round
# trip, so there is no per-frame `shell_command` (~140 ms) in the path and the bar
# tracks the knob smoothly. Everything else keeps using the native API, so all of
# ESPHome's own MQTT plumbing is turned off:
#   discovery / discover_ip: false - HA already owns these entities via the native
#                       API; leaving them on would create a duplicate device.
#   topic_prefix: null - suppresses the per-entity state/command topics. Requires
#                       log_topic / birth_message / will_message to be empty too.
#   reboot_timeout: 0s - never reboot just because EMQX is unreachable. The dial
#                       must stay usable without the broker.
mqtt:
  id: mqtt_client
  broker: 192.168.31.111
  port: 1883
  discovery: false
  discover_ip: false
  topic_prefix: null
  log_topic: null
  birth_message:
  will_message:
  reboot_timeout: 0s

# The physical knob is not a quadrature encoder. Each direction has its own
# active-low pulse input: left on GPIO2 and right on GPIO1.
binary_sensor:
  - platform: homeassistant
    id: tv_muted
    entity_id: ${tv_entity}
    attribute: is_volume_muted
    internal: true
    on_state:
      - script.execute: render_main

  - platform: homeassistant
    id: homepod_muted
    entity_id: ${homepod_entity}
    attribute: is_volume_muted
    internal: true

  - platform: template
    id: gu_xi_in_living_room_local
    internal: true
    lambda: |-
      return !isnan(id(gu_xi_mi_band_rssi).state) &&
        id(gu_xi_mi_band_rssi).state >= atof("${bracelet_presence_rssi}");
    filters:
      - delayed_on: 10s
      - delayed_off: 2min
    on_state:
      - script.execute: apply_screen_brightness

  - platform: template
    id: liu_xin_yi_in_living_room_local
    internal: true
    lambda: |-
      return !isnan(id(liu_xin_yi_mi_band_rssi).state) &&
        id(liu_xin_yi_mi_band_rssi).state >= atof("${bracelet_presence_rssi}");
    filters:
      - delayed_on: 10s
      - delayed_off: 2min
    on_state:
      - script.execute: apply_screen_brightness

  - platform: gpio
    name: "Knob Left"
    id: knob_left
    pin:
      number: GPIO2
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
    on_press:
      - lambda: |-
          const uint32_t now = millis();
          // The first knob pulse in AOD is consumed: wake only, never mutate state.
          if (id(g_sleeping)) {
            id(g_last_activity) = now;
            id(wake_display).execute();
            return;
          }
          const uint32_t elapsed = id(g_knob_last_pulse_ms) == 0 ? UINT32_MAX : now - id(g_knob_last_pulse_ms);
          if (id(g_knob_last_direction) == 1 && elapsed < 20) return;
          // Continuous acceleration curve: step % = (250 / elapsed) ^ 1.86,
          // clamped to 1..20. This replaces the old 4-rung ladder
          // (1 / 3 / 8 / 20 % at 250 / 120 / 50 ms) which jumped step size at
          // every threshold and made a steady turn feel like it changed gear.
          // The envelope is deliberately the same - 250 ms -> 1 %, ~80 ms -> 8 %,
          // 50 ms and faster -> 20 % - but the rungs in between are filled in, so
          // sensitivity ramps instead of stepping. Measured ladder, ms -> %:
          //   250->1  200->2  160->2  140->3  120->4  100->5
          //   80->8   70->11  60->14  55->17  50->20
          // The lower clamp on `e` keeps powf() away from the sub-debounce range,
          // and UINT32_MAX on the first pulse folds to 1 %.
          const float e = (float) (elapsed > 250 ? 250 : (elapsed < 20 ? 20 : elapsed));
          id(g_knob_speed_pct) = (int) fminf(20.0f, fmaxf(1.0f, roundf(powf(250.0f / e, 1.86f))));
          id(g_knob_last_pulse_ms) = now;
          id(g_knob_last_direction) = -1;
          auto active = [&](int target) -> bool {
            if (target == 0) { const auto s=id(tv_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 1) { const auto s=id(homepod_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 2) return id(ceiling_light_state).state=="on";
            if (target == 3) return id(strip_light_state).state=="on";
            if (target == 4) { const auto s=id(climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
            if (target == 5) { const auto s=id(dining_room_climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
            if (target == 6) { const auto s=id(floor_heating_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
            return true;
          };
          // 本机 mode 3 (电量) is a read-only readout: the knob does nothing there.
          if (id(g_target) == 7 && id(g_control_mode) == 3) return;
          if (!active(id(g_target))) return;
          id(handle_knob).execute(-1);

  - platform: gpio
    name: "Knob Right"
    id: knob_right
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
    on_press:
      - lambda: |-
          const uint32_t now = millis();
          // The first knob pulse in AOD is consumed: wake only, never mutate state.
          if (id(g_sleeping)) {
            id(g_last_activity) = now;
            id(wake_display).execute();
            return;
          }
          const uint32_t elapsed = id(g_knob_last_pulse_ms) == 0 ? UINT32_MAX : now - id(g_knob_last_pulse_ms);
          if (id(g_knob_last_direction) == -1 && elapsed < 20) return;
          // Continuous acceleration curve: step % = (250 / elapsed) ^ 1.86,
          // clamped to 1..20. This replaces the old 4-rung ladder
          // (1 / 3 / 8 / 20 % at 250 / 120 / 50 ms) which jumped step size at
          // every threshold and made a steady turn feel like it changed gear.
          // The envelope is deliberately the same - 250 ms -> 1 %, ~80 ms -> 8 %,
          // 50 ms and faster -> 20 % - but the rungs in between are filled in, so
          // sensitivity ramps instead of stepping. Measured ladder, ms -> %:
          //   250->1  200->2  160->2  140->3  120->4  100->5
          //   80->8   70->11  60->14  55->17  50->20
          // The lower clamp on `e` keeps powf() away from the sub-debounce range,
          // and UINT32_MAX on the first pulse folds to 1 %.
          const float e = (float) (elapsed > 250 ? 250 : (elapsed < 20 ? 20 : elapsed));
          id(g_knob_speed_pct) = (int) fminf(20.0f, fmaxf(1.0f, roundf(powf(250.0f / e, 1.86f))));
          id(g_knob_last_pulse_ms) = now;
          id(g_knob_last_direction) = 1;
          auto active = [&](int target) -> bool {
            if (target == 0) { const auto s=id(tv_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 1) { const auto s=id(homepod_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 2) return id(ceiling_light_state).state=="on";
            if (target == 3) return id(strip_light_state).state=="on";
            if (target == 4) { const auto s=id(climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
            if (target == 5) { const auto s=id(dining_room_climate_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
            if (target == 6) { const auto s=id(floor_heating_state).state; return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable"; }
            return true;
          };
          // 本机 mode 3 (电量) is a read-only readout: the knob does nothing there.
          if (id(g_target) == 7 && id(g_control_mode) == 3) return;
          if (!active(id(g_target))) return;
          id(handle_knob).execute(1);

# PCM5100A enable: HIGH means unmuted.
switch:
  - platform: gpio
    name: "DAC Unmute"
    id: dac_unmute
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON

# Separate I2S buses are used for PCM5100A output and the PDM microphone.
i2s_audio:
  - id: i2s_out
    i2s_bclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true

  - id: i2s_in
    i2s_lrclk_pin: GPIO5

speaker:
  - platform: i2s_audio
    id: magic_dial_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO42
    dac_type: external
    channel: stereo

microphone:
  - platform: i2s_audio
    id: magic_dial_microphone
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO4
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit

voice_assistant:  # [VA]
  id: magic_dial_va
  microphone: magic_dial_microphone
  speaker: magic_dial_speaker
  use_wake_word: false
  # [VA] Capture gain. The PDM mic on this board is very quiet, and with the
  # ESPHome defaults (no gain, multiplier 1.0) the stream is too weak for the
  # pipeline VAD to ever mark speech, so the turn dies as
  # `stt-no-text-recognized`. These are the values the reference Guition VA
  # project runs with.
  # [VA] 2026-08-29: the turn now closes correctly (HA microVAD collects and
  # ends it), so the 45000081 stt timeout is gone -- but every turn still dies
  # as `stt-no-text-recognized`, i.e. the stream reaching STT is too weak to
  # transcribe. Reference-project values (multiplier 2.0) are not enough for
  # this unit's PDM mic, so lift the digital gain. `noise_suppression_level` is
  # dropped from 2 to 1 as well: on a signal this quiet the suppressor was
  # eating the speech together with the noise floor.
  # [VA] 2026-08-29 second pass: 6.0 overshot. With `auto_gain: 31dBFS` already
  # running AGC, a 6x pre-multiply just hard-clips int16 on louder syllables --
  # VAD still fires (plenty of energy) but STT gets distortion and returns "".
  # The real cause of the flaky turns was main-loop stall (see va_render), so
  # back the multiplier off to a sane 3.0 and let AGC do the levelling.
  noise_suppression_level: 1
  auto_gain: 31dBFS
  volume_multiplier: 3.0
  # A pipeline can also be started from HA (assist_satellite.start_conversation
  # for a proactive question). In that case nothing ran va_prepare, so the
  # session state / VA page are set up here instead.
  on_start:
    - if:
        condition: { lambda: 'return !id(g_va_active);' }
        then:
          - script.execute: va_enter_session
  on_listening:
    - lambda: |-
        id(g_va_active) = true;
        id(g_va_phase) = 1; // listening
        id(g_va_error_text) = "";
        id(g_va_started_ms) = millis();
        id(va_render).execute();
    - script.execute: ring_update_state
  # [VA] VAD edges do not change the phase -- the screen already says
  # "listening..." and flipping it on every speech edge would flicker. They are
  # logged only, which is enough to debug why a turn did or did not close.
  on_stt_vad_start:
    - logger.log:
        level: INFO
        format: "[VA] stt vad start (speech detected)"
  on_stt_vad_end:
    - logger.log:
        level: INFO
        format: "[VA] stt vad end (turn closing)"
  on_stt_end:
    - lambda: |-
        // The transcript goes to the log, NOT to the screen: the embedded
        // Chinese font only carries the ~200 hanzi of the UI itself, so an
        // arbitrary transcript would draw as empty boxes.
        ESP_LOGI("va", "STT text: %s", x.c_str());
        id(g_va_stt_seen) = true;
        id(g_va_phase) = 2; // thinking
        id(va_render).execute();
        id(dac_unmute).turn_off(); // Mute thinking
    - script.execute: ring_update_state
  on_tts_start:
    - lambda: |-
        ESP_LOGI("va", "TTS text: %s", x.c_str());
        id(g_va_tts_started) = true;
  # [VA] Audio playback end. The actual teardown hangs off on_tts_stream_end
  # (the stream, not the text), so this is log-only on purpose.
  on_tts_end:
    - logger.log:
        level: INFO
        format: "[VA] tts finished"
  on_tts_stream_start:
    - lambda: |-
        id(g_va_phase) = 3; // speaking
        id(va_render).execute();
        id(dac_unmute).turn_on();
    - script.execute: va_duck_external_media
    - script.execute: ring_update_state
  on_tts_stream_end:
    - script.execute: va_cleanup
  on_end:
    - if:
        condition: { lambda: 'return !id(g_va_tts_started);' }
        then:
          - script.execute: va_cleanup
  on_error:
    # `code` is short and ASCII (e.g. stt-no-text-recognized), so it is safe to
    # put on screen; the human-readable `message` may be Chinese and is logged.
    - lambda: |-
        ESP_LOGE("va", "error code=%s message=%s", code.c_str(), message.c_str());
        std::string reason = code;
        if (reason.size() > 24) reason.resize(24);
        id(g_va_error_text) = reason.empty() ? std::string("error")
                                             : std::string("error: ") + reason;
    - script.execute: va_fail

# ST77916 QSPI display bus.
spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO11
  data_pins: [GPIO13, GPIO14, GPIO15, GPIO16]

# CST816 touch controller bus.
i2c:
  id: touchscreen_bus
  sda: GPIO9
  scl: GPIO10

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_output

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight_light
    output: backlight_output
    restore_mode: ALWAYS_ON
    # Every brightness change ramps instead of stepping, so wake / sleep / manual
    # brightness edits all fade smoothly.
    default_transition_length: 400ms

  # 13-pixel WS2812 ring. RMT DMA keeps LED timing stable while LVGL/QSPI is busy.
  - platform: esp32_rmt_led_strip
    id: ring_light
    name: "${friendly_name} Ring"
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 13
    rgb_order: GRB
    chipset: WS2812
    rmt_symbols: 128
    use_dma: true
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - addressable_lambda:
          name: "Ring State"
          update_interval: 40ms
          lambda: |-
            const int n = it.size();
            if (id(g_va_active)) {  // [VA]
              const int phase = id(g_va_phase);
              if (id(g_va_release_flash)) {
                it.all() = Color(255, 255, 255);
                return;
              }
              if (phase == 1) { // Listening: Green breathing
                const float pulse = 0.6f + 0.4f * sinf(millis() * 0.01f);
                it.all() = Color(0x35D07F) * pulse;
              } else if (phase == 2) { // Thinking: White head + purple/blue trail
                const float elapsed = (float)millis();
                float head = fmodf(elapsed / 1000.0f * n, (float)n);
                for (int i = 0; i < n; i++) {
                  float d = head - i;
                  while (d < 0) d += n;
                  while (d >= n) d -= n;
                  if (d < 1.0f) it[i] = Color(255, 255, 255);
                  else if (d < 6.0f) {
                    float t = (d - 1.0f) / 5.0f;
                    it[i] = Color((uint8_t)(0x8B + (0x49 - 0x8B) * t),
                                  (uint8_t)(0x7C + (0xA8 - 0x7C) * t),
                                  (uint8_t)(0xFF + (0xFF - 0xFF) * t));
                  } else it[i] = Color(0, 0, 0);
                }
              } else if (phase == 3) { // Speaking: Blue mirrored waveform
                const float elapsed = (float)millis();
                for (int i = 0; i < n; i++) {
                  int dist = abs(i - 6);
                  float wave = 0.5f + 0.5f * sinf(elapsed * 0.02f - dist * 0.8f);
                  it[i] = Color(0x49A8FF) * wave;
                }
              } else if (phase == 4) { // Error: Coral red slow double flash
                const float t = fmodf(millis(), 2000.0f);
                float pulse = 0.0f;
                if (t < 200.0f) pulse = t / 200.0f;
                else if (t < 400.0f) pulse = 1.0f - (t - 200.0f) / 200.0f;
                else if (t < 600.0f) pulse = (t - 400.0f) / 200.0f;
                else if (t < 800.0f) pulse = 1.0f - (t - 600.0f) / 200.0f;
                it.all() = Color(0xFF6B6B) * pulse;
              }
              return;
            }
            if (id(g_sleeping)) {
              it.all() = Color(0, 0, 0);
              return;
            }
            float level = id(g_ring_brightness);
            if (id(g_target) == 0 || id(g_target) == 1) {
              // Slow 3-second breath, from 30% to 60% of the target color.
              const float phase = (millis() % 3000) / 3000.0f * 6.2831853f;
              level = 0.45f - 0.15f * cosf(phase);
            }
            const uint8_t r = (uint8_t) roundf(id(g_ring_r) * level);
            const uint8_t g = (uint8_t) roundf(id(g_ring_g) * level);
            const uint8_t b = (uint8_t) roundf(id(g_ring_b) * level);
            it.all() = Color(r, g, b);

      - addressable_lambda:
          name: "Ring Feedback"
          update_interval: 20ms
          lambda: |-
            const int n = it.size();
            const int kind = id(g_ring_feedback);
            if (kind == 1) {
              // One directional comet lap in 300 ms; direction follows the knob.
              const float elapsed = (float) (millis() - id(g_ring_feedback_started_ms));
              float head = fmodf(elapsed / 300.0f * n, (float) n);
              if (id(g_ring_direction) < 0) head = fmodf(n - head, (float) n);
              for (int i = 0; i < n; i++) {
                float d = id(g_ring_direction) > 0 ? head - i : i - head;
                while (d < 0) d += n;
                while (d >= n) d -= n;
                float tail = d < 4.0f ? 1.0f - d / 4.0f : 0.0f;
                tail *= tail;
                it[i] = Color(
                  (uint8_t) roundf(id(g_ring_r) * tail),
                  (uint8_t) roundf(id(g_ring_g) * tail),
                  (uint8_t) roundf(id(g_ring_b) * tail));
              }
            } else if (kind == 2) {
              it.all() = Color(255, 255, 255);  // device switch
            } else if (kind == 3) {
              it.all() = Color(id(g_ring_r), id(g_ring_g), id(g_ring_b));  // mode switch
            } else if (kind == 4) {
              it.all() = Color(255, 0, 0);      // tap acknowledgement
            } else {
              it.all() = Color(0, 0, 0);
            }

