  # ~1.3 kB of ready-to-send AWTRIX payload, built by ulanzi_bar.h.
  - id: g_knob_pub_payload
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  # Backlight arbitration stays fully local. Presence only raises AOD brightness;
  # it never wakes the display or changes pages.
  - id: apply_screen_brightness
    mode: restart
    then:
      - light.turn_on:
          id: backlight_light
          brightness: !lambda |-
            const bool bracelet_present = id(gu_xi_in_living_room_local).state ||
              id(liu_xin_yi_in_living_room_local).state;
            const float pct = (!id(g_sleeping) || bracelet_present)
              ? (float) id(g_backlight_pct)
              : (float) id(g_aod_backlight_pct);
            return fminf(1.0f, fmaxf(0.05f, pct / 100.0f));

  - id: ring_update_state
    mode: restart
    then:
      - lambda: |-
          if (id(g_sleeping)) {
            id(ring_light)->turn_off().perform();
            return;
          }
          if (id(g_ring_feedback) != 0) return;

          if (id(g_target) == 0) {
            id(g_ring_r) = 0x1E; id(g_ring_g) = 0x90; id(g_ring_b) = 0xFF;
            id(g_ring_brightness) = 0.45f;
          } else if (id(g_target) == 1) {
            id(g_ring_r) = 0x9B; id(g_ring_g) = 0x59; id(g_ring_b) = 0xB6;
            id(g_ring_brightness) = 0.45f;
          } else if (id(g_target) == 2) {
            const bool optimistic = id(g_optimistic_valid) && id(g_optimistic_target) == 2 &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            float kelvin = optimistic && id(g_optimistic_mode) == 1 ? id(g_optimistic_value) :
              (isnan(id(ceiling_light_color_temp).state) ? 4000.0f : id(ceiling_light_color_temp).state);
            if (kelvin < 2000.0f) kelvin = 2000.0f;
            if (kelvin > 6500.0f) kelvin = 6500.0f;
            const float t = (kelvin - 2000.0f) / 4500.0f;
            // Interpolate from warm white to cool white.
            id(g_ring_r) = (int) roundf(255.0f + (221.0f - 255.0f) * t);
            id(g_ring_g) = (int) roundf(210.0f + (235.0f - 210.0f) * t);
            id(g_ring_b) = (int) roundf(161.0f + (255.0f - 161.0f) * t);
            const float raw = optimistic && id(g_optimistic_mode) == 0 ? id(g_optimistic_value) * 2.55f :
              (isnan(id(ceiling_light_brightness).state) ? 0.0f : id(ceiling_light_brightness).state);
            id(g_ring_brightness) = raw / 255.0f;
          } else if (id(g_target) == 3) {
            const bool optimistic = id(g_optimistic_valid) && id(g_optimistic_target) == 3 &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            float hue = optimistic && id(g_optimistic_mode) == 1 ? id(g_optimistic_value) :
              (isnan(id(strip_light_hue).state) ? 0.0f : id(strip_light_hue).state);
            hue = fmodf(hue, 360.0f); if (hue < 0.0f) hue += 360.0f;
            const float c = 1.0f;
            const float x = c * (1.0f - fabsf(fmodf(hue / 60.0f, 2.0f) - 1.0f));
            float r = 0, g = 0, b = 0;
            if (hue < 60) { r = c; g = x; }
            else if (hue < 120) { r = x; g = c; }
            else if (hue < 180) { g = c; b = x; }
            else if (hue < 240) { g = x; b = c; }
            else if (hue < 300) { r = x; b = c; }
            else { r = c; b = x; }
            id(g_ring_r) = (int) roundf(r * 255.0f);
            id(g_ring_g) = (int) roundf(g * 255.0f);
            id(g_ring_b) = (int) roundf(b * 255.0f);
            const float raw = optimistic && id(g_optimistic_mode) == 0 ? id(g_optimistic_value) * 2.55f :
              (isnan(id(strip_light_brightness).state) ? 0.0f : id(strip_light_brightness).state);
            id(g_ring_brightness) = raw / 255.0f;
          } else if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6) {
            const std::string mode = id(g_target) == 4 ? id(climate_state).state :
              (id(g_target) == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
            if (mode == "heat") {
              id(g_ring_r) = 0xFF; id(g_ring_g) = 0x6B; id(g_ring_b) = 0x35;
            } else if (mode == "cool") {
              id(g_ring_r) = 0x4F; id(g_ring_g) = 0xC3; id(g_ring_b) = 0xF7;
            } else {
              id(g_ring_r) = 255; id(g_ring_g) = 255; id(g_ring_b) = 255;
            }
            id(g_ring_brightness) = id(g_target) == 4 ? 0.50f : (id(g_target) == 5 ? 0.45f : 0.40f);
          } else if (id(g_control_mode) == 3) {
            // 本机 mode 3 (电量): green while charging, then level-coded green / amber / red.
            if (id(g_charging) || id(g_batt) > 50) { id(g_ring_r) = 0x35; id(g_ring_g) = 0xC7; id(g_ring_b) = 0x59; }
            else if (id(g_batt) < 0) { id(g_ring_r) = 0x61; id(g_ring_g) = 0x76; id(g_ring_b) = 0x81; }
            else if (id(g_batt) > 20) { id(g_ring_r) = 0xFF; id(g_ring_g) = 0xC0; id(g_ring_b) = 0x5A; }
            else { id(g_ring_r) = 0xE6; id(g_ring_g) = 0x64; id(g_ring_b) = 0x72; }
            id(g_ring_brightness) = 0.25f;
          } else {
            id(g_ring_r) = 255; id(g_ring_g) = 255; id(g_ring_b) = 255;
            id(g_ring_brightness) = 0.10f;
          }

          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring State");
          call.perform();

  - id: ring_rotate_feedback
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          id(g_ring_feedback) = 1;
          id(g_ring_direction) = direction >= 0 ? 1 : -1;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 300ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  - id: ring_device_feedback
    mode: restart
    then:
      - lambda: |-
          id(g_ring_feedback) = 2;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 200ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  - id: ring_mode_feedback
    mode: restart
    then:
      - lambda: |-
          id(g_ring_feedback) = 3;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 200ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  - id: ring_tap_feedback
    mode: restart
    then:
      - lambda: |-
          id(g_ring_feedback) = 4;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 400ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  # [VA] Shared session entry: claims the screen/ring for the assistant without
  # starting the pipeline. Used both by the local PTT path (va_prepare) and by
  # pipelines started from HA (proactive ask).
  - id: va_enter_session
    then:
      - lambda: |-
          id(g_va_phase) = 1; // [VA]
          id(g_va_active) = true;
          id(g_va_tts_started) = false;
          id(g_va_stt_seen) = false;
          id(g_va_started_ms) = millis();
          id(g_manual_until) = millis() + 60000;
          id(g_va_dac_was_unmuted) = id(dac_unmute).state;
          id(g_va_return_to_aod) = id(g_sleeping) || id(g_wake_consume);
          // An assistant turn IS activity: whether it started from a lock-screen
          // long press or from a wake word while the dial was asleep, the screen
          // must leave AOD state and come up to full brightness. Without this the
          // VA page would be painted at the 5-50 % AOD backlight level.
          // `g_sleeping` is cleared BEFORE ring_update_state below, which bails
          // out early while the dial is considered asleep.
          id(g_sleeping) = false;
          id(g_last_activity) = millis();
          id(g_backlight_pct) = 100;
          id(dac_unmute).turn_off();
          id(va_render).execute();
      - light.turn_on:
          id: backlight_light
          brightness: 100%
      - lvgl.page.show: page_va
      # [VA] Zoom-in starts the frame AFTER the page is visible, and the first
      # frame is already the small scale, so the avatar is never shown at full
      # size for one refresh before shrinking.
      - script.execute: va_zoom_in
      - script.execute: ring_update_state
      # [VA] Pause BLE scanning for the duration of the turn. NOT for RAM --
      # heap_max_block sits at 31 KB now and mic_task only needs 4 KB -- but for
      # main-loop time: with `bluetooth_proxy: active: true` every advertisement
      # costs a scan request plus a callback on the main loop, and the loop
      # stalls are what overrun the mic ring buffer and starve the I2S speaker.
      # `stop_scan` is used rather than `esp32_ble.disable` on purpose: tearing
      # the whole BLE stack down and back up takes hundreds of ms and would
      # stall the loop exactly at the moment the microphone opens.
      - esp32_ble_tracker.stop_scan:

  - id: va_prepare # [VA]
    then:
      - script.execute: va_enter_session
      - script.wait: va_enter_session
      # [VA] HA's microVAD closes the turn. ESPHome has no "finish and process
      # what you have" signal: `voice_assistant.stop` is translated into
      # `Requested pipeline abort` on the HA side, which discards the audio and
      # never produces a transcript. So the release must NOT stop the stream --
      # it keeps flowing, microVAD sees the silence the user just created and
      # ends the turn normally. Turning VAD off instead leaves the stt stream
      # unclosed and Volcengine kills it after 8 s (code 45000081).
      - voice_assistant.start:

  # [VA] Proactive ask. The dial takes the screen, shows the asking state and
  # asks HA to run `assist_satellite.start_conversation`, which speaks the
  # question through the normal pipeline and then listens. The listening window
  # is re-armed locally (see va_cleanup) until `listen_seconds` elapses, so a
  # short VAD timeout does not end the question after one beat of silence.
  - id: proactive_ask_start
    mode: restart
    parameters:
      question: string
      listen_seconds: int
    then:
      - lambda: |-
          id(g_va_proactive) = true;
          id(g_proactive_deadline_ms) = millis() + (uint32_t) (listen_seconds * 1000);
      - script.execute: va_enter_session
      - script.wait: va_enter_session
      - lambda: |-
          id(g_va_phase) = 5; // asking
          id(va_render).execute();
      - homeassistant.action:
          action: assist_satellite.start_conversation
          data:
            entity_id: ${satellite_entity}
          data_template:
            start_message: !lambda 'return question;'

  - id: proactive_abort  # [VA]
    then:
      - lambda: |-
          id(g_va_proactive) = false;
          id(g_proactive_deadline_ms) = 0;
      - voice_assistant.stop:
      - script.execute: va_cleanup

  - id: va_cleanup  # [VA]
    mode: restart
    then:
      # Proactive ask: nobody spoke yet and the listening window is still open,
      # so re-arm listening instead of tearing the session down.
      - if:
          condition:
            lambda: |-
              return id(g_va_proactive) && !id(g_va_stt_seen) && !id(g_va_tts_started) &&
                (int32_t)(id(g_proactive_deadline_ms) - millis()) > 0;
          then:
            - lambda: |-
                id(g_va_phase) = 1; // keep listening
                id(va_render).execute();
            - script.execute: ring_update_state
            - voice_assistant.start:
          else:
            - script.execute: va_teardown

  - id: va_teardown  # [VA]
    mode: restart
    then:
      - lambda: |-
          id(g_va_proactive) = false;
          id(g_proactive_deadline_ms) = 0;
          if (!id(g_va_active) && !id(g_ptt_started)) return;
          id(g_va_phase) = 0;
          id(g_va_active) = false;
          id(g_ptt_started) = false;
          id(g_last_activity) = millis();
          id(g_manual_until) = millis() + 3000;
          if (id(g_va_dac_was_unmuted)) id(dac_unmute).turn_on(); else id(dac_unmute).turn_off();
      # [VA] Always re-arm BLE scanning, deliberately placed BEFORE the early-exit
      # cases below and outside any condition. The lambda above can `return`
      # early, but that only leaves the lambda -- this action still runs, so every
      # exit path (on_end, on_error -> va_fail, on_tts_stream_end, the 12 s stuck
      # watchdog and the 120 s ceiling) restores the proxy. A missed restore would
      # silently leave the whole house's BLE proxy dead until the next reboot.
      - esp32_ble_tracker.start_scan:
      # [VA] Zoom-out BEFORE va_render: the idle render pass hides the avatar, so
      # running the shrink after it would animate an invisible widget. `script.wait`
      # makes the page swap further down wait for the animation instead of cutting
      # away mid-shrink -- safe here because everything audio-critical (BLE re-arm,
      # DAC restore) has already run above.
      - script.execute: va_zoom_out
      - script.wait: va_zoom_out
      # Idle render pass: blanks va_icon / va_text and stops va_think_pulse, so
      # nothing is left painted on the page we are navigating away from.
      - script.execute: va_render
      - script.execute: va_restore_external_media
      - script.execute: ring_update_state
      - if:
          condition: { lambda: 'return id(g_va_return_to_aod);' }
          then:
            - script.execute: enter_sleep
          else:
            - lvgl.page.show: page_main
            - script.execute: render_main

  - id: va_fail  # [VA]
    then:
      - lambda: |-
          id(g_va_phase) = 4;
          id(va_render).execute();
      - script.execute: ring_update_state
      - delay: 1200ms
      - script.execute: va_cleanup

  - id: ptt_long_press  # [VA]
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: |-
              // `g_wake_consume` is deliberately NOT checked here: a hold that
              // started on the AOD lock screen must still open the assistant.
              // It only suppresses the tap/swipe gesture (see on_release), so a
              // wake tap never leaks into a device action.
              return id(g_touch_down) && !id(g_ptt_started) && !id(g_va_active) &&
                abs(id(g_touch_dx)) <= 50 && abs(id(g_touch_dy)) <= 50;
          then:
            - lambda: 'id(g_ptt_started) = true;'
            # Re-arm check: the touch driver can drop a release event while LVGL is
            # redrawing, which would leave `g_touch_down` stuck and let a phantom
            # hold open a microphone session nobody asked for. Confirm the finger
            # is still down right before the pipeline is started.
            - delay: 120ms
            - if:
                condition: { lambda: 'return id(g_touch_down);' }
                then:
                  - script.execute: va_prepare
                else:
                  - lambda: 'id(g_ptt_started) = false;'

  - id: va_ptt_release_feedback  # [VA]
    mode: restart
    then:
      - lambda: 'id(g_va_release_flash) = true; id(va_render).execute();'
      - delay: 100ms
      - lambda: 'id(g_va_release_flash) = false; id(va_render).execute();'

  - id: va_duck_external_media  # [VA]
    then:
      - lambda: |-
          id(g_va_ducked_target) = -1;
          if (id(g_target) == 0) {
            id(g_va_duck_volume_snapshot) = id(tv_volume).state;
            id(g_va_ducked_target) = 0;
          } else if (id(g_target) == 1) {
            id(g_va_duck_volume_snapshot) = id(homepod_volume).state;
            id(g_va_ducked_target) = 1;
          }
      - if:
          condition: { lambda: 'return id(g_va_ducked_target) == 0;' }
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: ${tv_entity}
                  volume_level: "0.05"
      - if:
          condition: { lambda: 'return id(g_va_ducked_target) == 1;' }
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: ${homepod_entity}
                  volume_level: "0.05"

  - id: va_restore_external_media  # [VA]
    then:
      - if:
          condition: { lambda: 'return id(g_va_ducked_target) == 0;' }
          then:
            - if:
                condition: { lambda: 'return abs(id(tv_volume).state - 0.05f) <= 0.03f;' }
                then:
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: ${tv_entity}
                        volume_level: !lambda 'char buf[8]; snprintf(buf, 8, "%.2f", id(g_va_duck_volume_snapshot)); return std::string(buf);'
      - if:
          condition: { lambda: 'return id(g_va_ducked_target) == 1;' }
          then:
            - if:
                condition: { lambda: 'return abs(id(homepod_volume).state - 0.05f) <= 0.03f;' }
                then:
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: ${homepod_entity}
                        volume_level: !lambda 'char buf[8]; snprintf(buf, 8, "%.2f", id(g_va_duck_volume_snapshot)); return std::string(buf);'
      - lambda: 'id(g_va_ducked_target) = -1;'

  - id: va_render  # [VA]
    then:
      - lambda: |-
          // Plain LVGL rendering: one big mic glyph plus a short ASCII status
          // line. Deliberately NO STT/TTS text on screen -- the only Chinese
          // faces in this build (font_sc_*) carry ~200 hand-picked hanzi from
          // the &p6_glyphs anchor, so arbitrary transcripts would render as
          // blank boxes. A full CJK set is several MB at bpp4, which this
          // build has just finished optimising away. The recognised text is
          // logged instead (see voice_assistant on_stt_end / on_tts_start).
          const auto phase = id(g_va_phase);
          // One accent for every normal phase: the light blue of the Doubao icon
          // itself (#CAE4FF, the most common non-white pixel of the artwork), so
          // the status line and the motion rings read as part of the avatar. The phases
          // are already told apart by their wording ("listening..." / the
          // thinking pulse / "speaking...") and by the avatar being on screen,
          // so per-phase hues only fought with the mascot's own palette.
          const auto color_accent = lv_color_hex(0xCAE4FF);
          const auto color_error  = lv_color_hex(0xFF6B6B);

          lv_color_t c = color_accent;
          const char *text = "";
          bool show = true;
          switch (phase) {
            case 1: text = "listening..."; break;
            case 2: text = ""; break; // va_think_pulse writes it
            case 3: text = "speaking..."; break;
            case 4: c = color_error;     text = id(g_va_error_text).empty() ? "error"
                                                : id(g_va_error_text).c_str(); break;
            case 5: text = "asking..."; break;
            default: show = false; break;
          }

          // The avatar is artwork, not a glyph: it is shown or hidden, never
          // recoloured. Only the status line carries the phase colour.
          if (show) lv_obj_clear_flag(id(va_icon), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(va_icon), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_text_color(id(va_text), c, LV_PART_MAIN);
          if (phase != 2) lv_label_set_text(id(va_text), text);

          // Guard the pulse from the render pass itself rather than from every
          // caller: any phase change funnels through va_render, so starting and
          // stopping here cannot be forgotten on a new code path.
          if (phase == 2) id(va_think_pulse).execute();
          else id(va_think_pulse).stop();

          // Same contract for the motion layer. The two arcs are hidden here
          // (not inside va_motion) so that an aborted turn -- where the script
          // is stopped mid-delay -- can never leave a ring painted behind.
          const bool breathing = (phase == 1 || phase == 5);
          const bool sweeping = (phase == 3);
          if (breathing) lv_obj_clear_flag(id(va_breath), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(va_breath), LV_OBJ_FLAG_HIDDEN);
          if (sweeping) lv_obj_clear_flag(id(va_sweep), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(va_sweep), LV_OBJ_FLAG_HIDDEN);
          if (breathing || sweeping) id(va_motion).execute();
          else id(va_motion).stop();

  # [VA] Motion layer driver for listening (breathing ring) and speaking
  # (orbiting comet). One script for both phases, because they are mutually
  # exclusive and sharing the loop keeps a single timer in flight.
  #
  # Tick rate is deliberately unequal. Listening runs at 120 ms (~8 fps): the
  # microphone is streaming then, and this build has already been bitten twice by
  # main-loop stalls starving the mic ring buffer, so the animation is kept to
  # style-only writes at a low rate. Speaking runs at 70 ms (~14 fps) for a
  # smoother orbit -- the mic is closed by then and only the I2S speaker is
  # active, which is DMA-fed.
  - id: va_motion  # [VA]
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(g_va_phase) == 1 || id(g_va_phase) == 3 || id(g_va_phase) == 5;'
          then:
            - lambda: |-
                const int step = id(g_va_motion_step)++;
                if (id(g_va_phase) == 3) {
                  // 13 deg per tick -> one full orbit in ~2 s.
                  lv_arc_set_rotation(id(va_sweep), (step * 13) % 360);
                } else {
                  // Triangle wave over 16 ticks (~1.9 s per breath). Opacity and
                  // thickness move together so the ring reads as pulsing light
                  // rather than a resizing object -- resizing would invalidate a
                  // growing area every tick.
                  const int t = step % 16;
                  const int tri = t < 8 ? t : 15 - t;          // 0..7
                  const lv_opa_t opa = (lv_opa_t) (70 + tri * 26);  // 70..252
                  lv_obj_set_style_arc_opa(id(va_breath), opa, LV_PART_MAIN);
                  lv_obj_set_style_arc_width(id(va_breath), 3 + (tri >> 1), LV_PART_MAIN);
                }
            - delay: !lambda 'return id(g_va_phase) == 3 ? 70 : 120;'

  # [VA] Enter / leave transition for the assistant page.
  #
  # Only the avatar is scaled, never the page or a container. LVGL 9 renders a
  # transformed *widget tree* through an intermediate layer buffer, and a layer
  # for this 360x360 screen would be ~260 KB -- impossible here. An image widget
  # instead scales inside its own draw routine (lv_image_set_scale, 256 = 100%),
  # which costs nothing but the resample of a 77x112 source. The status line and
  # the motion rings just fade with `opa`, which is also layer-free.
  #
  # 8 frames x 28 ms = ~220 ms, with a small overshoot (268 -> 256) so the avatar
  # lands with a pop instead of easing in flatly.
  - id: va_zoom_in  # [VA]
    mode: restart
    then:
      - lambda: 'id(g_va_zoom_step) = 0;'
      - repeat:
          count: 8
          then:
            - lambda: |-
                static const uint16_t scale[] = {96, 150, 196, 232, 256, 268, 262, 256};
                const int i = id(g_va_zoom_step)++;
                lv_image_set_scale(id(va_icon), scale[i]);
                // Text and rings trail the avatar slightly: they only start
                // appearing once the face is past half size.
                const int fade = i < 2 ? 0 : (i - 1) * 42;
                const lv_opa_t opa = (lv_opa_t) (fade > 255 ? 255 : fade);
                lv_obj_set_style_opa(id(va_text), opa, LV_PART_MAIN);
                lv_obj_set_style_opa(id(va_breath), opa, LV_PART_MAIN);
                lv_obj_set_style_opa(id(va_sweep), opa, LV_PART_MAIN);
            - delay: 28ms

  # [VA] Leave transition. Runs to completion *before* the page is swapped, so
  # the dial never cuts straight from a full-size avatar to the clock.
  # `mode: single` on purpose: va_teardown waits on this script, and a restart
  # would abandon that wait and let the page switch race the animation.
  - id: va_zoom_out  # [VA]
    mode: single
    then:
      - lambda: 'id(g_va_zoom_step) = 0;'
      - repeat:
          count: 6
          then:
            - lambda: |-
                static const uint16_t scale[] = {256, 236, 200, 156, 116, 80};
                const int i = id(g_va_zoom_step)++;
                lv_image_set_scale(id(va_icon), scale[i]);
                const lv_opa_t opa = (lv_opa_t) (255 - i * 51);
                lv_obj_set_style_opa(id(va_text), opa, LV_PART_MAIN);
                lv_obj_set_style_opa(id(va_breath), opa, LV_PART_MAIN);
                lv_obj_set_style_opa(id(va_sweep), opa, LV_PART_MAIN);
            - delay: 24ms
      # Leave the page in its neutral state: the next session's zoom-in starts
      # from its own first frame, and nothing stays half-faded if the next entry
      # happens to skip the animation.
      - lambda: |-
          lv_obj_set_style_opa(id(va_text), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_opa(id(va_breath), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_opa(id(va_sweep), LV_OPA_COVER, LV_PART_MAIN);

  # [VA] Thinking indicator: | -> || -> ||| -> || -> | at 200 ms.
  # A `script` with `mode: restart` rather than a global `interval:` because an
  # interval cannot be started and stopped on demand -- it would keep ticking
  # (and keep writing to a label on a hidden page) for the whole uptime, which
  # is exactly the kind of always-on timer the animimg cleanup removed.
  # Only ASCII '|' is used, which every embedded font here already has.
  - id: va_think_pulse
    mode: restart
    then:
      - while:
          condition: { lambda: 'return id(g_va_phase) == 2;' }
          then:
            - lambda: |-
                static const char *frames[] = {"|", "||", "|||", "||"};
                // Re-check inside the loop body too: the phase can flip during
                // the 200 ms delay and we must not stamp a stale frame over
                // the text the next phase has already written.
                if (id(g_va_phase) == 2)
                  lv_label_set_text(id(va_text), frames[id(g_va_pulse_step) & 3]);
                id(g_va_pulse_step)++;
            - delay: 200ms
      - lambda: |-
          if (id(g_va_phase) != 2) lv_label_set_text(id(va_text), "");

  - id: knob_visual_settle
    mode: restart
    then:
      - delay: 500ms
      - lambda: |-
          const bool tv_volume_muted = id(g_target) == 0 && id(g_control_mode) == 1 && id(tv_muted).state;
          const bool homepod_volume_inactive = id(g_target) == 1 && id(g_control_mode) == 1 &&
            id(homepod_state).state != "playing";
          lv_obj_set_style_text_color(id(lbl_value), lv_color_hex((tv_volume_muted || homepod_volume_inactive) ? 0x617681 : 0xF2F6F8), LV_PART_MAIN);
          lv_obj_set_style_arc_opa(id(arc_value), LV_OPA_70, LV_PART_INDICATOR);

  - id: optimistic_settle
    mode: restart
    then:
      - delay: 2010ms
      - if:
          condition:
            lambda: 'return millis() - id(g_knob_last_rotate_ms) > 2000;'
          then:
            - lambda: 'id(g_optimistic_valid) = false;'
            - if:
                condition:
                  lambda: 'return !id(g_sleeping);'
                then:
                  - script.execute: render_main

  - id: tv_transport_settle
    mode: restart
    then:
      - delay: 2010ms
      - lambda: |-
          if (millis() - id(g_tv_transport_changed_ms) > 2000) {
            id(g_tv_transport_optimistic) = false;
          }
      - if:
          condition:
            lambda: 'return !id(g_sleeping);'
          then:
            - script.execute: render_main

  - id: sync_from_ha
    mode: restart
    then:
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: sync_from_ha
      - delay: 50ms
      - lambda: |-
          if (id(g_optimistic_valid) && millis() - id(g_knob_last_rotate_ms) > 2000)
            id(g_optimistic_valid) = false;
      - if:
          condition:
            lambda: 'return !id(g_sleeping) && millis() - id(g_knob_last_rotate_ms) > 2000 && !id(g_optimistic_valid);'
          then:
            - if:
                condition:
                  lambda: 'return millis() >= id(g_manual_until);'
                then:
                  - script.execute: resolve_priority
                else:
                  - script.execute: render_main

  - id: resolve_priority
    then:
      - if: # [VA]
          condition: { lambda: 'return id(g_va_active);' }
          then:
            - script.stop: resolve_priority
      - lambda: |-
          const std::string tv = id(tv_state).state;
          const std::string homepod = id(homepod_state).state;
          if (tv == "playing" || tv == "on" || tv == "paused") id(g_target) = 0;
          else if (homepod == "playing" || homepod == "on" || homepod == "paused") id(g_target) = 1;
          else if (id(ceiling_light_state).state == "on") id(g_target) = 2;
          else if (id(strip_light_state).state == "on") id(g_target) = 3;
          else if (!id(climate_state).state.empty() &&
                   id(climate_state).state != "off" &&
                   id(climate_state).state != "unknown" &&
                   id(climate_state).state != "unavailable") id(g_target) = 4;
          else if (!id(dining_room_climate_state).state.empty() &&
                   id(dining_room_climate_state).state != "off" &&
                   id(dining_room_climate_state).state != "unknown" &&
                   id(dining_room_climate_state).state != "unavailable") id(g_target) = 5;
          else if (!id(floor_heating_state).state.empty() &&
                   id(floor_heating_state).state != "off" &&
                   id(floor_heating_state).state != "unknown" &&
                   id(floor_heating_state).state != "unavailable") id(g_target) = 6;
          else id(g_target) = 7;
          id(g_control_mode) = 0;
      - script.execute: render_main

  - id: render_main
    then:
      - lvgl.label.update:
          id: lbl_device_name
          text: !lambda |-
            switch (id(g_target)) {
              case 0: return std::string("客厅电视");
              case 1: return std::string("HomePod");
              case 2: return std::string("客厅吸顶灯");
              case 3: return std::string("灯带");
              case 4: return std::string("客厅空调");
              case 5: return std::string("餐厅空调");
              case 6: return std::string("地暖");
              default: return std::string("Magic Dial");
            }
      - lvgl.label.update:
          id: lbl_mode
          text: !lambda |-
            if (id(g_target) == 0 || id(g_target) == 1)
              return id(g_control_mode) == 0 ? std::string("进度") : std::string("音量");
            if (id(g_target) == 2)
              return id(g_control_mode) == 0 ? std::string("亮度") : std::string("色温");
            if (id(g_target) == 3)
              return id(g_control_mode) == 0 ? std::string("亮度") : std::string("色相");
            if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6)
              return id(g_control_mode) == 0 ? std::string("目标温度") : std::string("模式");
            // 本机 has four modes; mode 3 (电量) doubles as the charge state readout.
            if (id(g_control_mode) == 3)
              return id(g_charging) ? std::string("充电中") : std::string("电量");
            if (id(g_control_mode) == 2) return std::string("锁屏亮度");
            return id(g_control_mode) == 0 ? std::string("本机音量") : std::string("屏幕亮度");
      - lvgl.label.update:
          id: dev_icon
          text: !lambda |-
            switch (id(g_target)) {
              case 0: return std::string("󰔂");  // mdi-television
              case 1: return std::string("󰓃");  // mdi-speaker
              case 2: return std::string("󰝩");  // mdi-ceiling-light
              case 3: return std::string("󰟖");  // mdi-led-strip
              case 4: case 5: return std::string("󰀛");  // mdi-air-conditioner
              case 6: return std::string("󰐸");  // mdi-radiator
              default:
                // 本机 mode 3 (电量) swaps the knob glyph for a level-aware battery icon.
                // While charging it cycles the mdi-battery-charging-* frames, which is the
                // "filling" animation the upstream batt_render script draws, and it sits
                // right next to the device name as the ⚡ marker.
                if (id(g_control_mode) == 3) {
                  if (id(g_batt) < 0) return std::string("󰂎");  // mdi-battery-outline
                  if (id(g_charging)) {
                    static const char *frames[5] = {
                      "󰂆",  // mdi-battery-charging-20
                      "󰂈",  // mdi-battery-charging-40
                      "󰂉",  // mdi-battery-charging-60
                      "󰂊",  // mdi-battery-charging-80
                      "󰂅",  // mdi-battery-charging-100
                    };
                    return std::string(frames[id(g_chg_anim) % 5]);
                  }
                  const int p = id(g_batt);
                  if (p > 87) return std::string("󰁹");  // mdi-battery
                  if (p > 62) return std::string("󰂁");  // mdi-battery-80
                  if (p > 37) return std::string("󰁿");  // mdi-battery-60
                  if (p > 12) return std::string("󰁽");  // mdi-battery-40
                  return std::string("󰁻");              // mdi-battery-20
                }
                return std::string("󱮖");  // mdi-knob
            }
      - lvgl.label.update:
          id: lbl_value
          text: !lambda |-
