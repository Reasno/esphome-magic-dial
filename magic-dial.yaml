substitutions:
  device_name: magic-dial
  friendly_name: "Magic Dial"
  timezone: "Asia/Shanghai"

  # Magic Dial P6 / Midnight Orbit color tokens.
  color_bg_canvas: "0x03070A"
  color_bg_aod: "0x010304"
  color_bg_surface: "0x09131B"
  color_line_track: "0x14222C"
  color_line_tick: "0x263945"
  color_text_primary: "0xF2F6F8"
  color_text_secondary: "0xA5B4BD"
  color_text_tertiary: "0x617681"
  color_offline: "0xE66472"
  color_media: "0x49A8FF"
  color_light: "0xFFC05A"
  color_local: "0x45D6C5"
  color_va_listening: "0xCAE4FF"  # [VA] Doubao icon light blue -- one accent for all phases
  color_va_thinking: "0xCAE4FF"   # [VA]
  color_va_error: "0xFF6B6B"      # [VA] kept distinct: a failure must not read as a normal phase

  # Home Assistant entities. Change only these substitutions if entity IDs differ.
  tv_entity: media_player.sony_k_55xr50
  tv_remote_entity: remote.sony_k_55xr50
  homepod_entity: media_player.ke_ting_ke_ting
  # Unified template light (HA `packages/ceiling_light_unified.yaml`). It hides the
  # split between the wall relay (on/off) and the Opple lamp (brightness/colour
  # temperature): on/off goes to the relay, brightness/CT are proxied to the lamp
  # and the template powers the relay up first when needed. The dial therefore
  # only ever talks to this one entity - no relay handling here any more.
  ceiling_light_entity: light.xi_ding_deng
  # Real range of the Opple lamp, as reported by the template light.
  ceiling_ct_min: "3000"
  ceiling_ct_max: "5700"
  strip_light_entity: light.yeelink_cn_48303523_strip1_s_2_light
  dining_room_climate_entity: climate.24dfa79bdf8f
  living_room_climate_entity: climate.24dfa7d09617
  floor_heating_entity: climate.suittc_cn_929054575_m302

  # [VA] Proactive ask. `satellite_entity` is this device's assist_satellite
  # entity in HA; `assist_satellite.start_conversation` is what makes the dial
  # speak first and then listen. Adjust if the entity id differs.
  satellite_entity: assist_satellite.ke_ting_magic_dial_assist_satellite
  # Seconds the dial keeps listening after a proactive question before it gives
  # up and returns to the previous screen.
  proactive_listen_seconds: "10"

  # Point this at a calendar that aggregates every holiday you want to display.
  # The current event's `message` attribute is shown verbatim; an inactive calendar
  # leaves the holiday line blank. This is intentionally not limited to Chinese holidays.
  holiday_calendar_entity: calendar.zhong_guo

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  # Hand-rolled PNG encoder for the Ulanzi knob bar. See publish_knob_bar.
  includes:
    - ulanzi_bar.h
    - media_artwork_loader.h
    - lvgl_screenshot.h
  build_flags:
    - -DLV_USE_SNAPSHOT=1
  on_boot:
    # The LCD remains powered from the battery while the ESP32 reboots. A long
    # pre-init reset is required to clear a latched ST77916/QSPI error state.
    - priority: 1000
      then:
        - lambda: |-
            // The LCD stays battery-powered across an ESP restart. Hold CS high
            // and clock/data low before releasing reset so the ST77916 cannot
            // sample floating QSPI pins as commands during the pre-init gap.
            const gpio_num_t qspi_pins[] = {
              GPIO_NUM_11, GPIO_NUM_13, GPIO_NUM_14, GPIO_NUM_15, GPIO_NUM_16
            };
            gpio_reset_pin(GPIO_NUM_12);
            gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_12, 1);
            for (auto pin : qspi_pins) {
              gpio_reset_pin(pin);
              gpio_set_direction(pin, GPIO_MODE_OUTPUT);
              gpio_set_level(pin, 0);
            }
            gpio_reset_pin(GPIO_NUM_17);
            gpio_set_direction(GPIO_NUM_17, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_17, 0);
            vTaskDelay(pdMS_TO_TICKS(1200));
            gpio_set_level(GPIO_NUM_17, 1);
            vTaskDelay(pdMS_TO_TICKS(150));
            ESP_LOGI("lcd_reset", "Pre-init LCD hard reset completed with QSPI held idle");
    - priority: -100
      then:
        - lambda: |-
            magic_dial::media_artwork::loader.setup();
            auto *artwork_parent = lv_obj_get_parent(id(aod_media_image));
            lv_obj_delete(id(aod_media_image));
            id(aod_media_image) = lv_canvas_create(artwork_parent);
            lv_obj_set_size(id(aod_media_image), magic_dial::media_artwork::WIDTH,
                            magic_dial::media_artwork::HEIGHT);
            lv_obj_align(id(aod_media_image), LV_ALIGN_CENTER, 0, 0);
            lv_obj_add_flag(id(aod_media_image), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(aod_media_image),
                               static_cast<lv_obj_flag_t>(LV_OBJ_FLAG_CLICKABLE | LV_OBJ_FLAG_SCROLLABLE));
            ESP_LOGI("aod_media", "Replaced AOD image widget with RGB565 canvas");
        - delay: 1s
        - light.turn_on:
            id: backlight_light
            brightness: 100%
        - lambda: |-
            id(g_last_activity) = millis();
            id(g_backlight_pct) = 100;
        # Keep the speaker's software gain in sync with the number the 本机扬声器
        # target shows from the very first frame, so the first VA turn after a
        # reboot is already at the displayed volume.
        - script.execute: apply_local_volume
        - script.execute: resolve_priority
        - lvgl.page.show:
            id: page_main
            animation: fade_in
            time: 250ms
        # [WW] microWakeWord never self-starts: MicroWakeWord::setup() only builds
        # the frontend/queues and leaves the component in State::STOPPED, so
        # without this the model is flashed but deaf. va_teardown re-arms it after
        # every assistant turn; this is the initial arm.
        - micro_wake_word.start:
        - lambda: |-
            const esp_err_t ota_result = esp_ota_mark_app_valid_cancel_rollback();
            ESP_LOGI("ota", "Marked running partition valid: %s", esp_err_to_name(ota_result));

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB          # 16 MB flash (JC3636K718C)
  partitions: partitions.csv  # MAX app partitions (~7.94 MB/slot). Requires USB flashing!
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # PSRAM into the general malloc heap. Without this only heap_caps_malloc
      # with MALLOC_CAP_SPIRAM reaches PSRAM, so every plain new/malloc drains
      # the ~21 KB of internal RAM that xTaskCreate("mic_task") also needs, and
      # the mic task fails to start on the first PTT press.
      CONFIG_SPIRAM_USE_MALLOC: "y"
      # Allocations at or below this size stay internal (the 16384 default is
      # too greedy here); everything larger is pushed out to PSRAM.
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      # Hard-reserve internal RAM that PSRAM can never satisfy: I2S in/out DMA
      # descriptors and task stacks.
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  initial_level: INFO

# Internal / DMA RAM is the scarce resource on this build (display + LVGL +
# BLE proxy + MQTT + I2S in/out all compete for it). `mic_task` creation has
# already failed once because of exhaustion, so expose the heap counters and
# quantify the headroom instead of guessing.
debug:
  update_interval: 10s

api:
  encryption:
    key: !secret magic_dial_api_key
  actions:
    # [VA] Proactive ask: HA (or any automation) hands the dial a question, the
    # dial wakes, shows the asking screen, speaks the question through the
    # Assist pipeline and then keeps listening for `listen_seconds`.
    - action: proactive_ask
      variables:
        question: string
        listen_seconds: int
      then:
        - script.execute:
            id: proactive_ask_start
            question: !lambda 'return question;'
            listen_seconds: !lambda 'return listen_seconds > 0 ? listen_seconds : ${proactive_listen_seconds};'
    - action: proactive_cancel
      then:
        - script.execute: proactive_abort

ota:
  - platform: esphome
    password: !secret magic_dial_ota_password

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.31.33
    gateway: 192.168.31.1
    subnet: 255.255.255.0
    dns1: 192.168.31.1
  ap:
    ssid: "Magic Dial Setup"

captive_portal:

http_request:
  timeout: 10s
  buffer_size_rx: 1024
  watchdog_timeout: 15s

# MQTT is used for exactly one thing: driving the Ulanzi pixel clock's knob bar.
# The dial publishes a ready-made AWTRIX payload straight to
# `ulanzi_aa68/custom/test` on the shared EMQX broker - no Home Assistant round
# trip, so there is no per-frame `shell_command` (~140 ms) in the path and the bar
# tracks the knob smoothly. Everything else keeps using the native API, so all of
# ESPHome's own MQTT plumbing is turned off:
#   discovery / discover_ip: false - HA already owns these entities via the native
#                       API; leaving them on would create a duplicate device.
#   topic_prefix: null - suppresses the per-entity state/command topics. Requires
#                       log_topic / birth_message / will_message to be empty too.
#   reboot_timeout: 0s - never reboot just because EMQX is unreachable. The dial
#                       must stay usable without the broker.
mqtt:
  id: mqtt_client
  broker: 192.168.31.111
  port: 1883
  discovery: false
  discover_ip: false
  topic_prefix: null
  log_topic: null
  birth_message:
  will_message:
  reboot_timeout: 0s
  on_message:
    - topic: magic_dial/debug/artwork_url
      then:
        - lambda: |-
            id(aod_media_artwork_url).publish_state(x);
    - topic: magic_dial/debug/force_aod
      then:
        - script.execute: enter_sleep
    - topic: magic_dial/debug/wake
      then:
        - script.execute: wake_display
    - topic: magic_dial/debug/force_va
      then:
        - script.execute: va_enter_session
    - topic: magic_dial/debug/force_thinking
      then:
        - lambda: |-
            id(g_va_active) = true;
            id(g_va_phase) = 2;
        - script.execute: va_claim_display
        - script.wait: va_claim_display
        - script.execute: va_render
    - topic: magic_dial/debug/screenshot/request
      then:
        - lambda: |-
            magic_dial::screenshot::publisher.capture(lv_screen_active());
    - topic: magic_dial/debug/reboot
      then:
        - lambda: |-
            App.safe_reboot();

# The physical knob is not a quadrature encoder. Each direction has its own
# active-low pulse input: left on GPIO2 and right on GPIO1.
binary_sensor:
  - platform: homeassistant
    id: tv_muted
    entity_id: ${tv_entity}
    attribute: is_volume_muted
    internal: true
    on_state:
      - script.execute: render_main

  - platform: homeassistant
    id: homepod_muted
    entity_id: ${homepod_entity}
    attribute: is_volume_muted
    internal: true

  # BLE 扫描与房间判定由儿童积分 NFC 签到器承担。Magic Dial 只订阅 HA
  # 中保持稳定的 presence 实体，避免 BLE 栈继续与 LVGL、音频和 Wi-Fi 争用内存。
  - platform: homeassistant
    id: gu_xi_in_living_room_local
    entity_id: binary_sensor.gu_xi_zai_ke_ting
    internal: true
    on_state:
      - script.execute: apply_screen_brightness

  - platform: homeassistant
    id: liu_xin_yi_in_living_room_local
    entity_id: binary_sensor.liu_xin_yi_zai_ke_ting
    internal: true
    on_state:
      - script.execute: apply_screen_brightness

  - platform: gpio
    name: "Knob Left"
    id: knob_left
    pin:
      number: GPIO2
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
    on_press:
      - lambda: |-
          const uint32_t now = millis();
          // The first knob pulse in AOD is consumed: wake only, never mutate state.
          if (id(g_sleeping)) {
            ESP_LOGI("wake", "Knob left requested AOD exit");
            id(g_last_activity) = now;
            id(wake_display).execute();
            return;
          }
          const uint32_t elapsed = id(g_knob_last_pulse_ms) == 0 ? UINT32_MAX : now - id(g_knob_last_pulse_ms);
          if (id(g_knob_last_direction) == 1 && elapsed < 20) return;
          // Continuous acceleration curve: step % = (250 / elapsed) ^ 1.86,
          // clamped to 1..20. This replaces the old 4-rung ladder
          // (1 / 3 / 8 / 20 % at 250 / 120 / 50 ms) which jumped step size at
          // every threshold and made a steady turn feel like it changed gear.
          // The envelope is deliberately the same - 250 ms -> 1 %, ~80 ms -> 8 %,
          // 50 ms and faster -> 20 % - but the rungs in between are filled in, so
          // sensitivity ramps instead of stepping. Measured ladder, ms -> %:
          //   250->1  200->2  160->2  140->3  120->4  100->5
          //   80->8   70->11  60->14  55->17  50->20
          // The lower clamp on `e` keeps powf() away from the sub-debounce range,
          // and UINT32_MAX on the first pulse folds to 1 %.
          const float e = (float) (elapsed > 250 ? 250 : (elapsed < 20 ? 20 : elapsed));
          id(g_knob_speed_pct) = (int) fminf(20.0f, fmaxf(1.0f, roundf(powf(250.0f / e, 1.86f))));
          id(g_knob_last_pulse_ms) = now;
          id(g_knob_last_direction) = -1;
          auto active = [&](int target) -> bool {
            if (target == 0) { const auto s=id(tv_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 1) { const auto s=id(homepod_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 2 || target == 3) {
              if (id(g_light_power_optimistic_valid) && id(g_light_power_optimistic_target) == target)
                return id(g_light_power_optimistic_on);
              return (target == 2 ? id(ceiling_light_state).state : id(strip_light_state).state) == "on";
            }
            if (target >= 4 && target <= 6) {
              if (id(g_climate_power_optimistic_valid) && id(g_climate_power_optimistic_target) == target)
                return id(g_climate_power_optimistic_on);
              const auto s = target == 4 ? id(climate_state).state :
                (target == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
              return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable";
            }
            return true;
          };
          // 本机 mode 3 (电量) is a read-only readout: the knob does nothing there.
          if (id(g_target) == 7 && id(g_control_mode) == 3) return;
          if (!active(id(g_target))) return;
          id(handle_knob).execute(-1);

  - platform: gpio
    name: "Knob Right"
    id: knob_right
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
    on_press:
      - lambda: |-
          const uint32_t now = millis();
          // The first knob pulse in AOD is consumed: wake only, never mutate state.
          if (id(g_sleeping)) {
            ESP_LOGI("wake", "Knob right requested AOD exit");
            id(g_last_activity) = now;
            id(wake_display).execute();
            return;
          }
          const uint32_t elapsed = id(g_knob_last_pulse_ms) == 0 ? UINT32_MAX : now - id(g_knob_last_pulse_ms);
          if (id(g_knob_last_direction) == -1 && elapsed < 20) return;
          // Continuous acceleration curve: step % = (250 / elapsed) ^ 1.86,
          // clamped to 1..20. This replaces the old 4-rung ladder
          // (1 / 3 / 8 / 20 % at 250 / 120 / 50 ms) which jumped step size at
          // every threshold and made a steady turn feel like it changed gear.
          // The envelope is deliberately the same - 250 ms -> 1 %, ~80 ms -> 8 %,
          // 50 ms and faster -> 20 % - but the rungs in between are filled in, so
          // sensitivity ramps instead of stepping. Measured ladder, ms -> %:
          //   250->1  200->2  160->2  140->3  120->4  100->5
          //   80->8   70->11  60->14  55->17  50->20
          // The lower clamp on `e` keeps powf() away from the sub-debounce range,
          // and UINT32_MAX on the first pulse folds to 1 %.
          const float e = (float) (elapsed > 250 ? 250 : (elapsed < 20 ? 20 : elapsed));
          id(g_knob_speed_pct) = (int) fminf(20.0f, fmaxf(1.0f, roundf(powf(250.0f / e, 1.86f))));
          id(g_knob_last_pulse_ms) = now;
          id(g_knob_last_direction) = 1;
          auto active = [&](int target) -> bool {
            if (target == 0) { const auto s=id(tv_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 1) { const auto s=id(homepod_state).state; return s=="playing"||s=="on"||s=="paused"; }
            if (target == 2 || target == 3) {
              if (id(g_light_power_optimistic_valid) && id(g_light_power_optimistic_target) == target)
                return id(g_light_power_optimistic_on);
              return (target == 2 ? id(ceiling_light_state).state : id(strip_light_state).state) == "on";
            }
            if (target >= 4 && target <= 6) {
              if (id(g_climate_power_optimistic_valid) && id(g_climate_power_optimistic_target) == target)
                return id(g_climate_power_optimistic_on);
              const auto s = target == 4 ? id(climate_state).state :
                (target == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
              return !s.empty()&&s!="off"&&s!="unknown"&&s!="unavailable";
            }
            return true;
          };
          // 本机 mode 3 (电量) is a read-only readout: the knob does nothing there.
          if (id(g_target) == 7 && id(g_control_mode) == 3) return;
          // 灯带关闭时仍允许在亮度页向右旋转，以便从 0 开始重新打开。
          const bool strip_brightness_wake =
            id(g_target) == 3 && id(g_control_mode) == 0;
          if (!active(id(g_target)) && !strip_brightness_wake) return;
          id(handle_knob).execute(1);

# PCM5100A enable: HIGH means unmuted.
switch:
  - platform: gpio
    name: "DAC Unmute"
    id: dac_unmute
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON

# Separate I2S buses are used for PCM5100A output and the PDM microphone.
i2s_audio:
  - id: i2s_out
    i2s_bclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true

  - id: i2s_in
    i2s_lrclk_pin: GPIO5

speaker:
  - platform: i2s_audio
    id: magic_dial_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO42
    dac_type: external
    channel: stereo

microphone:
  - platform: i2s_audio
    id: magic_dial_microphone
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO4
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit

# [WW] On-device wake word "豆包豆包" (microWakeWord, trained 2026-08-30:
# recall 98.46 %, 0 false accepts/h over 9.67 h of ambient audio).
# The model is local (models/wakeword_ecc0de7c.json + .tflite) -- no download
# at build time. It shares `magic_dial_microphone` with `voice_assistant`
# through the microphone-source layer, but never runs at the same time: the
# component stops itself on detection (`stop_after_detection`), va_enter_session
# stops it for PTT/proactive turns and va_teardown re-arms it.
micro_wake_word:
  id: magic_dial_mww
  microphone:
    microphone: magic_dial_microphone
    # [WW] mWW taps the raw mic source and never sees voice_assistant's
    # volume_multiplier: 3.0. This PDM mic is quiet enough that the features
    # land below the model's training level, so lift it here (integer gain).
    gain_factor: 4
  stop_after_detection: true
  models:
    - model: models/wakeword_ecc0de7c.json
      probability_cutoff: 0.96
      sliding_window_size: 5
  on_wake_word_detected:
    - logger.log:
        level: INFO
        format: "[WW] wake word detected -> starting assistant"
    - script.execute: va_prepare

voice_assistant:  # [VA]
  id: magic_dial_va
  microphone: magic_dial_microphone
  speaker: magic_dial_speaker
  use_wake_word: false
  # [VA] Capture gain. The PDM mic on this board is very quiet, and with the
  # ESPHome defaults (no gain, multiplier 1.0) the stream is too weak for the
  # pipeline VAD to ever mark speech, so the turn dies as
  # `stt-no-text-recognized`. These are the values the reference Guition VA
  # project runs with.
  # [VA] 2026-08-29: the turn now closes correctly (HA microVAD collects and
  # ends it), so the 45000081 stt timeout is gone -- but every turn still dies
  # as `stt-no-text-recognized`, i.e. the stream reaching STT is too weak to
  # transcribe. Reference-project values (multiplier 2.0) are not enough for
  # this unit's PDM mic, so lift the digital gain. `noise_suppression_level` is
  # dropped from 2 to 1 as well: on a signal this quiet the suppressor was
  # eating the speech together with the noise floor.
  # [VA] 2026-08-29 second pass: 6.0 overshot. With `auto_gain: 31dBFS` already
  # running AGC, a 6x pre-multiply just hard-clips int16 on louder syllables --
  # VAD still fires (plenty of energy) but STT gets distortion and returns "".
  # The real cause of the flaky turns was main-loop stall (see va_render), so
  # back the multiplier off to a sane 3.0 and let AGC do the levelling.
  # [VA] 2026-08-30: the wake word (gain_factor: 4 on the raw mic source) fires
  # reliably at a normal speaking distance, but the Listening phase at that same
  # loudness is too quiet for STT. Close the gap without repeating the 2026-08-29
  # clipping: lift the multiplier 3.0 -> 4.5 *and* lower the AGC target
  # 31dBFS -> 24dBFS, so the pre-multiplied signal keeps int16 headroom instead
  # of being pushed into the rails by AGC on top of it. If turns start coming
  # back as `stt-no-text-recognized` again, this is the first pair to back off.
  # [VA] 2026-09-13 far-field tuning: preserve the full microphone stream
  # without noise suppression, and use only the HA pipeline's AGC for level
  # recovery. 18 dBFS raises distant speech by 6 dB versus 24 dBFS, while the
  # proven 4.5 multiplier avoids returning to the clipping-prone 6.0.
  noise_suppression_level: 0
  auto_gain: 18dBFS
  volume_multiplier: 4.5
  # A pipeline can also be started from HA (assist_satellite.start_conversation
  # for a proactive question). In that case nothing ran va_prepare, so the
  # session state / VA page are set up here instead.
  on_start:
    - lambda: 'id(g_va_last_evt_ms) = millis();'
    - if:
        condition: { lambda: 'return !id(g_va_active);' }
        then:
          - script.execute: va_enter_session
  on_listening:
    - lambda: |-
        id(g_va_last_evt_ms) = millis();
        id(g_va_active) = true;
        id(g_va_phase) = 1; // listening
        id(g_va_error_text) = "";
        id(g_va_started_ms) = millis();
        // [VA] Session generation: bumped on every new turn so a *delayed*
        // teardown decision (va_fail's 1200 ms pause) can tell "the session I
        // was about to kill" from "a new turn that arrived while I waited".
        id(g_va_session_gen) += 1;
        id(g_va_idle_since_ms) = 0;
        ESP_LOGI("vatrace", "listening t=%u gen=%d", (unsigned) millis(),
                 (int) id(g_va_session_gen));
        // [VA] Continued conversation: HA re-opens the mic itself after TTS
        // (continue_conversation), and that new turn arrives with no local
        // script in between. Reset the per-turn flags here so round 2+ behaves
        // exactly like round 1 -- otherwise `g_va_tts_started` stays true from
        // the previous answer and the `on_end` fallback never fires again.
        id(g_va_tts_started) = false;
        id(g_va_stt_seen) = false;
        id(va_render).execute();
    - script.execute: va_claim_display
    - script.execute: ring_update_state
  # [VA] VAD edges do not change the phase -- the screen already says
  # "listening..." and flipping it on every speech edge would flicker. They are
  # logged only, which is enough to debug why a turn did or did not close.
  on_stt_vad_start:
    - lambda: 'id(g_va_last_evt_ms) = millis();'
    - logger.log:
        level: INFO
        format: "[VA] stt vad start (speech detected)"
  on_stt_vad_end:
    - lambda: 'id(g_va_last_evt_ms) = millis();'
    - logger.log:
        level: INFO
        format: "[VA] stt vad end (turn closing)"
  on_stt_end:
    - lambda: |-
        // The transcript goes to the log, NOT to the screen: the embedded
        // Chinese font only carries the ~200 hanzi of the UI itself, so an
        // arbitrary transcript would draw as empty boxes.
        id(g_va_last_evt_ms) = millis();
        ESP_LOGI("va", "STT text: %s", x.c_str());
        id(g_va_stt_seen) = true;
        id(g_va_phase) = 2; // thinking
        id(dac_unmute).turn_off(); // Mute thinking
    # Page ownership must settle before the pulse writes its first frame.
    - script.execute: va_claim_display
    - script.wait: va_claim_display
    - script.execute: va_render
    - script.wait: va_render
    - lambda: |-
        lv_obj_invalidate(id(va_text));
        lv_refr_now(lv_display_get_default());
        ESP_LOGI("vatrace", "thinking first frame refreshed t=%u",
                 (unsigned) millis());
    - script.execute: ring_update_state
  on_tts_start:
    - lambda: |-
        ESP_LOGI("va", "TTS text: %s", x.c_str());
        id(g_va_last_evt_ms) = millis();
        id(g_va_tts_started) = true;
  # [VA] Audio playback end. The actual teardown hangs off on_tts_stream_end
  # (the stream, not the text), so this is log-only on purpose.
  on_tts_end:
    - logger.log:
        level: INFO
        format: "[VA] tts finished"
  on_tts_stream_start:
    - lambda: |-
        id(g_va_last_evt_ms) = millis();
        id(g_va_phase) = 3; // speaking
        id(va_render).execute();
        id(dac_unmute).turn_on();
    - script.execute: va_claim_display
    - script.execute: ring_update_state
  # [VA] Playback finished. HA runs with `always_continue_conversation = false`,
  # so a normal turn is OVER the moment the answer stopped playing -- there is no
  # round 2 to wait for. Showing the `listening` look here was the "optimistic
  # second listening" bug: the dial looked like it was recording for the whole
  # 8 s the idle watchdog needed to notice that nobody was coming.
  #
  # The only case that still keeps the mic look is a proactive ask
  # (assist_satellite.start_conversation): there HA really does listen after the
  # question, until g_proactive_deadline_ms.
  #
  # The 8 s idle+silent poll, the 12 s stuck-listening watchdog and the 120 s
  # ceiling in the 1 s interval below all stay as fallbacks.
  on_tts_stream_end:
    - lambda: |-
        id(g_va_last_evt_ms) = millis();
        // Refresh the phase stamp so the 12 s stuck-listening watchdog cannot
        // inherit this turn's old start time in the proactive branch below.
        id(g_va_started_ms) = millis();
        ESP_LOGI("vatrace", "tts_stream_end t=%u phase=%d run=%d",
                 (unsigned) millis(), (int) id(g_va_phase),
                 (int) id(magic_dial_va).is_running());
        id(dac_unmute).turn_off(); // same mute the mic path uses while listening
    - if:
        # Proactive ask still inside its listening window -> keep the mic look.
        condition:
          lambda: |-
            return id(g_va_proactive) &&
              (int32_t)(id(g_proactive_deadline_ms) - millis()) > 0;
        then:
          - lambda: |-
              id(g_va_phase) = 1; // genuinely listening for the answer
              id(va_render).execute();
          - script.execute: ring_update_state
        else:
          # One-shot turn finished: close the session right away instead of
          # faking `listening` until the 8 s idle watchdog fires. va_cleanup ->
          # va_teardown re-arms micro_wake_word and returns to page_main / AOD.
          - logger.log: "[vatrace] tts_stream_end -> cleanup (no continue)"
          - script.execute: va_cleanup
  # [VA] RUN_END is a network message from HA and its arrival is NOT ordered
  # against the local `on_tts_stream_end`: in a continued conversation round N's
  # run-end regularly lands AFTER round N+1's on_listening, which already reset
  # `g_va_tts_started` to false. The old `!g_va_tts_started` test therefore fired
  # on a perfectly healthy new turn and tore it down -- this is the "clock face
  # flashes between speaking and listening" bug. Requiring phase 2 (thinking)
  # restores the original intent: a turn that asked something and got no answer.
  on_end:
    - lambda: |-
        id(g_va_last_evt_ms) = millis();
        ESP_LOGI("vatrace", "run_end t=%u phase=%d tts_started=%d run=%d",
                 (unsigned) millis(), (int) id(g_va_phase),
                 (int) id(g_va_tts_started),
                 (int) id(magic_dial_va).is_running());
    - if:
        condition:
          lambda: 'return id(g_va_active) && id(g_va_phase) == 2 && !id(g_va_tts_started);'
        then:
          - logger.log: "[vatrace] run_end -> cleanup (no answer)"
          - script.execute: va_cleanup
  on_error:
    - lambda: |-
        ESP_LOGE("va", "error code=%s message=%s", code.c_str(), message.c_str());
        if (code == "stt-no-text-recognized") {
          id(va_cleanup).execute();
        } else {
          std::string reason = code;
          if (reason.size() > 24) reason.resize(24);
          id(g_va_error_text) = reason.empty() ? std::string("error")
                                               : std::string("error: ") + reason;
          id(va_fail).execute();
        }

# ST77916 QSPI display bus.
spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO11
  data_pins: [GPIO13, GPIO14, GPIO15, GPIO16]

# CST816 touch controller bus.
i2c:
  id: touchscreen_bus
  sda: GPIO9
  scl: GPIO10

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_output

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight_light
    output: backlight_output
    restore_mode: ALWAYS_ON
    # Every brightness change ramps instead of stepping, so wake / sleep / manual
    # brightness edits all fade smoothly.
    default_transition_length: 400ms

  # 13-pixel WS2812 ring. RMT DMA keeps LED timing stable while LVGL/QSPI is busy.
  - platform: esp32_rmt_led_strip
    id: ring_light
    name: "${friendly_name} Ring"
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 13
    rgb_order: GRB
    chipset: WS2812
    rmt_symbols: 128
    use_dma: true
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - addressable_lambda:
          name: "Ring State"
          update_interval: 40ms
          lambda: |-
            const int n = it.size();
            if (id(g_va_active)) {  // [VA]
              const int phase = id(g_va_phase);
              if (id(g_va_release_flash)) {
                it.all() = Color(255, 255, 255);
                return;
              }
              if (phase == 1) { // Listening: Green breathing
                const float pulse = 0.6f + 0.4f * sinf(millis() * 0.01f);
                it.all() = Color(0x35D07F) * pulse;
              } else if (phase == 2) { // Thinking: White head + purple/blue trail
                const float elapsed = (float)millis();
                float head = fmodf(elapsed / 1000.0f * n, (float)n);
                for (int i = 0; i < n; i++) {
                  float d = head - i;
                  while (d < 0) d += n;
                  while (d >= n) d -= n;
                  if (d < 1.0f) it[i] = Color(255, 255, 255);
                  else if (d < 6.0f) {
                    float t = (d - 1.0f) / 5.0f;
                    it[i] = Color((uint8_t)(0x8B + (0x49 - 0x8B) * t),
                                  (uint8_t)(0x7C + (0xA8 - 0x7C) * t),
                                  (uint8_t)(0xFF + (0xFF - 0xFF) * t));
                  } else it[i] = Color(0, 0, 0);
                }
              } else if (phase == 3) { // Speaking: Blue mirrored waveform
                const float elapsed = (float)millis();
                for (int i = 0; i < n; i++) {
                  int dist = abs(i - 6);
                  float wave = 0.5f + 0.5f * sinf(elapsed * 0.02f - dist * 0.8f);
                  it[i] = Color(0x49A8FF) * wave;
                }
              } else if (phase == 4) { // Error: Coral red slow double flash
                const float t = fmodf(millis(), 2000.0f);
                float pulse = 0.0f;
                if (t < 200.0f) pulse = t / 200.0f;
                else if (t < 400.0f) pulse = 1.0f - (t - 200.0f) / 200.0f;
                else if (t < 600.0f) pulse = (t - 400.0f) / 200.0f;
                else if (t < 800.0f) pulse = 1.0f - (t - 600.0f) / 200.0f;
                it.all() = Color(0xFF6B6B) * pulse;
              }
              return;
            }
            const bool media_playing =
              id(tv_state).state == "playing" || id(homepod_state).state == "playing";
            if (id(g_sleeping)) {
              if (!media_playing) {
                it.all() = Color(0, 0, 0);
                return;
              }
              struct PaletteStop { uint8_t r; uint8_t g; uint8_t b; };
              // The two darkest stops were lifted out of navy: every channel
              // written here still goes through the strip's 2.8 gamma table, and
              // a 0x16 red / 0x2B green channel comes out as literally 0.
              static const PaletteStop palette[] = {
                {0x2E, 0x5A, 0xE6},  // blue
                {0x8A, 0x5A, 0xFF},  // violet
                {0x3F, 0xD2, 0xF0},  // cyan
                {0xFF, 0xB3, 0x47},  // warm amber
                {0x2E, 0x5A, 0xE6},  // close the loop
              };
              const int stop_count = sizeof(palette) / sizeof(palette[0]);
              const float elapsed = (float) millis();
              const float rotation = fmodf(elapsed / 9000.0f * n, (float) n);
              // The ring light runs ESPHome's default gamma_correct: 2.8, which is
              // applied *after* this lambda writes its pixels. A plain 0.32 factor
              // therefore leaves the LEDs at 0.32^2.8 ~= 4 % of the palette colour,
              // i.e. a ring that reads as off - which is exactly why the lock-screen
              // media glow was invisible while the tap flash (full 255) was fine.
              // Pre-compensating keeps the intent ("about a third of full") honest.
              const float brightness = powf(0.32f, 1.0f / 2.8f);  // ~0.66 pre-gamma
              for (int i = 0; i < n; i++) {
                const float pos = fmodf(((float) i + rotation) / (float) n * (stop_count - 1), (float) (stop_count - 1));
                const int idx0 = (int) floorf(pos);
                const int idx1 = (idx0 + 1) % (stop_count - 1);
                const float t = pos - idx0;
                const float r = palette[idx0].r + (palette[idx1].r - palette[idx0].r) * t;
                const float g = palette[idx0].g + (palette[idx1].g - palette[idx0].g) * t;
                const float b = palette[idx0].b + (palette[idx1].b - palette[idx0].b) * t;
                it[i] = Color(
                  (uint8_t) roundf(r * brightness),
                  (uint8_t) roundf(g * brightness),
                  (uint8_t) roundf(b * brightness));
              }
              return;
            }
            float level = id(g_ring_brightness);
            if (id(g_target) == 0 || id(g_target) == 1) {
              // Slow 3-second breath, from 30% to 60% of the target color.
              const float phase = (millis() % 3000) / 3000.0f * 6.2831853f;
              level = 0.45f - 0.15f * cosf(phase);
            }
            const uint8_t r = (uint8_t) roundf(id(g_ring_r) * level);
            const uint8_t g = (uint8_t) roundf(id(g_ring_g) * level);
            const uint8_t b = (uint8_t) roundf(id(g_ring_b) * level);
            it.all() = Color(r, g, b);

      - addressable_lambda:
          name: "Ring Feedback"
          update_interval: 20ms
          lambda: |-
            const int n = it.size();
            const int kind = id(g_ring_feedback);
            if (kind == 1) {
              // One directional comet lap in 300 ms; direction follows the knob.
              const float elapsed = (float) (millis() - id(g_ring_feedback_started_ms));
              float head = fmodf(elapsed / 300.0f * n, (float) n);
              if (id(g_ring_direction) < 0) head = fmodf(n - head, (float) n);
              for (int i = 0; i < n; i++) {
                float d = id(g_ring_direction) > 0 ? head - i : i - head;
                while (d < 0) d += n;
                while (d >= n) d -= n;
                float tail = d < 4.0f ? 1.0f - d / 4.0f : 0.0f;
                tail *= tail;
                it[i] = Color(
                  (uint8_t) roundf(id(g_ring_r) * tail),
                  (uint8_t) roundf(id(g_ring_g) * tail),
                  (uint8_t) roundf(id(g_ring_b) * tail));
              }
            } else if (kind == 2) {
              it.all() = Color(255, 255, 255);  // device switch
            } else if (kind == 3) {
              it.all() = Color(id(g_ring_r), id(g_ring_g), id(g_ring_b));  // mode switch
            } else if (kind == 4) {
              it.all() = Color(255, 0, 0);      // tap acknowledgement
            } else {
              it.all() = Color(0, 0, 0);
            }

