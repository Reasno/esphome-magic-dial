    restore_value: no
    initial_value: '0x45D6C5'
  - id: g_target_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_touch_x0
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_y0
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_dx
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_dy
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_touch_t0
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_knob_last_pulse_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_knob_speed_pct
    type: int
    restore_value: no
    initial_value: '1'
  - id: g_knob_last_direction
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_knob_last_rotate_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_optimistic_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_optimistic_target
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_optimistic_mode
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_optimistic_value
    type: float
    restore_value: no
    initial_value: '0.0'
  # TV transport has its own optimistic state so play/pause feedback is immediate
  # and HA callbacks cannot flip the icon back during the 2000 ms ignore window.
  - id: g_tv_transport_optimistic
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_tv_transport_playing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_tv_transport_changed_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_gesture
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_remote_button
    type: int
    restore_value: no
    initial_value: '0'
  # Current steady-state ring color and level. Feedback effects temporarily override these.
  - id: g_ring_r
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_ring_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_ring_b
    type: int
    restore_value: no
    initial_value: '255'
  - id: g_ring_brightness
    type: float
    restore_value: no
    initial_value: '0.1'
  - id: g_ring_feedback
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_ring_direction
    type: int
    restore_value: no
    initial_value: '1'
  - id: g_ring_feedback_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Battery state, ported from the upstream Guition VA project. There is no STAT
  # pin wired to a GPIO on the JC3636K718C dock, so charging is inferred from the
  # rail voltage instead.
  - id: g_batt         # battery level in % (-1 = no reading yet -> show "--")
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_charging     # true = charging / on USB (voltage heuristic)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_v_med        # last median VCC_OUT voltage (a rise means charging)
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: g_chg_anim     # frame of the battery "filling" animation while charging (0..4)
    type: int
    restore_value: no
    initial_value: '0'
  # Ulanzi knob bar (see the `publish_knob_bar` script). The frame is published
  # straight to the Ulanzi's MQTT custom app, so the only rate limit that matters
  # is the Ulanzi's own refresh: a 200 ms leading-edge throttle keeps the bar live
  # while turning, and a trailing frame lands the final value after it stops.
  - id: g_knob_pub_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: g_knob_pub_pct
    type: int
    restore_value: no
    initial_value: '-1'
  - id: g_knob_pub_ok  # set by publish_knob_bar's lambda; gates the mqtt.publish
    type: bool
    restore_value: no
    initial_value: 'false'
  # ~1.3 kB of ready-to-send AWTRIX payload, built by ulanzi_bar.h.
  - id: g_knob_pub_payload
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  - id: ring_update_state
    mode: restart
    then:
      - lambda: |-
          if (id(g_sleeping)) {
            id(ring_light)->turn_off().perform();
            return;
          }
          if (id(g_ring_feedback) != 0) return;

          if (id(g_target) == 0) {
            id(g_ring_r) = 0x1E; id(g_ring_g) = 0x90; id(g_ring_b) = 0xFF;
            id(g_ring_brightness) = 0.45f;
          } else if (id(g_target) == 1) {
            id(g_ring_r) = 0x9B; id(g_ring_g) = 0x59; id(g_ring_b) = 0xB6;
            id(g_ring_brightness) = 0.45f;
          } else if (id(g_target) == 2) {
            const bool optimistic = id(g_optimistic_valid) && id(g_optimistic_target) == 2 &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            float kelvin = optimistic && id(g_optimistic_mode) == 1 ? id(g_optimistic_value) :
              (isnan(id(ceiling_light_color_temp).state) ? 4000.0f : id(ceiling_light_color_temp).state);
            if (kelvin < 2000.0f) kelvin = 2000.0f;
            if (kelvin > 6500.0f) kelvin = 6500.0f;
            const float t = (kelvin - 2000.0f) / 4500.0f;
            // Interpolate from warm white to cool white.
            id(g_ring_r) = (int) roundf(255.0f + (221.0f - 255.0f) * t);
            id(g_ring_g) = (int) roundf(210.0f + (235.0f - 210.0f) * t);
            id(g_ring_b) = (int) roundf(161.0f + (255.0f - 161.0f) * t);
            const float raw = optimistic && id(g_optimistic_mode) == 0 ? id(g_optimistic_value) * 2.55f :
              (isnan(id(ceiling_light_brightness).state) ? 0.0f : id(ceiling_light_brightness).state);
            id(g_ring_brightness) = raw / 255.0f;
          } else if (id(g_target) == 3) {
            const bool optimistic = id(g_optimistic_valid) && id(g_optimistic_target) == 3 &&
              millis() - id(g_knob_last_rotate_ms) <= 2000;
            float hue = optimistic && id(g_optimistic_mode) == 1 ? id(g_optimistic_value) :
              (isnan(id(strip_light_hue).state) ? 0.0f : id(strip_light_hue).state);
            hue = fmodf(hue, 360.0f); if (hue < 0.0f) hue += 360.0f;
            const float c = 1.0f;
            const float x = c * (1.0f - fabsf(fmodf(hue / 60.0f, 2.0f) - 1.0f));
            float r = 0, g = 0, b = 0;
            if (hue < 60) { r = c; g = x; }
            else if (hue < 120) { r = x; g = c; }
            else if (hue < 180) { g = c; b = x; }
            else if (hue < 240) { g = x; b = c; }
            else if (hue < 300) { r = x; b = c; }
            else { r = c; b = x; }
            id(g_ring_r) = (int) roundf(r * 255.0f);
            id(g_ring_g) = (int) roundf(g * 255.0f);
            id(g_ring_b) = (int) roundf(b * 255.0f);
            const float raw = optimistic && id(g_optimistic_mode) == 0 ? id(g_optimistic_value) * 2.55f :
              (isnan(id(strip_light_brightness).state) ? 0.0f : id(strip_light_brightness).state);
            id(g_ring_brightness) = raw / 255.0f;
          } else if (id(g_target) == 4 || id(g_target) == 5 || id(g_target) == 6) {
            const std::string mode = id(g_target) == 4 ? id(climate_state).state :
              (id(g_target) == 5 ? id(dining_room_climate_state).state : id(floor_heating_state).state);
            if (mode == "heat") {
              id(g_ring_r) = 0xFF; id(g_ring_g) = 0x6B; id(g_ring_b) = 0x35;
            } else if (mode == "cool") {
              id(g_ring_r) = 0x4F; id(g_ring_g) = 0xC3; id(g_ring_b) = 0xF7;
            } else {
              id(g_ring_r) = 255; id(g_ring_g) = 255; id(g_ring_b) = 255;
            }
            id(g_ring_brightness) = id(g_target) == 4 ? 0.50f : (id(g_target) == 5 ? 0.45f : 0.40f);
          } else if (id(g_control_mode) == 3) {
            // 本机 mode 3 (电量): green while charging, then level-coded green / amber / red.
            if (id(g_charging) || id(g_batt) > 50) { id(g_ring_r) = 0x35; id(g_ring_g) = 0xC7; id(g_ring_b) = 0x59; }
            else if (id(g_batt) < 0) { id(g_ring_r) = 0x61; id(g_ring_g) = 0x76; id(g_ring_b) = 0x81; }
            else if (id(g_batt) > 20) { id(g_ring_r) = 0xFF; id(g_ring_g) = 0xC0; id(g_ring_b) = 0x5A; }
            else { id(g_ring_r) = 0xE6; id(g_ring_g) = 0x64; id(g_ring_b) = 0x72; }
            id(g_ring_brightness) = 0.25f;
          } else {
            id(g_ring_r) = 255; id(g_ring_g) = 255; id(g_ring_b) = 255;
            id(g_ring_brightness) = 0.10f;
          }

          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring State");
          call.perform();

  - id: ring_rotate_feedback
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          id(g_ring_feedback) = 1;
          id(g_ring_direction) = direction >= 0 ? 1 : -1;
          id(g_ring_feedback_started_ms) = millis();
          auto call = id(ring_light)->turn_on();
          call.set_brightness(1.0f);
          call.set_effect("Ring Feedback");
          call.perform();
      - delay: 300ms
      - lambda: 'id(g_ring_feedback) = 0;'
      - script.execute: ring_update_state

  - id: ring_device_feedback
    mode: restart
    then:
