  # [VA] font_va_icons_44 was removed together with the mic glyph: the assistant
  # page now shows the Doubao avatar image instead, so a dedicated 44 px icon
  # face carrying three glyphs is dead weight in flash.
  # Dedicated TV remote icon fonts. Both sizes are embedded so press feedback
  # shrinks the glyph without relying on an undeclared LVGL fallback font.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
